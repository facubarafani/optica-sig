# Render Blueprint — one-click deploy of the SGI Óptica web service.
# Render → New → Blueprint → pick this repo. It reads this file, builds the
# Dockerfile, wires HTTPS, and prompts you for DATABASE_URL (your Neon string).
#
# The database is intentionally NOT defined here: Render's own free Postgres is
# deleted after 30 days, so we use a free Neon Postgres instead (persistent) and
# pass it in via DATABASE_URL. See docs/DEPLOY.md → "Quick start: Render + Neon".
services:
  - type: web
    name: sgi-optica
    runtime: docker
    repo: https://github.com/facubarafani/optica-sig
    branch: main
    region: virginia            # closest Render region to Argentina (~no SA region)
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Both consoles are one service on one origin: app.<domain> opens a shop's
    # console, admin.<domain> the provider's, and main.py picks by Host. They
    # deliberately share an origin because impersonation hands the tenant token
    # over through localStorage (see app/web/admin.html).
    #
    # NOTE: the live service was configured by hand and has drifted from this
    # file (region, health check), so Render does not re-read it. Adding a
    # domain here does NOT attach it — do that in the dashboard under Settings
    # -> Custom Domains. This list records intent for a fresh Blueprint deploy.
    domains:
      - app.miopticadigital.com.ar
      - admin.miopticadigital.com.ar
    envVars:
      - key: DATABASE_URL       # paste your Neon connection string at deploy time
        sync: false             #   (scheme must be postgresql+psycopg2://, keep ?sslmode=require)
      - key: SECRET_KEY
        generateValue: true     # Render generates a secure random value
      - key: SEED_ON_START
        value: "true"           # first deploy seeds demo data; set to false afterwards
      - key: WEB_CONCURRENCY
        value: "1"              # 1 uvicorn worker fits Render's 512 MB free instance
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DEFAULT_COMPANY_ID
        value: "1"
      - key: ENVIRONMENT
        value: "production"   # makes the seed refuse default provider passwords
      # --- Provider (platform) account for /admin -------------------------
      # This login can enter ANY tenant's data, so it never gets a password
      # from the repo. Render generates one; read it in the dashboard under
      # Environment, then change it with:
      #     python -m scripts.platform_admin password <email>
      - key: PLATFORM_ADMIN_EMAIL
        sync: false           # your real email, entered at deploy time
      - key: PLATFORM_ADMIN_PASSWORD
        generateValue: true   # Render generates it; visible in the dashboard
      # --- Email ---------------------------------------------------------
      # Must match the public URL, or invitation links point at localhost.
      # Point this at the custom domain once it resolves — invitation links are
      # built from it, and a link to onrender.com looks like phishing to a shop
      # owner who was told the system lives at miopticadigital.com.ar.
      - key: PUBLIC_BASE_URL
        value: "https://app.miopticadigital.com.ar"
      # `console` only prints — invitations would never reach anyone. Switch to
      # "resend" once the domain is verified in the Resend dashboard.
      - key: EMAIL_BACKEND
        value: "console"
      - key: EMAIL_FROM
        value: "Mi Óptica Digital <no-reply@miopticadigital.com.ar>"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false           # starts with "re_"
      - key: BREVO_API_KEY
        sync: false
