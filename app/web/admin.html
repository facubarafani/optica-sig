<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SGI Óptica — Plataforma</title>
<style>
  /* Deliberately violet where the tenant console is blue. The two apps look
     alike enough to share muscle memory and different enough that nobody
     mistakes "suspender empresa" for a shop screen. */
  :root{
    --bg:#f6f5fa; --panel:#ffffff; --border:#e5e3ee; --text:#1f2937; --muted:#6b7280;
    --primary:#7c3aed; --primary-600:#6d28d9; --primary-50:#f5f0ff;
    --danger:#dc2626; --danger-50:#fef2f2; --ok:#16a34a; --ok-50:#f0fdf4;
    --warn:#d97706; --warn-50:#fffbeb;
    --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 12px 32px rgba(16,24,40,.18); --sidebar:224px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  a{color:var(--primary);text-decoration:none}
  h1,h2,h3{margin:0;font-weight:650}
  /* login */
  .login-wrap{min-height:100%;display:grid;place-items:center;padding:24px}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:370px;max-width:100%;padding:28px}
  .login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .login-card .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
  .login-card h1{font-size:19px}
  .login-card p.sub{color:var(--muted);margin:2px 0 20px;font-size:13px}
  .hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
  /* shell */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100%}
  .sidebar{background:#1b1430;color:#cfc9de;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
  .sidebar .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
  .sidebar .brand b{color:#fff;font-size:15px}
  .sidebar .brand small{display:block;color:#9c93b5;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .nav{padding:6px;overflow:auto;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#cfc9de;font-weight:500;margin:1px 0}
  .nav a .ic{width:18px;height:18px;opacity:.9}
  .nav a:hover{background:#2a2044;color:#fff}
  .nav a.active{background:var(--primary);color:#fff}
  .sidebar .foot{padding:12px;border-top:1px solid #2a2044;font-size:12px;color:#9c93b5}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}
  .topbar .crumb{font-weight:650;font-size:15px}
  .topbar .who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .topbar .who .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700}
  .content{padding:22px;width:100%;min-width:0}
  .menu-btn{display:none;background:none;border:0;font-size:20px;cursor:pointer}
  /* generic */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card.pad{padding:18px}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h2{font-size:20px}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .loading,.empty{padding:38px;text-align:center;color:var(--muted)}
  .btn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
  .btn:hover{background:#faf9fd}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-600)}
  .btn.danger{background:#fff;border-color:#fecaca;color:var(--danger)}
  .btn.danger:hover{background:var(--danger-50)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:#f1eff7}
  .btn.ico{padding:5px 7px;line-height:1;min-width:28px;justify-content:center}
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  .ic.lg{width:18px;height:18px}
  /* inputs */
  label.fld{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px}
  label.fld .req{color:var(--danger)}
  input,select,textarea{width:100%;font:inherit;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
  .searchbox{position:relative;display:inline-flex;align-items:center}
  .searchbox .ic{position:absolute;left:9px;color:var(--muted);pointer-events:none}
  .searchbox input{padding-left:30px;min-width:260px}
  /* table */
  .tbl-wrap{overflow:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}
  thead th{text-align:left;padding:10px;background:#faf9fd;color:#6b6480;font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:9px 10px;border-bottom:1px solid #f4f2f9;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fdfcff}
  tr.inactive{opacity:.55}
  td.actions{text-align:right;white-space:nowrap}
  td.actions .btn{margin-left:4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.trunc{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mono{font-family:var(--mono);font-size:12.5px}
  /* Secondary columns drop as the window narrows, same convention as /app. */
  @media(max-width:1460px){ .col-p3{display:none} }
  @media(max-width:1250px){ .col-p2{display:none} }
  /* row overflow menu */
  .rowmenu{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;min-width:200px}
  .rowmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
    padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-align:left}
  .rowmenu button:hover{background:var(--primary-50);color:var(--primary-600)}
  .rowmenu button.danger{color:var(--danger)}
  .rowmenu button.danger:hover{background:var(--danger-50)}
  .rowmenu .sep{height:1px;background:var(--border);margin:5px 2px}
  /* badges + stats */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.5}
  .badge.green{background:var(--ok-50);color:var(--ok)}
  .badge.gray{background:#f1f5f9;color:#64748b}
  .badge.violet{background:var(--primary-50);color:var(--primary)}
  .badge.amber{background:var(--warn-50);color:var(--warn)}
  .badge.red{background:var(--danger-50);color:var(--danger)}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .stat .v{font-size:28px;font-weight:750;margin-top:8px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(27,20,48,.45);display:grid;place-items:center;padding:20px;z-index:50}
  .modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:520px;max-width:100%;max-height:90vh;display:flex;flex-direction:column}
  .modal.wide{width:760px}
  .modal header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal header h3{font-size:16px}
  .modal .body{padding:20px;overflow:auto}
  .modal footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
  form.form .form-row{margin-bottom:14px}
  form.form.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  form.form.grid2 .form-row{margin-bottom:0}
  form.form.grid2 .form-row.full{grid-column:1/-1}
  .fhelp{font-size:11.5px;color:var(--muted);margin-top:4px}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#374151;font-weight:500;cursor:pointer;user-select:none}
  .switch input{width:auto}
  [hidden]{display:none!important}
  .sect{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    font-weight:700;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--border)}
  form.form.grid2 .sect{grid-column:1/-1}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px}
  .kv dt{color:var(--muted);font-weight:600}
  .kv dd{margin:0}
  /* the credentials handed over after provisioning */
  .creds{background:var(--primary-50);border:1px solid #ddd0fb;border-radius:10px;padding:14px 16px;margin-top:6px}
  .creds dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
  .creds dt{color:var(--muted);font-weight:600}
  .creds dd{margin:0;font-family:var(--mono);font-weight:600}
  .warnbox{background:var(--warn-50);border:1px solid #fde68a;border-radius:8px;padding:10px 12px;
    font-size:12.5px;color:#92400e;margin-top:12px}
  /* toast */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:80}
  .toast{background:#1b1430;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;max-width:380px}
  .toast.err{background:var(--danger)}
  .toast.ok{background:var(--ok)}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .2s}
    .sidebar.open{transform:none}
    .menu-btn{display:block}
    form.form.grid2{grid-template-columns:1fr}
  }
</style>
</head>

<div id="root"></div>
<div id="toasts"></div>

<script>
"use strict";
/* =========================================================================
   SGI Óptica — consola de PLATAFORMA (proveedor), en un solo archivo.
   Alta y soporte de ópticas clientes. Servida en /admin, mismo origen que la
   API, y autenticada con un token de scope "platform": este login no puede
   tocar los datos de una óptica por vías normales, y el login de una óptica
   no puede entrar acá.
   Convención: código en inglés, textos de usuario en español.
   ========================================================================= */

const TOKEN_KEY = "sgi_platform_token";   // distinto del "sgi_token" de /app
const TENANT_TOKEN_KEY = "sgi_token";     // el que lee la consola del cliente
const state = { token: null, user: null, tenants: [] };
const root = document.getElementById("root");

/* ----------------------------- tiny helpers ---------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => (v == null ? "" : String(v).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])));
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const badge = (text, cls) => `<span class="badge ${cls}">${esc(text)}</span>`;

function fmtDate(v) {
  if (!v) return "—";
  const d = new Date(v);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit", year:"numeric" });
}
function fmtDateTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  if (isNaN(d)) return "—";
  return d.toLocaleString("es-AR", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
}

function toast(msg, type = "") {
  const t = el(`<div class="toast ${type}">${esc(msg)}</div>`);
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

/* ----------------------------- API client ------------------------------ */
function errMsg(data, status) {
  if (data == null) return `HTTP ${status}`;
  if (typeof data === "string") return data;
  const d = data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(e => `${(e.loc || []).slice(1).join(".") || "campo"}: ${e.msg}`).join("; ");
  return JSON.stringify(data);
}

async function api(method, path, body) {
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const opts = { method, headers };
  if (body !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (res.status === 401) { logout(); throw new Error("La sesión expiró. Ingresá de nuevo."); }
  if (res.status === 204) return null;
  const txt = await res.text();
  let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch { data = txt; } }
  if (!res.ok) throw new Error(errMsg(data, res.status));
  return data;
}

/* ----------------------------- modal ----------------------------------- */
function openModal({ title, body, onConfirm, confirmLabel = "Guardar", wide = false, danger = false }) {
  const overlay = el(`
    <div class="overlay">
      <div class="modal ${wide ? "wide" : ""}">
        <header><h3>${esc(title)}</h3><button class="x" type="button">&times;</button></header>
        <div class="body"></div>
        <footer>
          <button class="btn" data-act="cancel" type="button">Cancelar</button>
          ${onConfirm ? `<button class="btn ${danger ? "danger" : "primary"}" data-act="ok" type="button">${esc(confirmLabel)}</button>` : ""}
        </footer>
      </div>
    </div>`);
  const bodyEl = $(".body", overlay);
  bodyEl.append(typeof body === "string" ? el(`<div>${body}</div>`) : body);
  const close = () => overlay.remove();
  $(".x", overlay).addEventListener("click", close);
  $('[data-act=cancel]', overlay).addEventListener("click", close);
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(); });
  const ok = $('[data-act=ok]', overlay);
  if (ok) {
    ok.addEventListener("click", async () => {
      ok.disabled = true;
      try { const done = await onConfirm(bodyEl); if (done !== false) close(); }
      catch (err) { toast(err.message || "Error", "err"); }
      finally { ok.disabled = false; }
    });
  }
  document.body.appendChild(overlay);
  const first = $("input,select,textarea", bodyEl);
  if (first) first.focus();
  return { overlay, close, body: bodyEl };
}

function confirmDialog({ title, message, confirmLabel = "Confirmar", danger = false, onConfirm }) {
  return openModal({
    title, body: `<p style="margin:0">${message}</p>`,
    confirmLabel, danger, onConfirm,
  });
}

/* row overflow menu — same convention as the tenant console: at most two
   labelled buttons per row, everything else lives in the ⋯ menu. */
let _openMenu = null;
function openRowMenu(anchor, items) {
  if (_openMenu) { _openMenu.remove(); _openMenu = null; }
  const menu = el(`<div class="rowmenu"></div>`);
  for (const it of items) {
    if (it === "-") { menu.appendChild(el(`<div class="sep"></div>`)); continue; }
    const b = el(`<button type="button" class="${it.danger ? "danger" : ""}">
      ${it.icon ? `<svg class="ic"><use href="#${it.icon}"/></svg>` : ""}${esc(it.label)}</button>`);
    b.addEventListener("click", () => { menu.remove(); _openMenu = null; it.onClick(); });
    menu.appendChild(b);
  }
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.top = `${window.scrollY + r.bottom + 5}px`;
  menu.style.left = `${Math.max(8, window.scrollX + r.right - menu.offsetWidth)}px`;
  _openMenu = menu;
  setTimeout(() => {
    const off = (e) => {
      if (menu.contains(e.target)) return;
      menu.remove(); _openMenu = null; document.removeEventListener("mousedown", off);
    };
    document.addEventListener("mousedown", off);
  }, 0);
}

function logout() {
  state.token = null; state.user = null; state.tenants = [];

function renderLogin() {
  root.innerHTML = `
    <div class="login-wrap">
      <form class="login-card" id="loginForm">
        <div class="brand"><div class="logo">P</div><div><h1>SGI Plataforma</h1></div></div>

        </div>

        </div>

        <div class="hint">Esta no es la consola de una óptica. Para eso, <a href="/app">/app</a>.</div>
      </form>
    </div>`;
  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#loginForm button"); btn.disabled = true; btn.textContent = "Ingresando…";

        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("[name=email]").value.trim(), password: $("[name=password]").value }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(errMsg(data, res.status));

      renderApp();
    } catch (err) {
      toast(err.message || "Error al ingresar", "err");

  });
}

async function route() {

/* A password that is easy to read out over the phone: no ambiguous glyphs. */
function randomPassword() {
  const alphabet = "abcdefghijkmnpqrstuvwxyz23456789";
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  return [...bytes].map(b => alphabet[b % alphabet.length]).join("");
}

function showCredentials(created) {
  const intro = `<p style="margin:0 0 4px">
      <b>${esc(created.company.name)}</b> quedó lista para usar, con sus roles,
      sucursal, lista de precios y numeradores.
    </p>`;

  // Three outcomes worth telling apart: we mailed an invitation, we set a
  // password to read out, or the invitation failed to send and someone has to
  // do something about it.
  let body;
  if (created.admin_password) {
    body = intro + `
      <div class="creds"><dl>
        <dt>Consola</dt><dd>/app</dd>
        <dt>Email</dt><dd>${esc(created.admin_email)}</dd>
        <dt>Contraseña</dt><dd>${esc(created.admin_password)}</dd>
      </dl></div>
      <div class="warnbox">Anotá la contraseña ahora: se guarda hasheada y esta es la única vez que se muestra.</div>`;
  } else if (created.invitation_sent) {
    body = intro + `
      <div class="creds"><dl>
        <dt>Invitación</dt><dd>enviada</dd>
        <dt>Email</dt><dd>${esc(created.admin_email)}</dd>
      </dl></div>
      <p class="fhelp" style="margin-top:10px">Define su propia contraseña desde el enlace. Vence en 7 días; podés reenviarlo desde la ficha de la óptica.</p>`;
  } else {
    body = intro + `
      <div class="warnbox">
        La óptica se creó, pero <b>no se pudo enviar la invitación</b> a
        ${esc(created.admin_email)}. Revisá la configuración de correo
        (EMAIL_BACKEND) y reenviala desde la ficha de la óptica.
      </div>`;
  }
  openModal({ title: "Óptica creada", body });
}

/* The everyday answer to "no me llegó" and to a forgotten password: a fresh
   link, which voids any earlier one. Preferred over choosing a password for
   somebody, because we never learn the credential. */
function resendInvitation(t, u) {
  confirmDialog({
    title: "Reenviar invitación",
    message: `Le mandamos a <b>${esc(u.email)}</b> un enlace nuevo para definir su contraseña.
      Cualquier enlace anterior deja de servir.`,
    confirmLabel: "Enviar",
    onConfirm: async () => {
      const res = await api("POST", `/api/admin/tenants/${t.id}/users/${u.id}/invite`);
      if (res.sent) toast(`Invitación enviada a ${u.email}`, "ok");
      else toast("No se pudo enviar — revisá la configuración de correo", "err");
    },
  });
}

function openResetPassword(t, u) {
  const form = el(`
    <form class="form">
      <p style="margin:0 0 14px">Nueva contraseña para <b>${esc(u.email)}</b> en ${esc(t.name)}.</p>
      <div class="warnbox" style="margin:0 0 14px">Preferí <b>reenviar la invitación</b>: así el dueño elige su
        contraseña y nosotros nunca la conocemos. Usá esto sólo si su email no funciona.</div>
      <div class="form-row">
        <label class="fld">Contraseña <span class="req">*</span></label>
        <input name="new_password" required minlength="8" value="${randomPassword()}">
      </div>
    </form>`);
  openModal({
    title: "Restablecer contraseña", body: form, confirmLabel: "Restablecer", danger: true,
    onConfirm: async () => {
      const pwd = new FormData(form).get("new_password");
      await api("POST", `/api/admin/tenants/${t.id}/users/${u.id}/password`, { new_password: pwd });
      openModal({
        title: "Contraseña restablecida",
        body: `<div class="creds"><dl><dt>Email</dt><dd>${esc(u.email)}</dd>
          <dt>Contraseña</dt><dd>${esc(pwd)}</dd></dl></div>
          <div class="warnbox">Anotala ahora: es la única vez que se muestra.</div>`,
      });
    },
  });
}

/* ----------------------------- auditoría -------------------------------- */
const ACTION_ES = {
  "tenant.create": "Alta de óptica",
  "tenant.update": "Datos editados",
  "tenant.suspend": "Suspendida",
  "tenant.reactivate": "Reactivada",
  "tenant.user_create": "Alta de usuario",
  "tenant.password_reset": "Contraseña restablecida",
  "tenant.impersonate": "Ingreso de soporte",
  "tenant.invite_sent": "Invitación enviada",
};
const ACTION_BADGE = {
  "tenant.create": "green",
  "tenant.update": "gray",
  "tenant.suspend": "red",
  "tenant.reactivate": "green",
  "tenant.user_create": "violet",
  "tenant.password_reset": "amber",
  "tenant.impersonate": "amber",
  "tenant.invite_sent": "violet",
};

async function viewAudit(view) {
  const [rows, tenants] = await Promise.all([
    api("GET", "/api/admin/audit?limit=200"),
    state.tenants.length ? Promise.resolve(state.tenants) : api("GET", "/api/admin/tenants"),
  ]);
  state.tenants = tenants;
  const byId = Object.fromEntries(tenants.map(t => [t.id, t.name]));
  view.innerHTML = `
    <div class="page-head">
      <div><h2>Auditoría</h2>
        <div class="sub">Todo lo que hicimos sobre una óptica — sobre todo, cada ingreso de soporte.</div></div>
    </div>
    ${rows.length ? `<div class="tbl-wrap card"><table>
      <thead><tr><th>Cuándo</th><th>Acción</th><th>Óptica</th><th class="col-p2">Detalle</th></tr></thead>
      <tbody>${rows.map(a => `<tr>
        <td>${fmtDateTime(a.created_at)}</td>
        <td>${badge(ACTION_ES[a.action] || a.action, ACTION_BADGE[a.action] || "gray")}</td>
        <td>${esc(byId[a.company_id] || (a.company_id ? "#" + a.company_id : "—"))}</td>
        <td class="col-p2 trunc" title="${esc(a.detail || "")}">${esc(a.detail || "—")}</td>
      </tr>`).join("")}</tbody></table></div>`
      : `<div class="card empty">Todavía no hay actividad registrada.</div>`}`;
}

/* ----------------------------- boot ------------------------------------- */
(async function boot() {
  state.token = localStorage.getItem(TOKEN_KEY);
  if (!state.token) return renderLogin();
  try {
    state.user = await api("GET", "/api/admin/me");
    renderApp();
  } catch {
    renderLogin();
  }
})();
</script>
