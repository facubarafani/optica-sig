<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SGI Óptica — Plataforma</title>
<style>
  /* Deliberately violet where the tenant console is blue. The two apps look
     alike enough to share muscle memory and different enough that nobody
     mistakes "suspender empresa" for a shop screen. */
  :root{
    --bg:#f6f5fa; --panel:#ffffff; --border:#e5e3ee; --text:#1f2937; --muted:#6b7280; --label:#374151;
    /* Acá está toda la diferencia de los botones con los de la consola de
       tienda: los mismos dos tintes, en violeta. Las reglas son idénticas. */
    --hover:#faf9fd; --press:#f1eff7;
    /* La cápsula es del sistema, el destello no: acá los tokens del destello
       son colores planos. Si el botón de plataforma también viajara a violeta
       terminaría en el mismo #7c3aed de la consola de tienda, y estas dos
       aplicaciones existen separadas justamente para que nadie las confunda. */
    --action:#7c3aed; --action-600:#6d28d9; --action-bloom:#6d28d9;
    --action-bloom-press:#5b21b6; --action-bloom-border:#6d28d9; --action-ring:#f5f0ff;
    --primary:#7c3aed; --primary-600:#6d28d9; --primary-700:#5b21b6; --primary-50:#f5f0ff;
    --danger:#dc2626; --danger-200:#fecaca; --danger-50:#fef2f2; --ok:#16a34a; --ok-50:#f0fdf4;
    --warn:#d97706; --warn-50:#fffbeb;
    --radius:10px; --radius-sm:7px; --radius-control:12px; --radius-pill:999px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 12px 32px rgba(16,24,40,.18); --sidebar:224px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  a{color:var(--primary);text-decoration:none}
  h1,h2,h3{margin:0;font-weight:650}
  /* login */
  .login-wrap{min-height:100%;display:grid;place-items:center;padding:24px}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:370px;max-width:100%;padding:28px}
  .login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .login-card .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
  .login-card h1{font-size:19px}
  .login-card p.sub{color:var(--muted);margin:2px 0 20px;font-size:13px}
  .hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
  /* shell */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100%}
  .sidebar{background:#1b1430;color:#cfc9de;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
  .sidebar .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
  .sidebar .brand b{color:#fff;font-size:15px}
  .sidebar .brand small{display:block;color:#9c93b5;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .nav{padding:6px;overflow:auto;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#cfc9de;font-weight:500;margin:1px 0}
  .nav a .ic{width:18px;height:18px;opacity:.9}
  .nav a:hover{background:#2a2044;color:#fff}
  .nav a.active{background:var(--primary);color:#fff}
  .sidebar .foot{padding:12px;border-top:1px solid #2a2044;font-size:12px;color:#9c93b5}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}
  .topbar .crumb{font-weight:650;font-size:15px}
  .topbar .who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .topbar .who .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700}
  .content{padding:22px;width:100%;min-width:0}
  .menu-btn{display:none;background:none;border:0;font-size:20px;cursor:pointer}
  /* generic */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card.pad{padding:18px}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h2{font-size:20px}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .loading,.empty{padding:38px;text-align:center;color:var(--muted)}
  /* Copia exacta de las reglas de la consola de tienda: lo único violeta lo
     ponen --hover y --press del :root. Si cambia una, cambian las dos. */
  .btn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 17px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);transition:background .12s,border-color .12s,box-shadow .12s,color .12s}
  .btn:hover:not(:disabled){background:var(--hover)}
  .btn:active:not(:disabled){background:var(--press)}
  .btn:focus{outline:none}
  .btn:focus-visible{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.primary{background:var(--action);border-color:var(--action-600);color:#fff;position:relative;z-index:0}
  /* Un degradado no interpola: `transition:background` de un color plano a
     linear-gradient() no anima nada, salta. Por eso el destello es una capa
     propia que se desvanece encima del índigo. `z-index:-1` con el botón en
     `z-index:0` la deja arriba del fondo y abajo del texto y del ícono. */
  .btn.primary::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
    background:var(--action-bloom);opacity:0;transition:opacity .24s ease}
  /* Entra más rápido de lo que sale: al salir se apaga de a poco, que es lo
     que lo hace parecer luz y no un interruptor. */
  .btn.primary:hover:not(:disabled)::before{opacity:1;transition:opacity .16s ease-out}
  /* `background` acá parece redundante contra la regla de arriba, pero es lo
     que sostiene todo: sin él gana `.btn:hover` (una clase menos, pero un
     estado más) y el fondo pasa a --hover, que es casi blanco. Con la capa
     del destello a media opacidad se ve ese blanco por debajo y el botón
     destella en blanco antes de llegar al degradado. */
  .btn.primary:hover:not(:disabled){background:var(--action);border-color:var(--action-bloom-border)}
  /* Apretar es inmediato: un botón que tarda en hundirse se siente roto. */
  .btn.primary:active:not(:disabled)::before{background:var(--action-bloom-press);opacity:1;transition:none}
  .btn.primary:active:not(:disabled){background:var(--action);border-color:var(--action-bloom-border)}
  .btn.primary:focus-visible{border-color:var(--action-bloom-border);box-shadow:0 0 0 3px var(--action-ring)}
  /* Quien pidió menos movimiento ve el mismo destello, sin el desvanecido. */
  @media(prefers-reduced-motion:reduce){
    .btn.primary::before,.btn.primary:hover:not(:disabled)::before{transition:none}
  }
  .btn.danger{background:var(--panel);border-color:var(--danger-200);color:var(--danger)}
  .btn.danger:hover:not(:disabled){background:var(--danger-50)}
  .btn.danger:active:not(:disabled){background:var(--danger-50);border-color:var(--danger)}
  .btn.danger:focus-visible{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-50)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover:not(:disabled){background:var(--press)}
  .btn.ico{padding:5px;line-height:1;min-width:28px;justify-content:center}
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  .ic.lg{width:18px;height:18px}
  /* inputs */
  label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--label);margin-bottom:5px}
  label.fld .req{color:var(--danger)}
  input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-control);padding:8px 10px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
  .searchbox{position:relative;display:inline-flex;align-items:center}
  .searchbox .ic{position:absolute;left:9px;color:var(--muted);pointer-events:none}
  .searchbox input{padding-left:30px;min-width:260px}
  /* table */
  .tbl-wrap{overflow:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}
  thead th{text-align:left;padding:10px;background:#faf9fd;color:#6b6480;font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:9px 10px;border-bottom:1px solid #f4f2f9;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fdfcff}
  tr.inactive{opacity:.55}
  td.actions{text-align:right;white-space:nowrap}
  td.actions .btn{margin-left:4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.trunc{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mono{font-family:var(--mono);font-size:12.5px}
  /* Secondary columns drop as the window narrows, same convention as /app. */
  @media(max-width:1460px){ .col-p3{display:none} }
  @media(max-width:1250px){ .col-p2{display:none} }
  /* row overflow menu */
  .rowmenu{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;min-width:200px}
  .rowmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
    padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-align:left}
  .rowmenu button:hover{background:var(--primary-50);color:var(--primary-600)}
  .rowmenu button.danger{color:var(--danger)}
  .rowmenu button.danger:hover{background:var(--danger-50)}
  .rowmenu .sep{height:1px;background:var(--border);margin:5px 2px}
  /* badges + stats */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.5}
  .badge.green{background:var(--ok-50);color:var(--ok)}
  .badge.gray{background:#f1f5f9;color:#64748b}
  .badge.violet{background:var(--primary-50);color:var(--primary)}
  .badge.amber{background:var(--warn-50);color:var(--warn)}
  .badge.red{background:var(--danger-50);color:var(--danger)}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .stat .v{font-size:28px;font-weight:750;margin-top:8px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(27,20,48,.45);display:grid;place-items:center;padding:20px;z-index:50}
  .modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:520px;max-width:100%;max-height:90vh;display:flex;flex-direction:column}
  .modal.wide{width:760px}
  .modal header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal header h3{font-size:16px}
  .modal .body{padding:20px;overflow:auto}
  .modal footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
  /* El aire es de la fila, no de quien la envuelve: con `form.` adelante la
     tarjeta de ingreso (form.login-card) no lo recibía y lo parchaba con un
     margin inline. Mismo criterio que en la consola de tienda. */
  .form-row{margin-bottom:14px}
  .form.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .form.grid2 .form-row{margin-bottom:0}
  .form.grid2 .form-row.full{grid-column:1/-1}
  .fhelp{font-size:11.5px;color:var(--muted);margin-top:4px}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--label);font-weight:500;cursor:pointer;user-select:none}
  .switch input{width:auto}
  [hidden]{display:none!important}
  .sect{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    font-weight:700;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--border)}
  .form.grid2 .sect{grid-column:1/-1}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px}
  .kv dt{color:var(--muted);font-weight:600}
  .kv dd{margin:0}
  /* the credentials handed over after provisioning */
  .creds{background:var(--primary-50);border:1px solid #ddd0fb;border-radius:10px;padding:14px 16px;margin-top:6px}
  .creds dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
  .creds dt{color:var(--muted);font-weight:600}
  .creds dd{margin:0;font-family:var(--mono);font-weight:600}
  .warnbox{background:var(--warn-50);border:1px solid #fde68a;border-radius:8px;padding:10px 12px;
    font-size:12.5px;color:#92400e;margin-top:12px}
  /* toast */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:80}
  .toast{background:#1b1430;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;max-width:380px}
  .toast.err{background:var(--danger)}
  .toast.ok{background:var(--ok)}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .2s}
    .sidebar.open{transform:none}
    .menu-btn{display:block}
    .form.grid2{grid-template-columns:1fr}
  }
</style>
</head>

<script>
"use strict";
/* =========================================================================
   SGI Óptica — consola de PLATAFORMA (proveedor), en un solo archivo.
   Alta y soporte de ópticas clientes. Servida en /admin, mismo origen que la
   API, y autenticada con un token de scope "platform": este login no puede
   tocar los datos de una óptica por vías normales, y el login de una óptica
   no puede entrar acá.
   Convención: código en inglés, textos de usuario en español.
   ========================================================================= */

const TOKEN_KEY = "sgi_platform_token";   // distinto del "sgi_token" de /app
const TENANT_TOKEN_KEY = "sgi_token";     // el que lee la consola del cliente
const state = { token: null, user: null, tenants: [] };
const root = document.getElementById("root");

/* ----------------------------- tiny helpers ---------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => (v == null ? "" : String(v).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])));
/* Una <label> sin `for` no etiqueta nada: el clic no enfoca el campo y un
   lector de pantalla anuncia el control sin nombre. Mismo criterio que en la
   consola de tienda: en vez de repartir ids a mano, cada `.fld` toma el primer
   control de su fila sobre lo que se va agregando al DOM. */
let _fldSeq = 0;
function linkFields(scope) {
  const labels = scope.querySelectorAll ? scope.querySelectorAll("label.fld:not([for])") : [];
  for (const lab of labels) {
    if (lab.querySelector("input,select,textarea")) continue;
    const row = lab.closest(".form-row") || lab.parentElement;
    if (!row) continue;
    const ctl = row.querySelector("input,select,textarea");
    if (!ctl) continue;
    if (!ctl.id) ctl.id = "f" + (++_fldSeq);
    lab.setAttribute("for", ctl.id);
  }
}
new MutationObserver(muts => {
  for (const m of muts)
    for (const n of m.addedNodes)
      if (n.nodeType === 1) linkFields(n);
}).observe(document.documentElement, { childList: true, subtree: true });

const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const badge = (text, cls) => `<span class="badge ${cls}">${esc(text)}</span>`;

function fmtDate(v) {
  if (!v) return "—";
  // A plain "2019-03-01" is a calendar day: read as UTC midnight it would
  // show the day before in Argentina, so it is built in local time.
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(v);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit", year:"numeric" });
}
function fmtDateTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  if (isNaN(d)) return "—";
  return d.toLocaleString("es-AR", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
}

function toast(msg, type = "") {
  const t = el(`<div class="toast ${type}">${esc(msg)}</div>`);
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

/* ----------------------------- API client ------------------------------ */
function errMsg(data, status) {
  if (data == null) return `HTTP ${status}`;
  if (typeof data === "string") return data;
  const d = data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(e => `${(e.loc || []).slice(1).join(".") || "campo"}: ${e.msg}`).join("; ");
  return JSON.stringify(data);
}

async function api(method, path, body) {
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const opts = { method, headers };
  if (body !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (res.status === 401) { logout(); throw new Error("La sesión expiró. Ingresá de nuevo."); }
  if (res.status === 204) return null;
  const txt = await res.text();
  let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch { data = txt; } }
  if (!res.ok) throw new Error(errMsg(data, res.status));
  return data;
}

/* ----------------------------- modal ----------------------------------- */
function openModal({ title, body, onConfirm, confirmLabel = "Guardar", wide = false, danger = false }) {
  const overlay = el(`
    <div class="overlay">
      <div class="modal ${wide ? "wide" : ""}">
        <header><h3>${esc(title)}</h3><button class="x" type="button">&times;</button></header>
        <div class="body"></div>
        ${onConfirm ? `<footer>
          <button class="btn" data-act="cancel" type="button">Cancelar</button>
          <button class="btn ${danger ? "danger" : "primary"}" data-act="ok" type="button">${esc(confirmLabel)}</button>
        </footer>` : ""}
      </div>
    </div>`);
  const bodyEl = $(".body", overlay);
  bodyEl.append(typeof body === "string" ? el(`<div>${body}</div>`) : body);
  const close = () => overlay.remove();
  $(".x", overlay).addEventListener("click", close);
  const cancelBtn = $('[data-act=cancel]', overlay);
  if (cancelBtn) cancelBtn.addEventListener("click", close);
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(); });
  const ok = $('[data-act=ok]', overlay);
  if (ok) {
    ok.addEventListener("click", async () => {
      ok.disabled = true;
      try { const done = await onConfirm(bodyEl); if (done !== false) close(); }
      catch (err) { toast(err.message || "Error", "err"); }
      finally { ok.disabled = false; }
    });
  }
  document.body.appendChild(overlay);
  const first = $("input,select,textarea", bodyEl);
  if (first) first.focus();
  return { overlay, close, body: bodyEl };
}

function confirmDialog({ title, message, confirmLabel = "Confirmar", danger = false, onConfirm }) {
  return openModal({
    title, body: `<p style="margin:0">${message}</p>`,
    confirmLabel, danger, onConfirm,
  });
}

/* row overflow menu — same convention as the tenant console: at most two
   labelled buttons per row, everything else lives in the ⋯ menu. */
let _openMenu = null;
function openRowMenu(anchor, items) {
  if (_openMenu) { _openMenu.remove(); _openMenu = null; }
  const menu = el(`<div class="rowmenu"></div>`);
  for (const it of items) {
    if (it === "-") { menu.appendChild(el(`<div class="sep"></div>`)); continue; }
    const b = el(`<button type="button" class="${it.danger ? "danger" : ""}">
      ${it.icon ? `<svg class="ic"><use href="#${it.icon}"/></svg>` : ""}${esc(it.label)}</button>`);
    b.addEventListener("click", () => { menu.remove(); _openMenu = null; it.onClick(); });
    menu.appendChild(b);
  }
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.top = `${window.scrollY + r.bottom + 5}px`;
  menu.style.left = `${Math.max(8, window.scrollX + r.right - menu.offsetWidth)}px`;
  _openMenu = menu;
  setTimeout(() => {
    const off = (e) => {
      if (menu.contains(e.target)) return;
      menu.remove(); _openMenu = null; document.removeEventListener("mousedown", off);
    };
    document.addEventListener("mousedown", off);
  }, 0);
}

/* A password that is easy to read out over the phone: no ambiguous glyphs. */
function randomPassword() {
  const alphabet = "abcdefghijkmnpqrstuvwxyz23456789";
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  return [...bytes].map(b => alphabet[b % alphabet.length]).join("");
}

      <dt>Moneda</dt><dd>${esc(t.currency)}</dd>
      <dt>Estado</dt><dd>${t.is_active ? badge("Activa","green") : badge("Suspendida","red")}</dd>
      <dt>Alta</dt><dd>${fmtDate(t.created_at)}</dd>
    </dl>
    <div class="sect">Facturación electrónica</div>
    <div id="invoicingBox"><div class="fhelp">Consultando arca-api…</div></div>
    <div class="sect">Usuarios (${users.length})</div>
    <div class="tbl-wrap" style="border:1px solid var(--border)">
      <table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
      <tbody>${users.map(u => `
        <tr data-uid="${u.id}">
          <td>${esc(u.full_name)}</td>
          <td class="mono">${esc(u.email)}</td>
          <td>${u.is_superuser ? badge("Admin","violet") : badge("Staff","gray")}</td>
          <td>${u.is_active ? badge("Activo","green") : badge("Inactivo","gray")}</td>
          <td class="actions">
            <button class="btn sm ico" data-act="invite" title="Reenviar invitación por email">
              <svg class="ic"><use href="#i-mail"/></svg></button>
            <button class="btn sm ico" data-act="pwd" title="Definir contraseña yo">
              <svg class="ic"><use href="#i-key"/></svg></button>
          </td>
        </tr>`).join("")}</tbody></table>
    </div>
    <div class="sect">Actividad de plataforma</div>
    ${audit.length ? `<div class="tbl-wrap" style="border:1px solid var(--border)">
      <table><thead><tr><th>Cuándo</th><th>Acción</th><th>Detalle</th></tr></thead>
      <tbody>${audit.map(a => `<tr>
        <td>${fmtDateTime(a.created_at)}</td>
        <td>${badge(ACTION_ES[a.action] || a.action, ACTION_BADGE[a.action] || "gray")}</td>
        <td class="trunc" title="${esc(a.detail || "")}">${esc(a.detail || "—")}</td>
      </tr>`).join("")}</tbody></table></div>`
      : `<div class="empty" style="padding:20px">Sin actividad registrada.</div>`}
  </div>`);

  $$('[data-act=pwd]', body).forEach(btn => btn.addEventListener("click", () => {
    const uid = Number(btn.closest("tr").dataset.uid);
    openResetPassword(t, users.find(x => x.id === uid));
  }));
  $$('[data-act=invite]', body).forEach(btn => btn.addEventListener("click", () => {
    const uid = Number(btn.closest("tr").dataset.uid);
    resendInvitation(t, users.find(x => x.id === uid));
  }));

  openModal({ title: t.name, body, wide: true });
  paintInvoicing($("#invoicingBox", body), t);
}

/* --- facturación electrónica --------------------------------------------
   The link between a shop and its arca-api issuer decides whose CUIT its
   sales are invoiced under, so only this console makes it. The shop then
   sees a Facturar button on its sales. */
const IVA_ES = { responsable_inscripto: "Responsable Inscripto", monotributo: "Monotributista", exento: "Exento" };
// "submitted" is the one that needs us: the shop finished its steps at ARCA.
const INVOICING_BADGE = { active: ["Activa", "green"], paused: ["Pausada", "gray"],
  submitted: ["Por activar", "amber"], draft: ["En la guía", "gray"] };
const fmtCuit = (c) => (c && /^\d{11}$/.test(c)) ? `${c.slice(0, 2)}-${c.slice(2, 10)}-${c.slice(10)}` : (c || "");
const CREDENTIAL_ES = { ACTIVE: "activa", AWAITING_CERTIFICATE: "esperando certificado",
  NOT_CONFIGURED: "sin configurar", EXPIRED: "vencida" };
const FISCAL = [["commercial_address", "commercialAddress", "domicilio comercial"],
  ["gross_income_tax", "grossIncomeTax", "Ingresos Brutos"],
  ["activity_start_date", "activityStartDate", "inicio de actividades"],
  ["trade_name", "tradeName", "nombre de fantasía"]];

async function paintInvoicing(box, t) {
  let inv;
  try { inv = await api("GET", `/api/admin/tenants/${t.id}/invoicing`); }
  catch (e) { box.innerHTML = `<div class="warnbox">${esc(e.message)}</div>`; return; }
  if (!box.isConnected) return;
  if (!inv.linked && inv.request) {
    box.innerHTML = requestPanel(inv);
  } else if (!inv.linked) {
    box.innerHTML = `<p class="fhelp" style="margin:0 0 10px">${inv.configured
        ? "Todavía no completó la guía de Empresa, Facturación electrónica. Se puede activar igual con sus datos."
        : "Este servidor no tiene arca-api configurado (ARCA_API_URL y ARCA_API_KEY)."}</p>
      ${inv.configured ? `<button class="btn primary sm" type="button" data-inv="link">
        <svg class="ic"><use href="#i-receipt"/></svg>Activar facturación</button>` : ""}`;
  } else {
    const issuer = inv.issuer || {};
    const missing = FISCAL.filter(([, key]) => (issuer.missingForPdf || []).includes(key)).map(f => f[2]);
    const cred = issuer.credential || {};
    box.innerHTML = `
      <dl class="kv">
        <dt>Emisor</dt><dd class="mono">${esc(inv.issuer_id)}</dd>
        <dt>CUIT</dt><dd class="mono">${esc(inv.cuit)}</dd>
        <dt>Razón social</dt><dd>${esc(inv.legal_name)}</dd>
        <dt>Condición IVA</dt><dd>${esc(IVA_ES[inv.iva_condition] || inv.iva_condition)}
          (${inv.iva_condition === "responsable_inscripto" ? "facturas A y B" : "factura C"})</dd>
        <dt>Punto de venta</dt><dd class="mono">${inv.point_of_sale}</dd>
        <dt>Estado</dt><dd>${inv.is_active ? badge("Activa","green") : badge("Pausada","gray")}${
          cred.status ? ` <span class="fhelp">credencial ${esc(CREDENTIAL_ES[cred.status] || cred.status)}</span>` : ""}</dd>
      </dl>
      ${inv.error ? `<div class="warnbox" style="margin-top:10px">arca-api no respondió: ${esc(inv.error)}</div>` : ""}
      ${(t.tax_id || "").replace(/\D/g, "") && (t.tax_id || "").replace(/\D/g, "") !== inv.cuit
        ? `<div class="warnbox" style="margin-top:10px">El emisor factura con el CUIT ${esc(inv.cuit)}, que no es el de la
            óptica (${esc(t.tax_id)}). Sus ventas salen a nombre de ese CUIT.</div>` : ""}
      ${missing.length ? `<div class="warnbox" style="margin-top:10px">Para imprimir comprobantes falta: ${esc(missing.join(", "))}.</div>` : ""}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn sm" type="button" data-inv="health"><svg class="ic"><use href="#i-shield"/></svg>Chequear con ARCA</button>
        <button class="btn sm" type="button" data-inv="edit"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>
      </div>`;
  }
  const on = (act, fn) => { const b = $(`[data-inv=${act}]`, box); if (b) b.addEventListener("click", fn); };
  const repaint = () => paintInvoicing(box, t);
  on("link", () => openLinkInvoicing(t, repaint, inv.request));
  on("edit", () => openEditInvoicing(t, inv, repaint));
  on("health", () => showInvoicingHealth(t));
  on("note", () => openInvoicingNote(t, inv.request, repaint));
}

/* What the shop sent from its guide, beside ARCA's padrón for that CUIT: the
   IVA condition can never change once registered, so it is checked against
   the source here, before Activar. Then our own two steps at ARCA. */
function requestPanel(inv) {
  const r = inv.request, tp = inv.taxpayer;
  const declared = r.iva_condition;
  const suggested = tp && tp.ivaCondition && tp.ivaCondition.suggested
    ? tp.ivaCondition.suggested.toLowerCase() : null;
  const clash = suggested && declared && suggested !== declared;
  const address = tp && tp.fiscalAddress
    ? [tp.fiscalAddress.address, tp.fiscalAddress.locality, tp.fiscalAddress.province].filter(Boolean).join(", ") : "";
  return `
    <p style="margin:0 0 10px">${r.submitted_at
      ? `${badge("Por activar","amber")} La óptica envió sus datos el ${fmtDate(r.submitted_at)}.`
      : `${badge("En la guía","gray")} La óptica empezó la guía pero todavía no la envió.`}</p>
    <dl class="kv">
      <dt>CUIT</dt><dd class="mono">${esc(fmtCuit(r.cuit))}</dd>
      <dt>Razón social</dt><dd>${esc(r.legal_name || "-")}</dd>
      <dt>Condición IVA</dt><dd>${esc(IVA_ES[declared] || declared || "-")}</dd>
      <dt>Punto de venta</dt><dd class="mono">${esc(String(r.point_of_sale || "-"))}</dd>
      <dt>Domicilio comercial</dt><dd>${esc(r.commercial_address || "-")}</dd>
      <dt>Ingresos Brutos</dt><dd>${esc(r.gross_income_tax || "-")}</dd>
      <dt>Inicio de actividades</dt><dd>${r.activity_start_date ? fmtDate(r.activity_start_date) : "-"}</dd>
    </dl>
    <div class="sect" style="margin-top:14px">Padrón de ARCA</div>
    ${tp ? `<dl class="kv">
        <dt>Nombre</dt><dd>${esc(tp.name || "-")}${tp.keyStatus && tp.keyStatus !== "ACTIVO" ? " " + badge(tp.keyStatus, "red") : ""}</dd>
        <dt>Condición sugerida</dt><dd>${esc(IVA_ES[suggested] || "sin sugerencia")}
          <span class="fhelp">${esc((tp.ivaCondition && tp.ivaCondition.reason) || "")}</span></dd>
        <dt>Domicilio fiscal</dt><dd>${esc(address || "-")}</dd>
      </dl>
      ${clash ? `<div class="warnbox" style="margin-top:10px">ARCA sugiere <b>${esc(IVA_ES[suggested])}</b> y la óptica
        declaró <b>${esc(IVA_ES[declared] || declared)}</b>. Confirmalo antes de activar: no se puede cambiar después.</div>` : ""}`
      : `<p class="fhelp" style="margin:0">${esc(inv.taxpayer_error || "Sin CUIT para consultar.")}</p>`}
    ${r.provider_note ? `<div class="warnbox" style="margin-top:10px"><b>Nuestro mensaje:</b> ${esc(r.provider_note)}</div>` : ""}
    <div class="sect" style="margin-top:14px">Antes de activar, en ARCA con nuestra Clave Fiscal</div>
    <ol style="margin:0;padding-left:18px;font-size:13px;line-height:1.6">
      <li><b>Aceptación de Designación</b>: aceptá la delegación de ${esc(fmtCuit(r.cuit))} (figura como pendiente).
        <a href="https://www.afip.gob.ar/guias/paso-a-paso/Como-delego-servicios-para-que-utilicen-en-mi-nombre-como-se-acepta-delegacion.pdf#page=8"
          target="_blank" rel="noopener">Instructivo de ARCA</a></li>
      <li><b>Administrador de Relaciones</b>: elegí ${esc(fmtCuit(r.cuit))} como representado, <b>Nueva Relación</b>,
        WebServices, <b>Facturación Electrónica</b>, y como representante nuestro computador fiscal.
        <a href="https://www.afip.gob.ar/ws/WSAA/ADMINREL.DelegarWS.pdf#page=11" target="_blank" rel="noopener">Instructivo de ARCA</a></li>
    </ol>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn primary sm" type="button" data-inv="link"><svg class="ic"><use href="#i-receipt"/></svg>Activar</button>
      <button class="btn sm" type="button" data-inv="note"><svg class="ic"><use href="#i-mail"/></svg>Dejar un mensaje</button>
    </div>`;
}

function openInvoicingNote(t, request, onDone) {
  const form = el(`<form class="form">
      <div class="form-row"><label class="fld">Mensaje para la óptica</label>
        <textarea name="note" maxlength="500" rows="4" placeholder="Todavía no vemos la delegación de Facturación Electrónica: revisá el paso 2.">${esc(request.provider_note || "")}</textarea>
        <div class="fhelp">Lo ve en su guía y le llega por email. Vacío, se borra.</div></div>
    </form>`);
  openModal({
    title: `Mensaje · ${t.name}`, body: form, confirmLabel: "Enviar",
    onConfirm: async () => {
      const note = new FormData(form).get("note") || "";
      await api("PUT", `/api/admin/tenants/${t.id}/invoicing/note`, { note });
      toast(note.trim() ? "Mensaje enviado" : "Mensaje borrado", "ok");
      onDone();
    },
  });
}

function fiscalRows(values) {
  return `<div class="sect">Lo que imprime el comprobante</div>
    <div class="form-row full"><label class="fld">Domicilio comercial</label>
      <input name="commercial_address" value="${esc(values.commercial_address || "")}" placeholder="Desde donde factura"></div>
    <div class="form-row"><label class="fld">Ingresos Brutos</label>
      <input name="gross_income_tax" value="${esc(values.gross_income_tax || "")}" placeholder="901-123456-7, o Exento"></div>
    <div class="form-row"><label class="fld">Inicio de actividades</label>
      <input name="activity_start_date" type="date" value="${esc(values.activity_start_date || "")}"></div>
    <div class="form-row full"><label class="fld">Nombre de fantasía</label>
      <input name="trade_name" value="${esc(values.trade_name || "")}"></div>`;
}

function openLinkInvoicing(t, onDone, request) {
  const r = request || {};
  const form = el(`
    <form class="form grid2">
      <div class="form-row full"><div class="warnbox">
        Antes, en ARCA: la óptica delega <b>Facturación Electrónica</b> en nuestro CUIT y crea un punto
        de venta para web services; nosotros aceptamos la delegación y autorizamos el certificado.
        El paso a paso está en el README de arca-api, y el chequeo con ARCA dice qué falta.
      </div></div>
      <div class="form-row"><label class="fld">CUIT <span class="req">*</span></label>
        <input name="cuit" value="${esc(r.cuit || (t.tax_id || "").replace(/\D/g, ""))}" placeholder="20123456789" inputmode="numeric"></div>
      <div class="form-row"><label class="fld">Condición frente al IVA <span class="req">*</span></label>
        <select name="iva_condition">
          <option value="">(elegí una: no se puede cambiar después)</option>
          <option value="monotributo">Monotributista (factura C)</option>
          <option value="responsable_inscripto">Responsable Inscripto (A y B)</option>
          <option value="exento">Exento (factura C)</option>
        </select></div>
      <div class="form-row"><label class="fld">Razón social</label>
        <input name="legal_name" value="${esc(r.legal_name || t.legal_name || t.name)}"></div>
      <div class="form-row"><label class="fld">Punto de venta <span class="req">*</span></label>
        <input name="point_of_sale" type="number" min="1" max="99998" value="${esc(String(r.point_of_sale || ""))}" required></div>
      ${fiscalRows({
        commercial_address: r.commercial_address || t.address, gross_income_tax: r.gross_income_tax,
        activity_start_date: r.activity_start_date, trade_name: r.trade_name || t.name })}
      <div class="form-row full"><label class="fld">Emisor que ya existe en arca-api (opcional)</label>
        <input name="issuer_id" placeholder="iss_…">
        <div class="fhelp">Sólo si se dio de alta a mano. Si no, se registra con los datos de arriba.</div></div>
    </form>`);
  // The condition the shop declared comes preselected; the choice stays explicit.
  if (r.iva_condition) $("[name=iva_condition]", form).value = r.iva_condition;
  openModal({
    title: `Activar facturación · ${t.name}`, body: form, wide: true, confirmLabel: "Activar",
    onConfirm: async () => {
      const data = Object.fromEntries(new FormData(form).entries());
      for (const k of Object.keys(data)) if (data[k] === "") delete data[k];
      if (!data.point_of_sale) { toast("Indicá el punto de venta", "err"); return false; }
      // arca-api cannot change it later, and it decides every comprobante's class.
      if (!data.issuer_id && !data.iva_condition) { toast("Elegí la condición frente al IVA", "err"); return false; }
      data.point_of_sale = Number(data.point_of_sale);
      if (data.issuer_id) { delete data.cuit; delete data.iva_condition; delete data.legal_name; }
      await api("POST", `/api/admin/tenants/${t.id}/invoicing`, data);
      toast("Facturación activada", "ok");
      onDone();
    },
  });
}

function openEditInvoicing(t, inv, onDone) {
  const issuer = inv.issuer || {};
  const current = Object.fromEntries(FISCAL.map(([field, key]) => [field, issuer[key] || ""]));
  const form = el(`
    <form class="form grid2">
      <div class="form-row"><label class="fld">Punto de venta</label>
        <input name="point_of_sale" type="number" min="1" max="99998" value="${inv.point_of_sale}"></div>
      <div class="form-row"><label class="fld">&nbsp;</label>
        <label class="switch"><input type="checkbox" name="is_active" ${inv.is_active ? "checked" : ""}> Facturación activa</label></div>
      ${fiscalRows(current)}
      <div class="form-row full fhelp">El CUIT y la condición frente al IVA no cambian: con ellos se emitió cada comprobante.</div>
    </form>`);
  openModal({
    title: `Facturación · ${t.name}`, body: form, wide: true,
    onConfirm: async () => {
      const data = Object.fromEntries(new FormData(form).entries());
      const body = { is_active: data.is_active === "on" };
      if (data.point_of_sale) body.point_of_sale = Number(data.point_of_sale);
      // Only what changed, so the audit says what was actually edited.
      for (const [field] of FISCAL) if (data[field] && data[field] !== current[field]) body[field] = data[field];
      await api("PATCH", `/api/admin/tenants/${t.id}/invoicing`, body);
      toast("Facturación actualizada", "ok");
      onDone();
    },
  });
}

async function showInvoicingHealth(t) {
  let h;
  try { h = await api("GET", `/api/admin/tenants/${t.id}/invoicing/health`); }
  catch (e) { toast(e.message, "err"); return; }
  const line = (label, part) => `<dt>${label}</dt><dd>${part.ok ? badge("OK","green") : badge("Falla","red")}${
    part.error ? ` <span class="fhelp">${esc(part.error)}</span>` : ""}</dd>`;
  const points = (h.invoicing.pointsOfSale || [])
    .map(p => `${p.number}${p.blocked ? " (bloqueado)" : ""}`).join(", ");
  openModal({
    title: `Chequeo con ARCA · ${t.name}`,
    body: `<dl class="kv">
        ${line("ARCA", h.arca)}
        ${line("Autenticación", h.authentication)}
        ${line("Facturación", h.invoicing)}
        <dt>Puntos de venta</dt><dd>${esc(points || "ninguno informado (homologación no tiene)")}</dd>
      </dl>
      ${h.invoicing.ok ? "" : `<p class="fhelp" style="margin-top:10px">Si ARCA dice que el CUIT no aparece en la
        lista de relaciones, falta la delegación o su aceptación. Puede tardar hasta 24 h en propagarse.</p>`}`,
  });
}

function openAddAdmin(t) {
  const form = el(`
    <form class="form grid2">
      <div class="form-row"><label class="fld">Nombre <span class="req">*</span></label><input name="full_name" value="Administrador" required></div>
      <div class="form-row"><label class="fld">Email <span class="req">*</span></label><input name="email" type="email" required></div>
      <div class="form-row full">
        <label class="fld">&nbsp;</label>
        <label class="switch"><input type="checkbox" name="use_password"> Definir la contraseña yo</label>
        <div class="fhelp">Por defecto recibe un correo para elegirla. Se crea como administrador de <b>${esc(t.name)}</b>, con acceso total dentro de su empresa.</div>
      </div>
      <div class="form-row full" id="pwdRow2" hidden>
        <label class="fld">Contraseña</label>
        <input name="password" minlength="8" value="${randomPassword()}">
      </div>
    </form>`);
  $("[name=use_password]", form).addEventListener("change", (e) => {
    $("#pwdRow2", form).hidden = !e.target.checked;
  });
  openModal({
    title: `Nuevo administrador — ${t.name}`, body: form, wide: true, confirmLabel: "Crear",
    onConfirm: async () => {
      const data = Object.fromEntries(new FormData(form).entries());
      const usePassword = data.use_password === "on";
      delete data.use_password;
      if (!usePassword) delete data.password;
      if (usePassword && (data.password || "").length < 8) {
        toast("La contraseña necesita al menos 8 caracteres", "err"); return false;
      }
      const res = await api("POST", `/api/admin/tenants/${t.id}/users`, data);
      openModal({
        title: "Administrador creado",
        body: res.password
          ? `<div class="creds"><dl>
               <dt>Email</dt><dd>${esc(data.email)}</dd>
               <dt>Contraseña</dt><dd>${esc(res.password)}</dd>
             </dl></div>
             <div class="warnbox">Anotala ahora: es la única vez que se muestra.</div>`
          : res.invitation_sent
            ? `<div class="creds"><dl>
                 <dt>Invitación</dt><dd>enviada</dd>
                 <dt>Email</dt><dd>${esc(data.email)}</dd>
               </dl></div>`
            : `<div class="warnbox">El usuario se creó, pero no se pudo enviar la
                 invitación a ${esc(data.email)}. Reenviala desde la ficha.</div>`,
      });
      route();
    },
  });
}

/* The everyday answer to "no me llegó" and to a forgotten password: a fresh
   link, which voids any earlier one. Preferred over choosing a password for
   somebody, because we never learn the credential. */
function resendInvitation(t, u) {
  confirmDialog({
    title: "Reenviar invitación",
    message: `Le mandamos a <b>${esc(u.email)}</b> un enlace nuevo para definir su contraseña.
      Cualquier enlace anterior deja de servir.`,
    confirmLabel: "Enviar",
    onConfirm: async () => {
      const res = await api("POST", `/api/admin/tenants/${t.id}/users/${u.id}/invite`);
      if (res.sent) toast(`Invitación enviada a ${u.email}`, "ok");
      else toast("No se pudo enviar — revisá la configuración de correo", "err");
    },
  });
}

function openResetPassword(t, u) {
  const form = el(`
    <form class="form">
      <p style="margin:0 0 14px">Nueva contraseña para <b>${esc(u.email)}</b> en ${esc(t.name)}.</p>
      <div class="warnbox" style="margin:0 0 14px">Preferí <b>reenviar la invitación</b>: así el dueño elige su
        contraseña y nosotros nunca la conocemos. Usá esto sólo si su email no funciona.</div>
      <div class="form-row">
        <label class="fld">Contraseña <span class="req">*</span></label>
        <input name="new_password" required minlength="8" value="${randomPassword()}">
      </div>
    </form>`);
  openModal({
    title: "Restablecer contraseña", body: form, confirmLabel: "Restablecer", danger: true,
    onConfirm: async () => {
      const pwd = new FormData(form).get("new_password");
      await api("POST", `/api/admin/tenants/${t.id}/users/${u.id}/password`, { new_password: pwd });
      openModal({
        title: "Contraseña restablecida",
        body: `<div class="creds"><dl><dt>Email</dt><dd>${esc(u.email)}</dd>
          <dt>Contraseña</dt><dd>${esc(pwd)}</dd></dl></div>
          <div class="warnbox">Anotala ahora: es la única vez que se muestra.</div>`,
      });
    },
  });
}

/* ----------------------------- auditoría -------------------------------- */
const ACTION_ES = {
  "tenant.create": "Alta de óptica",
  "tenant.update": "Datos editados",
  "tenant.suspend": "Suspendida",
  "tenant.reactivate": "Reactivada",
  "tenant.user_create": "Alta de usuario",
  "tenant.password_reset": "Contraseña restablecida",
  "tenant.impersonate": "Ingreso de soporte",
  "tenant.invite_sent": "Invitación enviada",
  "tenant.invoicing_link": "Facturación vinculada",
  "tenant.invoicing_update": "Facturación editada",
  "tenant.invoicing_note": "Mensaje de facturación",
};
const ACTION_BADGE = {
  "tenant.create": "green",
  "tenant.update": "gray",
  "tenant.suspend": "red",
  "tenant.reactivate": "green",
  "tenant.user_create": "violet",
  "tenant.password_reset": "amber",
  "tenant.impersonate": "amber",
  "tenant.invite_sent": "violet",
  "tenant.invoicing_link": "green",
  "tenant.invoicing_update": "gray",
  "tenant.invoicing_note": "amber",
};

async function viewAudit(view) {
  const [rows, tenants] = await Promise.all([
    api("GET", "/api/admin/audit?limit=200"),
    state.tenants.length ? Promise.resolve(state.tenants) : api("GET", "/api/admin/tenants"),
  ]);
  state.tenants = tenants;
  const byId = Object.fromEntries(tenants.map(t => [t.id, t.name]));
  view.innerHTML = `
    <div class="page-head">
      <div><h2>Auditoría</h2>
        <div class="sub">Todo lo que hicimos sobre una óptica — sobre todo, cada ingreso de soporte.</div></div>
    </div>
    ${rows.length ? `<div class="tbl-wrap card"><table>
      <thead><tr><th>Cuándo</th><th>Acción</th><th>Óptica</th><th class="col-p2">Detalle</th></tr></thead>
      <tbody>${rows.map(a => `<tr>
        <td>${fmtDateTime(a.created_at)}</td>
        <td>${badge(ACTION_ES[a.action] || a.action, ACTION_BADGE[a.action] || "gray")}</td>
        <td>${esc(byId[a.company_id] || (a.company_id ? "#" + a.company_id : "—"))}</td>
        <td class="col-p2 trunc" title="${esc(a.detail || "")}">${esc(a.detail || "—")}</td>
      </tr>`).join("")}</tbody></table></div>`
      : `<div class="card empty">Todavía no hay actividad registrada.</div>`}`;
}

/* ----------------------------- boot ------------------------------------- */
(async function boot() {
  state.token = localStorage.getItem(TOKEN_KEY);
  if (!state.token) return renderLogin();
  try {
    state.user = await api("GET", "/api/admin/me");
    renderApp();
  } catch {
    renderLogin();
  }
})();
</script>
</body>
</html>
