async function resourceView(container, cfg, opts = {}) {
  const writable = can(cfg.perm + ":write");
  let showInactive = !!opts.showInactive;
  // Optional id→name maps for columns that render a FK (see cfg.maps).
  const maps = {};
  for (const [name, endpoint] of Object.entries(cfg.maps || {})) {
    maps[name] = await idMap(endpoint);
  }
  async function load() {
    const list = await api("GET", cfg.endpoint + (showInactive ? "?include_inactive=true" : ""));
    paint(list);
  }
  const editFields = (mode, row) => {
    let f = cfg.fields.slice();
    if (typeof cfg.fields === "function") f = cfg.fields(mode, row);
    if (mode === "edit" && cfg.softDelete) f = f.concat([{ key:"is_active", label:"Activo", type:"checkbox" }]);
    return f;
  };
  async function openForm(mode, row) {
    const fields = editFields(mode, row);
    // Some entities carry data that lives in its own endpoint (e.g. a
    // supplier's brands, an N-N relation). cfg.loadExtra/saveExtra handle it.
    let values = row || {};
    if (mode === "edit" && cfg.loadExtra) values = { ...values, ...(await cfg.loadExtra(row)) };
    formModal({
      title: mode === "edit" ? cfg.editTitle : cfg.newTitle,
      fields, values, grid: cfg.grid,
      onSubmit: async (payload) => {
        const extra = {};
        for (const k of (cfg.extraKeys || [])) { extra[k] = payload[k]; delete payload[k]; }
        const saved = mode === "edit"
          ? await api("PUT", cfg.endpoint + "/" + row.id, payload)
          : await api("POST", cfg.endpoint, payload);
        if (cfg.saveExtra) await cfg.saveExtra(saved.id, extra);
        clearOptions(); toast("Guardado", "ok"); await load();
      },
    });
  }
  function actions(r) {
    if (!writable) return "";
    let h = `<button class="btn sm" data-act="edit" data-id="${r.id}"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>`;
    if (cfg.softDelete && !r.is_active) h += `<button class="btn sm" data-act="restore" data-id="${r.id}"><svg class="ic"><use href="#i-rotate"/></svg>Restaurar</button>`;
    else h += `<button class="btn sm danger" data-act="del" data-id="${r.id}"><svg class="ic"><use href="#i-ban"/></svg>Desactivar</button>`;
    return h;
  }
  function paint(list) {
    container.innerHTML = `
      <div class="page-head">
        <div><h2>${esc(cfg.title)}</h2><div class="sub">${list.length} registro(s)</div></div>
        <div class="toolbar" style="margin:0">
          ${cfg.softDelete ? `<label class="switch"><input type="checkbox" id="inact" ${showInactive ? "checked" : ""}> Ver inactivos</label>` : ""}
          ${writable ? `<button class="btn primary" id="newBtn"><svg class="ic"><use href="#i-plus"/></svg>Nuevo</button>` : ""}
        </div>
      </div>
      ${renderTable(cfg.columns, list, writable ? actions : null, maps)}`;
    const nb = $("#newBtn", container); if (nb) nb.addEventListener("click", () => openForm("create"));
    const ic = $("#inact", container); if (ic) ic.addEventListener("change", () => { showInactive = ic.checked; load(); });
    $$("[data-act]", container).forEach(b => b.addEventListener("click", async () => {
      const id = b.dataset.id, row = list.find(x => String(x.id) === id);
      if (b.dataset.act === "edit") openForm("edit", row);
      else if (b.dataset.act === "restore") { await api("PUT", cfg.endpoint + "/" + id, { is_active:true }); clearOptions(); toast("Restaurado", "ok"); load(); }
      else confirmDanger({ title:"Desactivar", message:`¿Desactivar "${row.name || row.code || id}"? Se ocultará pero no se elimina.`, confirmLabel:"Desactivar",
        onConfirm: async () => { await api("DELETE", cfg.endpoint + "/" + id); clearOptions(); toast("Desactivado", "ok"); load(); } });
    }));
  }
  await load();
}

function renderTabs(container, head, tabs) {
  container.innerHTML = `<div class="page-head"><div><h2>${esc(head)}</h2></div></div>
    <div class="tabs">${tabs.map((t,i) => `<button data-i="${i}" class="${i===0?"active":""}">${esc(t.label)}</button>`).join("")}</div>
    <div id="tabbody"></div>`;
  const body = $("#tabbody", container);
  const show = (i) => { $$(".tabs button", container).forEach(b => b.classList.toggle("active", Number(b.dataset.i) === i)); body.innerHTML = ""; tabs[i].render(body); };
  $$(".tabs button", container).forEach(b => b.addEventListener("click", () => show(Number(b.dataset.i))));
  show(0);
}

/* Exports use the *import* column layout, so a file can be exported, edited in
   Excel and uploaded again. Formats mirror what the importer accepts. */
const EXPORT_FORMATS = [
  { fmt:"xlsx", label:"Excel (.xlsx)", icon:"i-sheet" },
  { fmt:"csv",  label:"CSV",           icon:"i-download" },
];

function downloadExport(spec, fmt, params = {}) {
  const qs = new URLSearchParams({ format: fmt });
  for (const [k, v] of Object.entries(params)) if (v) qs.set(k, v);
  apiDownload(`/api/imports/${spec}/export?${qs}`, `${spec}.${fmt}`);
}

/* `specs`: [{key, label}] — one group of formats per spec. */
function openExportMenu(anchor, specs, params = {}) {
  const items = [];
  specs.forEach((s, i) => {
    if (i) items.push({ sep:true });
    for (const f of EXPORT_FORMATS) {
      items.push({
        icon: f.icon,
        label: specs.length > 1 ? `${s.label} · ${f.label}` : f.label,
        onClick: () => downloadExport(s.key, f.fmt, params),
      });
    }
  });
  openRowMenu(anchor, items);
}

/* =======================================================================
   IMPORT WIZARD  (subir → mapear → previsualizar → confirmar)
   One component for every import target; the columns come from
   /api/imports/specs, so adding a target on the backend needs no UI change.
   ======================================================================= */
let _specsCache = null;
async function importSpecs() {
  if (!_specsCache) _specsCache = await api("GET", "/api/imports/specs").catch(() => []);
  return _specsCache;
}

async function canImport(specKey) {
  return (await importSpecs()).some(s => s.key === specKey);
}

async function openImportWizard(specKey, onDone) {
  const spec = (await importSpecs()).find(s => s.key === specKey);
  if (!spec) return toast("No tenés permisos para esta importación", "err");

  const body = el(`<div class="wizard"></div>`);
  const close = openModal({ title: `Importar — ${spec.label}`, body, wide: true });
  // Sólo los productos pueden traer el color escondido en el código.
  const pasos = spec.key === "products"
    ? ["Archivo", "Columnas", "Colores", "Revisión"] : ["Archivo", "Columnas", "Revisión"];
  // Lo que ya se respondió en el paso Colores: sobrevive a ir y volver.
  let colores = null;
  step1();

  // El mismo mapa que el alta de productos: un asistente se ve igual en toda la
  // app. Declaración y no `const`: step1() corre antes de llegar a esta línea.
  function head(paso) { return stepMap(pasos, pasos.indexOf(paso)); }

  /* ---- 1. plantilla + archivo ---- */
  function step1() {
    body.innerHTML = `${head("Archivo")}
      <p class="sub">${esc(spec.description)}</p>
      <div class="card pad" style="margin-bottom:14px">
        <b>¿No tenés el archivo armado?</b>
        <div class="fhelp" style="margin:4px 0 10px">Descargá la plantilla con las columnas correctas y una hoja "Referencia" con los valores válidos ya cargados.</div>
        <button class="btn" id="tpl"><svg class="ic"><use href="#i-sheet"/></svg>Descargar plantilla .xlsx</button>
      </div>
      <div class="card pad">
        <b>Subí tu archivo</b>
        <div class="fhelp" style="margin:4px 0 10px">.xlsx o .csv. Si el proveedor te manda PDF, convertilo a Excel primero. Máx. 5.000 filas.</div>
        <input type="file" id="file" accept=".xlsx,.xlsm,.csv,.txt">
      </div>
      <div id="err"></div>`;
    $("#tpl", body).addEventListener("click", () =>
      apiDownload(`/api/imports/${spec.key}/template`, `plantilla-${spec.key}.xlsx`));
    $("#file", body).addEventListener("change", async (e) => {
      const f = e.target.files[0]; if (!f) return;
      $("#err", body).innerHTML = `<div class="fhelp">Leyendo ${esc(f.name)}…</div>`;
      try { step2(await apiUpload(`/api/imports/${spec.key}/upload`, f)); }
      catch (ex) { $("#err", body).innerHTML = `<div class="fwarn">${esc(ex.message)}</div>`; }
    });
  }

  /* ---- 2. mapeo de columnas ---- */
  function step2(up, prev) {
    // Al volver, lo que ya se había asignado; la primera vez, lo sugerido.
    const mapeo = prev?.mapping || up.suggested_mapping;
    const opt = (sel) => `<option value="">— ignorar —</option>` + up.headers
      .map(h => `<option value="${esc(h)}" ${h === sel ? "selected" : ""}>${esc(h)}</option>`).join("");
    body.innerHTML = `${head("Columnas")}
      <p class="sub"><b>${esc(up.filename)}</b> — ${up.row_count} fila(s). Confirmá a qué campo corresponde cada columna.</p>
      <div class="card pad" style="margin-bottom:12px">
        <label class="fld">Formato de números</label>
        <div class="radios">
          <label><input type="radio" name="decfmt" value="es" checked> 1.234,56 (Argentina)</label>
          <label><input type="radio" name="decfmt" value="en"> 1,234.56 (inglés)</label>
        </div>
        <div class="fhelp">No se adivina: con un solo separador "1.500" puede ser 1500 o 1,5.</div>
      </div>
      <table><thead><tr><th>Campo</th><th>Columna del archivo</th></tr></thead>
        <tbody>${spec.fields.map(f => `<tr>
          <td>${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ""}
              ${f.help ? `<div class="fhelp">${esc(f.help)}</div>` : ""}</td>
          <td><select data-key="${esc(f.key)}">${opt(mapeo[f.key])}</select></td>
        </tr>`).join("")}</tbody></table>
      <div id="err"></div>
      <div class="toolbar" style="justify-content:flex-end">
        <button class="btn primary" id="next">${spec.key === "products" ? "Siguiente" : "Previsualizar"}<svg class="ic"><use href="#i-arrow-right"/></svg></button>
      </div>`;
    $("#next", body).addEventListener("click", async () => {
      const mapping = {};
      $$("[data-key]", body).forEach(s => { if (s.value) mapping[s.dataset.key] = s.value; });
      const opts = {
        mapping,
        decimal_format: body.querySelector('[name="decfmt"]:checked').value,
        create_missing: true,
      };
      if (leeColores(opts)) {
        // Otra columna como Código: lo respondido antes ya no aplica.
        if (colores && colores.codeHeader !== mapping.code) colores = null;
        if (!colores?.skipped) {
          try {
            const cc = colores?.analysis || await analizarCodigos(up, mapping);
            if (cc.separator && (cc.likely || colores)) return stepColors(up, opts, cc);
          } catch (ex) { /* el paso es una ayuda: si falla, se sigue sin él */ }
        }
      }
      preview(up, opts);
    });
  }

  function leeColores(opts) {
    // Con "Producto base" asignado también: las filas que ya nombran su base
    // quedan fuera del análisis, no el archivo entero.
    return spec.key === "products" && !!opts.mapping.code;
  }

  function analizarCodigos(up, mapping, regla = {}) {
    return api("POST", `/api/imports/batches/${up.batch_id}/code-colors`, { mapping, ...regla });
  }

  async function preview(up, opts) {
    try { step3(up, opts, await api("POST", `/api/imports/batches/${up.batch_id}/preview`, opts)); }
    catch (ex) { $("#err", body).innerHTML = `<div class="fwarn">${esc(ex.message)}</div>`; }
  }

  /* ---- 2b. el color escondido en el código ----
     El servidor propone la regla (separador y palabras) y qué es cada
     terminación; acá se confirma. Nada se aplica hasta que todas tengan
     respuesta, y el servidor lo vuelve a exigir al previsualizar. */
  function stepColors(up, opts, cc) {
    if (!cc.separator) {
      $("#err", body).innerHTML = `<div class="fwarn">Los códigos no tienen separadores, así que no hay un color que leer al final.</div>`;
      return;
    }
    if (!colores) colores = { codeHeader: opts.mapping.code, decisions: {} };
    colores.analysis = cc;
    colores.skipped = false;
    const dec = colores.decisions;
    // Lo sugerido entra como respuesta; lo que ya se cambió a mano se respeta.
    cc.tails.forEach(t => { if (!dec[t.phrase] && t.kind) dec[t.phrase] = { kind: t.kind, colors: t.colors }; });

    const clave = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase();
    const hex = Object.fromEntries(cc.colors.map(c => [clave(c.name), c.hex_code]));
    const existe = new Set(cc.colors.map(c => clave(c.name)));
    const nombres = [...new Map([...cc.colors.map(c => c.name), ...Object.values(dec).flatMap(d => d.colors)]
      .map(n => [clave(n), n])).values()].sort((a, b) => a.localeCompare(b, "es"));

    const pendiente = (t) => { const d = dec[t.phrase]; return !d || (d.kind === "color" && !d.colors.length); };
    const faltan = () => cc.tails.filter(pendiente).length;
    const filas = (ts) => ts.reduce((n, t) => n + t.rows, 0);
    const grupos = new Map();
    cc.tails.forEach(t => {
      const g = pendiente(t) ? "pending" : dec[t.phrase].kind === "color" ? "c:" + dec[t.phrase].colors.join(" + ") : dec[t.phrase].kind;
      if (!grupos.has(g)) grupos.set(g, []);
      grupos.get(g).push(t);
    });
    const rank = (g) => g === "pending" ? 0 : g.startsWith("c:") ? 1 : g === "supplier_number" ? 2 : 3;
    const orden = [...grupos.keys()].sort((a, b) => rank(a) - rank(b) || filas(grupos.get(b)) - filas(grupos.get(a)));

    const SEP = { " ": "un espacio", "-": "un guion (-)", "/": "una barra (/)", ".": "un punto (.)", "_": "un guion bajo (_)" };
    const score = Object.fromEntries(cc.candidates.map(c => [c.separator, c.score]));
    const seps = [...new Set([cc.separator, ...cc.candidates.map(c => c.separator), " ", "-", "/", "."])];
    const sepOpt = (s) => `<option value="${esc(s)}" ${s === cc.separator ? "selected" : ""}>${esc(SEP[s] || `"${s}"`)}${score[s] != null ? ` (${Math.round(score[s] * 100)}%)` : ""}</option>`;

    function selector(t) {
      const d = dec[t.phrase];
      const actual = !d ? "" : d.kind !== "color" ? d.kind
        : d.colors.length === 1 ? "c:" + d.colors[0] : d.colors.length ? "m:" + d.colors.join("|") : "other";
      const o = (v, label) => `<option value="${esc(v)}" ${v === actual ? "selected" : ""}>${esc(label)}</option>`;
      // Una pista (BLACK G15 → Negro) se ofrece primero, pero no se elige sola.
      const pista = !d && t.source === "partial" && t.colors.length
        ? o((t.colors.length === 1 ? "c:" : "m:") + t.colors.join("|"), `${t.colors.join(" + ")} (sugerido)`) : "";
      return `<select data-phrase="${esc(t.phrase)}">
        ${d ? "" : `<option value="" selected>(elegí)</option>`}${pista}
        ${actual.startsWith("m:") ? o(actual, d.colors.join(" + ")) : ""}
        <optgroup label="Colores">${nombres.map(n => o("c:" + n, existe.has(clave(n)) ? n : `${n} (nuevo)`)).join("")}</optgroup>
        <optgroup label="Otra respuesta">
          ${o("supplier_number", "Número del proveedor")}${o("not_color", "No es un color")}${o("other", "Otro color o varios…")}
        </optgroup>
      </select>
      <input class="ccotro" data-phrase="${esc(t.phrase)}" placeholder="Ej.: Negro, Azul" value="${esc(actual === "other" ? "" : (d?.colors || []).join(", "))}" ${actual === "other" ? "" : "hidden"}>`;
    }

    function cabecera(g, ts) {
      const muestra = ts.slice(0, 8).map(t => t.phrase).join(", ") + (ts.length > 8 ? "…" : "");
      let titulo;
      if (g === "pending") titulo = `<svg class="ic" style="color:var(--warn)"><use href="#i-alert"/></svg><b>Sin decidir</b>`;
      else if (g === "supplier_number") titulo = `<b>Número del proveedor</b>`;
      else if (g === "not_color") titulo = `<b>No es un color</b>`;
      else {
        const ns = g.slice(2).split(" + ");
        titulo = ns.map(n => swatchCell(hex[clave(n)], "")).join("") + `<b>${esc(g.slice(2))}</b>`
          + (ns.some(n => !existe.has(clave(n))) ? ` <span class="badge blue">nuevo</span>` : "");
      }
      return `<summary><svg class="ic chev"><use href="#i-chevron-down"/></svg>${titulo}<span class="phr">${esc(muestra)}</span><span class="n">${filas(ts)} fila(s)</span></summary>`;
    }

    const cuerpo = (g, ts) => `
      ${g === "pending" ? `<div class="ccbulk"><span class="fhelp">Elegí una por una, o respondé todas juntas:</span>
          ${ts.some(t => t.source === "partial" && t.colors.length) ? `<button class="btn sm" type="button" data-bulk="hints">Usar las sugeridas (${ts.filter(t => t.source === "partial" && t.colors.length).length})</button>` : ""}
          <button class="btn sm" type="button" data-bulk="not_color">Ninguna es un color</button>
          <button class="btn sm" type="button" data-bulk="supplier_number">Todas son números del proveedor</button></div>` : ""}
      ${g === "supplier_number" ? `<div class="ccbulk fhelp">Agrupan los colores de un mismo modelo pero no dicen cuál es: el color queda vacío para completarlo después.</div>` : ""}
      <table><thead><tr><th>Terminación</th><th class="num">Filas</th><th>Ejemplo</th><th>Es</th></tr></thead>
      <tbody>${ts.map(t => `<tr>
        <td class="mono">${esc(t.phrase)}${!dec[t.phrase] && t.source === "partial" && t.colors.length ? `<div class="fhelp">¿${esc(t.colors.join(" + "))}?</div>` : ""}</td>
        <td class="num">${t.rows}</td>
        <td class="mono trunc" title="${esc(t.examples.join(", "))}">${esc(t.examples[0] || "")}</td>
        <td>${selector(t)}</td>
      </tr>`).join("")}</tbody></table>`;

    body.innerHTML = `${head("Colores")}
      <p class="sub">Los códigos de <b>${esc(up.filename)}</b> parecen traer el color al final. Revisá cómo se leen y qué es cada terminación: las respuestas quedan guardadas para la próxima importación.</p>
      <div class="card pad" style="margin-bottom:12px">
        <label class="fld">Cómo se lee el código</label>
        <div class="ccrule">El color va después de <select id="ccSep">${seps.map(sepOpt).join("")}</select>
          y ocupa hasta <select id="ccWords">${[1, 2, 3].map(n => `<option ${n === cc.max_words ? "selected" : ""}>${n}</option>`).join("")}</select> palabra(s).</div>
        <div class="ccsplit">${cc.examples.map(x => `<span class="mono">${esc(x.stem)} <span class="tail">${esc(x.tail)}</span></span>`).join("")}</div>
        <div class="fhelp">${cc.remembered ? "Es la regla que usaste la última vez. " : ""}El ${Math.round(cc.score * 100)}% de las filas termina en algo que se comporta como un color.${cc.rows_without_tail ? ` ${cc.rows_without_tail} fila(s) no tienen terminación y entran como productos sueltos.` : ""}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Terminaciones distintas</div><div class="v">${cc.tails.length}</div></div>
        <div class="stat"><div class="k">Sin decidir</div><div class="v" id="ccFaltan">${faltan()}</div></div>
      </div>
      <div id="ccGroups">${orden.map(g => `<details class="card ccgroup" data-g="${esc(g)}" ${g === "pending" ? "open" : ""}>${cabecera(g, grupos.get(g))}<div class="ccbody"></div></details>`).join("")}</div>
      <div id="err"></div>
      <div class="toolbar" style="justify-content:space-between;margin-top:12px">
        <button class="btn" id="back"><svg class="ic"><use href="#i-arrow-left"/></svg>Volver</button>
        <div class="toolbar" style="margin:0">
          <button class="btn" id="skip">Los códigos no traen color</button>
          <button class="btn primary" id="next"></button>
        </div>
      </div>`;

    // Cada grupo se dibuja al abrirlo: cientos de selectores de golpe pesan.
    const abrir = (det) => {
      const b = det.querySelector(".ccbody");
      if (!b.innerHTML) b.innerHTML = cuerpo(det.dataset.g, grupos.get(det.dataset.g));
    };
    $$("details.ccgroup", body).forEach(det => {
      if (det.open) abrir(det);
      det.addEventListener("toggle", () => det.open && abrir(det));
    });

    const boton = $("#next", body);
    const refrescar = () => {
      const n = faltan();
      $("#ccFaltan", body).textContent = n;
      boton.disabled = n > 0;
      boton.innerHTML = n ? `Faltan decidir ${n}` : `Previsualizar<svg class="ic"><use href="#i-arrow-right"/></svg>`;
    };
    refrescar();

    const grupoEl = $("#ccGroups", body);
    const responder = (e) => {
      const phrase = e.target.dataset.phrase;
      if (!phrase) return;
      if (e.target.tagName === "SELECT") {
        const v = e.target.value, otro = e.target.parentElement.querySelector(".ccotro");
        otro.hidden = v !== "other";
        if (v === "other") { dec[phrase] = { kind: "color", colors: [] }; otro.value = ""; otro.focus(); }
        else if (v === "") delete dec[phrase];
        else if (v.startsWith("c:")) dec[phrase] = { kind: "color", colors: [v.slice(2)] };
        else if (v.startsWith("m:")) dec[phrase] = { kind: "color", colors: v.slice(2).split("|") };
        else dec[phrase] = { kind: v, colors: [] };
      } else {
        dec[phrase] = { kind: "color", colors: [...new Set(e.target.value.split(",").map(s => s.trim()).filter(Boolean))] };
      }
      refrescar();
    };
    grupoEl.addEventListener("change", responder);
    grupoEl.addEventListener("input", (e) => { if (e.target.tagName === "INPUT") responder(e); });
    grupoEl.addEventListener("click", (e) => {
      const b = e.target.closest("[data-bulk]");
      if (!b) return;
      cc.tails.filter(pendiente).forEach(t => {
        if (b.dataset.bulk !== "hints") dec[t.phrase] = { kind: b.dataset.bulk, colors: [] };
        else if (t.source === "partial" && t.colors.length) dec[t.phrase] = { kind: "color", colors: t.colors };
      });
      stepColors(up, opts, cc);
    });

    const otraRegla = async () => {
      try {
        stepColors(up, opts, await analizarCodigos(up, opts.mapping, {
          separator: $("#ccSep", body).value, max_words: Number($("#ccWords", body).value),
        }));
      } catch (ex) { $("#err", body).innerHTML = `<div class="fwarn">${esc(ex.message)}</div>`; }
    };
    $("#ccSep", body).addEventListener("change", otraRegla);
    $("#ccWords", body).addEventListener("change", otraRegla);

    $("#back", body).addEventListener("click", () => step2(up, opts));
    $("#skip", body).addEventListener("click", () => { colores.skipped = true; delete opts.code_colors; preview(up, opts); });
    boton.addEventListener("click", () => {
      if (faltan()) return;
      opts.code_colors = {
        separator: cc.separator, max_words: cc.max_words,
        decisions: Object.fromEntries(cc.tails.map(t => [t.phrase, dec[t.phrase]])),
      };
      preview(up, opts);
    });
  }

  /* ---- 3. vista previa + confirmación ---- */
  function step3(up, opts, pv) {
    const errRows = pv.errors.length ? `
      <div class="card pad" style="margin-bottom:12px">
        <b style="color:var(--danger)">Filas con problemas (${pv.errors.length})</b>
        <div class="errlist">${pv.errors.slice(0, 50).map(e =>
          `<div>Fila ${e.row}: ${esc(e.message)}</div>`).join("")}
          ${pv.errors.length > 50 ? `<div class="fhelp">…y ${pv.errors.length - 50} más.</div>` : ""}</div>
        <div class="fhelp" style="margin-top:8px">Corregí el archivo y volvé a subirlo. No se importa nada hasta que no haya errores.</div>
      </div>` : "";

    const missing = pv.missing_refs.length ? `
      <div class="card pad" style="margin-bottom:12px">
        <b>No existen todavía en el catálogo</b>
        <div class="fhelp" style="margin:4px 0 8px">Se crean automáticamente al confirmar.</div>
        <div class="checklist">${pv.missing_refs.map(m =>
          `<label><input type="checkbox" checked disabled> ${esc(m.label)}: <b>${esc(m.name)}</b></label>`).join("")}</div>
      </div>` : "";

    // Las familias que salen de leer el color en los códigos: se ven antes de
    // escribir nada, con lo que ya existía marcado aparte.
    const familias = pv.families?.length ? `
      <div class="card pad" style="margin-bottom:12px">
        <b>Familias por color (${pv.family_count})</b>
        <div class="fhelp" style="margin:4px 0 8px">Cada base agrupa los colores de un modelo. Las bases nuevas se crean al confirmar.</div>
        <div>${pv.families.slice(0, 30).map(f => `<div class="ccfam">
          <div><span class="mono">${esc(f.base)}</span>${f.new ? ` <span class="badge blue">base nueva</span>` : ""}</div>
          <div class="ccvars">${f.variants.map(v => `<span><span class="mono">${esc(v.code)}</span> ${v.colors.length ? esc(v.colors.join(" + ")) : `<span class="ccmuted">sin color</span>`}${v.status === "moved" ? ` <span class="badge amber">ya existía</span>` : v.status === "existing" ? ` <span class="badge gray">ya estaba</span>` : ""}</span>`).join("")}</div>
        </div>`).join("")}</div>
        ${pv.family_count > 30 ? `<div class="fhelp">…y ${pv.family_count - 30} más.</div>` : ""}
      </div>` : "";
    const revisar = leeColores(opts) && !opts.code_colors ? `
      <div class="fhelp" style="margin-bottom:12px">¿Los códigos traen el color al final? <a href="#" id="ccOpen">Revisarlos</a></div>` : "";

    body.innerHTML = `${head("Revisión")}
      <div class="stats">
        <div class="stat"><div class="k">Se crean</div><div class="v">${pv.to_create}</div></div>
        <div class="stat"><div class="k">Se actualizan</div><div class="v">${pv.to_update}</div></div>
        <div class="stat"><div class="k">Con error</div><div class="v" style="color:${pv.errors.length ? "var(--danger)" : "inherit"}">${pv.errors.length}</div></div>
      </div>
      ${errRows}${familias}${missing}${revisar}
      <div id="err"></div>
      <div class="toolbar" style="justify-content:space-between">
        <button class="btn" id="back"><svg class="ic"><use href="#i-arrow-left"/></svg>Volver</button>
        <button class="btn primary" id="go" ${pv.ok ? "" : "disabled"}>
          ${pv.ok ? `Confirmar ${pv.to_create + pv.to_update} fila(s)` : "Corregí los errores para continuar"}</button>
      </div>`;
    $("#back", body).addEventListener("click", () =>
      opts.code_colors && colores ? stepColors(up, opts, colores.analysis) : step2(up, opts));
    const ccOpen = $("#ccOpen", body);
    if (ccOpen) ccOpen.addEventListener("click", async (e) => {
      e.preventDefault();
      try { colores = null; stepColors(up, opts, await analizarCodigos(up, opts.mapping)); }
      catch (ex) { $("#err", body).innerHTML = `<div class="fwarn">${esc(ex.message)}</div>`; }
    });
    const go = $("#go", body);
    if (go && pv.ok) go.addEventListener("click", async () => {
      go.disabled = true;
      try {
        const res = await api("POST", `/api/imports/batches/${up.batch_id}/commit`, opts);
        const created = Object.entries(res.created_refs || {})
          .map(([k, v]) => `${k}: ${v.join(", ")}`).join(" · ");
        toast(`Importado — ${res.created} nuevo(s), ${res.updated} actualizado(s)`, "ok");
        if (created) toast("Se crearon " + created, "ok");
        close();
        if (onDone) await onDone();
      } catch (ex) {
        go.disabled = false;
        $("#err", body).innerHTML = `<div class="fwarn">${esc(ex.message)}</div>`;
      }
    });
  }
}

/* =======================================================================
   DASHBOARD
   ======================================================================= */
async function dashboardView(view) {
  const want = [
    ["products:read", "Productos", "/api/products"],
    ["customers:read", "Clientes", "/api/customers"],
    ["suppliers:read", "Proveedores", "/api/suppliers"],
    ["branches:read", "Sucursales", "/api/branches"],
    ["pricing:read", "Listas de precios", "/api/price-lists"],
    ["users:read", "Usuarios", "/api/users"],
  ].filter(([p]) => can(p));
  const counts = await Promise.all(want.map(([, , ep]) => api("GET", ep).then(r => r.length).catch(() => "—")));
  const stats = want.map(([, label], i) => `<div class="stat"><div class="k">${esc(label)}</div><div class="v">${counts[i]}<small> ${counts[i] === 100 ? "+ (máx)" : ""}</small></div></div>`).join("");

  let lowStockHtml = "";
  if (can("stock:read")) {
    try {
      // Let the API decide what "low" means — it compares against the branch
      // override *or* the product default, which the old client-side filter on
      // min_stock alone could not see (it is almost always null).
      const low = await api("GET", "/api/stock/levels?low_only=true");
      const pmap = can("products:read") ? await idMap("/api/products", "code", p => p.description ? `${p.code} · ${p.description}` : p.code) : {};
      const bmap = can("branches:read") ? await idMap("/api/branches") : {};
      lowStockHtml = `<div class="card pad"><h3 style="margin-bottom:12px">Stock bajo / agotado ${low.length ? badge(low.length, "amber") : badge("0","green")}</h3>` +
        (low.length ? renderTable(
          [ { key:"product_id", label:"Producto", render:(v)=>esc(pmap[v] || ("#"+v)) },
            { key:"branch_id", label:"Sucursal", render:(v)=>esc(bmap[v] || ("#"+v)) },
            { key:"quantity", label:"Cant.", type:"num", align:"right" },
            { key:"effective_min_stock", label:"Mín", type:"num", align:"right" } ], low)
        : `<div class="empty" style="padding:14px">Todo por encima del mínimo 👍</div>`) + `</div>`;
    } catch {}
  }

  view.innerHTML = `
    <div class="page-head"><div><h2>Hola, ${esc((state.user.full_name||"").split(" ")[0] || state.user.email)}</h2>
      <div class="sub">${esc(state.company?.name || "Mi Óptica")} · ${esc(state.currency)}</div></div></div>
    <div class="stats">${stats || '<div class="stat"><div class="k">Sin permisos de lectura</div></div>'}</div>
    ${lowStockHtml}`;
}

/* =======================================================================
   PRODUCTS
   ======================================================================= */
async function productsView(view) {
  const writable = can("products:write");
  const [typeMap, brandMap, modelMap, supMap, colorMap, codeRows, priceLists, settings] = await Promise.all([
    idMap("/api/product-types"), idMap("/api/brands"), idMap("/api/product-models"),
    can("suppliers:read") ? idMap("/api/suppliers") : Promise.resolve({}),
    // Names only: the filter needs them, and the grid paints each row's own
    // `colors`, which the API already sends expanded.
    idMap("/api/colors"),
    can("pricing:read") ? api("GET", "/api/price-category-codes").catch(() => []) : Promise.resolve([]),
    can("pricing:read") ? api("GET", "/api/price-lists").catch(() => []) : Promise.resolve([]),
    can("company:read") ? api("GET", "/api/company/settings").catch(() => ({})) : Promise.resolve({}),
  ]);
  // Lists are read whole (not via idMap) because the price preview needs their
  // currency as well as their name.
  const listMap = Object.fromEntries(priceLists.map(l => [l.id, l.name]));
  const listCurrency = Object.fromEntries(priceLists.map(l => [l.id, l.currency]));
  const defaultPriceListId = settings.default_price_list_id || "";
  /* Products are tagged by code, so the picker offers every code some list can
     price — the code then resolves inside whichever list applies. */
  const codeOptions = codeRows.map(r => ({
    value: r.code,
    label: r.list_count > 1 ? `${r.code} · en ${r.list_count} listas` : r.code,
  }));
  const filters = { product_type_id:"", brand_id:"", model_id:"", supplier_id:"", color_id:"" };
  let showInactive = false;
  // A family reads as one line: the grid lists styles and plain articles, and
  // drills into a style's colours on demand. null = the top level.
  let family = null;                     // { id, code } when inside a family

  const baseFields = () => [
    { key:"code", label:"Código", required:true },
    { key:"product_type_id", label:"Tipo de producto", type:"select", required:true, valueType:"int", optionsFrom:{ endpoint:"/api/product-types" }, quickCreate:"product_types" },
    { key:"supplier_id", label:"Proveedor", type:"select", valueType:"int", optionsFrom:{ endpoint:"/api/suppliers" } },
    { key:"brand_id", label:"Marca", type:"select", valueType:"int", optionsFrom:{ endpoint:"/api/brands" }, quickCreate:"brands" },
    { key:"model_id", label:"Modelo", type:"select", valueType:"int", optionsFrom:{ endpoint:"/api/product-models" }, quickCreate:"product_models" },
    { key:"color_ids", label:"Colores", type:"multiselect", full:true, swatch:true,
      optionsFrom:{ endpoint:"/api/colors", metaFn: c => c.hex_code }, quickCreate:"colors",
      help:"Dejalo vacío si el producto no viene en colores (unos lentes de "
         + "contacto, por ejemplo). Con uno queda un producto suelto; con dos o "
         + "más se crea uno por color, cada uno con su código y su stock, salvo "
         + "que marques que es un solo artículo bicolor. "
         + "Desmarcar no borra nada: el producto de ese color sigue existiendo." },
    { key:"multicolor", label:"Es un solo artículo de varios colores (bicolor, tricolor…)", type:"checkbox", full:true,
      showIf:(v) => (v.color_ids || []).length > 1 },
    { key:"min_stock", label:"Stock mínimo", type:"decimal", step:"0.01" },
    { key:"parent_id", label:"Producto base", type:"select", valueType:"int",
      optionsFrom:{ endpoint:"/api/products?only_base=true",
                    labelFn: p => p.description ? `${p.code} · ${p.description}` : p.code },
      help:"Para un producto que ya existe y es el mismo modelo en otro color. "
         + "Lo normal es generarlas con ⋯ → Generar variantes." },
    // --- precio de venta ---
    { key:"pricing_mode", label:"Precio de venta", type:"radio", full:true, default:"price_list",
      options:[ { value:"price_list", label:"Por lista de precios" }, { value:"manual", label:"Manual" } ] },
    { key:"sale_price", label:"Precio", type:"decimal", step:"0.01",
      showIf:(v) => v.pricing_mode === "manual" },
    { key:"price_list_id", label:"Lista de precios", type:"select", valueType:"int",
      optionsFrom:{ endpoint:"/api/price-lists" },
      showIf:(v) => v.pricing_mode !== "manual",
      help:"Vacío = se usa la lista por defecto de la empresa." },
    { key:"price_category_code", label:"Categoría de precio", type:"select", options: codeOptions,
      showIf:(v) => v.pricing_mode !== "manual",
      help:"El código se busca dentro de la lista que le toque al producto." },
    { key:"description", label:"Descripción", type:"textarea", full:true },
  ];

  /* Modelo depends on the chosen type, Marca on the chosen supplier. Both are
     repopulated live as those selects change. */
  async function wireDependentSelects(form, row) {
    // "Producto base" lists every style; the one being edited is not a
    // candidate for itself, and neither is a product that has variants.
    const parentSel = form.querySelector('[name="parent_id"]');
    if (parentSel && row) {
      const self = parentSel.querySelector(`option[value="${row.id}"]`);
      if (self) self.remove();
    }
    const typeSel  = form.querySelector('[name="product_type_id"]');
    const modelSel = form.querySelector('[name="model_id"]');
    const supSel   = form.querySelector('[name="supplier_id"]');
    const brandSel = form.querySelector('[name="brand_id"]');

    // Keeps the current value visible even when it falls outside the new list,
    // so saving an untouched form never silently drops it.
    const keepCurrent = (sel, opts, map, note) => {
      const cur = sel.value;
      if (cur && !opts.some(o => String(o.value) === cur)) {
        opts = opts.concat([{ value: cur, label: `${map[cur] || ("#" + cur)}${note}` }]);
        return { opts, outsider: map[cur] || ("#" + cur) };
      }
      return { opts, outsider: null };
    };

    const setWarn = (sel, msg) => {
      const row = sel.closest(".form-row");
      let w = row.querySelector(".fwarn");
      if (!msg) { if (w) w.remove(); return; }
      if (!w) { w = el(`<div class="fwarn"></div>`); row.appendChild(w); }
      w.textContent = msg;
    };

    async function refreshModels() {
      const t = typeSel.value;
      const rows = await api("GET", "/api/product-models" + (t ? `?product_type_id=${t}` : "")).catch(() => []);
      const { opts } = keepCurrent(modelSel, rows.map(r => ({ value:r.id, label:r.name })),
                                   modelMap, " (otro tipo)");
      setSelectOptions(modelSel, opts);
    }

    async function refreshBrands() {
      const s = supSel.value;
      const rows = await api("GET", s ? `/api/suppliers/${s}/brands` : "/api/brands").catch(() => []);
      const { opts, outsider } = keepCurrent(brandSel, rows.map(r => ({ value:r.id, label:r.name })),
                                             brandMap, " (fuera del proveedor)");
      setSelectOptions(brandSel, opts);
      setWarn(brandSel, outsider && s
        ? `"${outsider}" no está asociada a este proveedor. Se conserva, pero conviene asociarla en Proveedores.`
        : null);
    }

    /* Live preview of the price the chosen list + category resolves to, so you
       are not saving blind. */
    const listSel = form.querySelector('[name="price_list_id"]');
    const catSel  = form.querySelector('[name="price_category_code"]');
    async function previewPrice() {
      const row = catSel.closest(".form-row");
      let hint = row.querySelector(".pricehint");
      if (!hint) { hint = el(`<div class="pricehint"></div>`); row.appendChild(hint); }
      const code = catSel.value;
      if (!code) { hint.textContent = "Elegí una categoría para ver el precio."; return; }
      const listId = listSel.value || defaultPriceListId;
      if (!listId) { hint.textContent = "Sin lista propia ni lista por defecto en Empresa."; return; }
      const cats = await api("GET", `/api/price-lists/${listId}/categories`).catch(() => []);
      const hit = cats.find(c => c.code === code);
      const currency = listCurrency[listId];
      hint.innerHTML = hit
        ? `Precio resultante: <b>${fmtMoney(hit.price, currency)}</b>`
        : `Esa lista no tiene la categoría ${esc(code)}.`;
    }

    /* El asistente de alta arma un paso por vez, así que este formulario puede
       traer sólo algunos de estos campos: cada enganche se hace si las dos
       puntas están. Sin esto, el paso que no lleva los selects de precio moría
       en el primer addEventListener y el modal quedaba sin botones. */
    if (typeSel && modelSel) typeSel.addEventListener("change", refreshModels);
    if (supSel && brandSel) supSel.addEventListener("change", refreshBrands);
    if (listSel) listSel.addEventListener("change", previewPrice);
    if (catSel)  catSel.addEventListener("change", previewPrice);
    form.addEventListener("change", (e) => {
      if (e.target.name === "pricing_mode" && listSel && catSel) previewPrice();
    });
    await Promise.all([
      typeSel && modelSel ? refreshModels() : null,
      supSel && brandSel ? refreshBrands() : null,
      listSel && catSel ? previewPrice() : null,
    ]);
  }

  async function load() {
    variantCache.clear();
    const qs = new URLSearchParams();
    for (const [k,v] of Object.entries(filters)) if (v) qs.set(k, v);
    if (showInactive) qs.set("include_inactive", "true");
    if (family) qs.set("parent_id", family.id);
    else qs.set("only_base", "true");
    const list = await api("GET", "/api/products?" + qs);
    paint(list);
  }

  function enterFamily(row) { family = { id: row.id, code: row.code }; load(); }
  function leaveFamily() { family = null; load(); }

  /* ---------------------------------------------------------------- alta
     El alta iba en un solo modal de catorce campos: había que scrollear, y el
     campo que más decide (Colores, que define si se crea UN producto o DIEZ)
     quedaba sexto en la lista, sin explicación a la vista. Se parte en tres
     pasos, uno por idea, con el mismo chrome de pastillas que el asistente de
     importación. La edición NO se parte: ahí uno entra a cambiar un campo
     concreto y un asistente sería un estorbo. */
  const PASOS = [
    { label:"Qué es",         keys:["code","product_type_id","brand_id","model_id","supplier_id","description"] },
    { label:"Colores",        keys:["color_ids","multicolor"] },
    { label:"Precio y costo", keys:["pricing_mode","sale_price","price_list_id","price_category_code","current_cost","min_stock"] },
  ];

  async function openProductWizard() {
    const todos = baseFields().concat([{ key:"current_cost", label:"Costo inicial", type:"decimal", step:"0.01",
      help:"Después de crear, cambiá el costo desde el menú ⋯ de la fila (queda auditado)." }]);
    const porKey = Object.fromEntries(todos.map(f => [f.key, f]));
    /* La explicación larga de Colores la hace ahora el resumen de abajo, con los
       códigos reales. Acá queda sólo lo que el resumen no puede decir: cuándo
       corresponde dejarlo vacío. La edición conserva el texto completo, porque
       ahí no hay resumen que lo muestre. */
    if (porKey.color_ids)
      porKey.color_ids = { ...porKey.color_ids,
        help:"Dejalo vacío si el producto no viene en colores, como unos lentes de contacto." };
    const colores = await api("GET", "/api/colors").catch(() => []);
    const codigoDeColor = Object.fromEntries(colores.map(c => [String(c.id), c.code]));

    const acc = { pricing_mode: "price_list" };
    const body = el(`<div class="wizard"></div>`);
    const cerrar = openModal({ title:"Nuevo producto", body, wide:true });
    let i = 0;
    await pintar();

    // Declaración y no `const`: pintar() corre antes de llegar a esta línea.
    function pastillas() { return stepMap(PASOS.map(p => p.label), i); }

    const menosMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)");
    const esperar = (ms) => new Promise(r => setTimeout(r, ms));

    /* El mapa se actualiza, no se vuelve a dibujar: si se reemplaza el elemento
       la línea aparece ya pintada y la transición no llega a correr nunca. */
    function actualizarMapa() {
      const m = body.querySelector(".stepmap");
      if (!m) return false;
      m.style.setProperty("--avance", (i / (PASOS.length - 1)) * 100 + "%");
      [...m.querySelectorAll(".stepmap-step")].forEach((paso, k) => {
        paso.classList.toggle("done", k < i);
        paso.classList.toggle("on", k === i);
        const dot = paso.querySelector(".stepmap-dot");
        const quiere = k < i ? "ok" : String(k + 1);
        if (dot.dataset.v !== quiere) {
          dot.dataset.v = quiere;
          dot.innerHTML = k < i ? `<svg class="ic"><use href="#i-check"/></svg>` : String(k + 1);
        }
      });
      return true;
    }

    /* Saca el paso viejo, mete el nuevo y lleva el alto de uno a otro. Devuelve
       apenas el nuevo está en pantalla, así el foco no espera a que termine. */
    async function mostrar(pane, dir) {
      const stage = body.querySelector(".wizstage");
      const viejo = stage.firstElementChild;
      if (!viejo || menosMovimiento.matches) { stage.replaceChildren(pane); return; }
      stage.style.height = stage.getBoundingClientRect().height + "px";
      stage.style.overflow = "hidden";
      viejo.style.opacity = "0";
      viejo.style.transform = `translateX(${-14 * dir}px)`;
      await esperar(130);
      stage.replaceChildren(pane);
      pane.style.opacity = "0";
      pane.style.transform = `translateX(${14 * dir}px)`;
      const alto = pane.getBoundingClientRect().height;
      requestAnimationFrame(() => {
        stage.style.height = alto + "px";
        pane.style.opacity = "";
        pane.style.transform = "";
      });
      esperar(280).then(() => { stage.style.height = ""; stage.style.overflow = ""; });
    }

    /* El paso 2 dice en castellano qué va a pasar al confirmar, con los códigos
       ya armados: es la única forma de que la regla (un estilo con variantes no
       se vende ni se stockea) se vea antes de crear y no después. */
    function resumenColores(form) {
      const ids = (form.read({ all:true }).color_ids || []).map(String);
      const code = (acc.code || "").trim() || "el código";
      if (!ids.length)
        return `<div class="fhelp">Se crea <b>un solo producto</b>: <code>${esc(code)}</code>. Se vende y se stockea él mismo.</div>`;
      if (ids.length === 1)
        return `<div class="fhelp">Se crea <b>un solo producto</b>: <code>${esc(code)}</code>, en ese color. Se vende y se stockea él mismo.</div>`;
      if (form.read({ all:true }).multicolor)
        return `<div class="fhelp">Se crea <b>un solo producto</b>: <code>${esc(code)}</code>, con esos ${ids.length} colores juntos. Se vende y se stockea él mismo.</div>`;
      const hijos = ids.map(id => `${code}-${codigoDeColor[id] || "?"}`);
      return `<div class="fhelp">Se crean <b>${hijos.length} productos</b>, uno por color:
        ${hijos.map(h => `<code>${esc(h)}</code>`).join(" ")}.<br>
        <code>${esc(code)}</code> queda como estilo: agrupa a los colores y no se vende ni se stockea.</div>`;
    }

    async function pintar(dir = 0) {
      const paso = PASOS[i];
      const campos = paso.keys.map(k => porKey[k]).filter(Boolean);
      const form = await buildForm(campos, acc, true);
      if (!body.querySelector(".stepmap"))
        body.innerHTML = pastillas() + `<div class="wizstage"></div>`;
      else actualizarMapa();
      const caja = el(`<div class="wizpane"></div>`);
      caja.appendChild(form);
      if (i === 0) await wireDependentSelects(form, null);

      const previo = i === 1 ? el(`<div style="margin:-4px 0 4px"></div>`) : null;
      if (previo) {
        const repintar = () => { previo.innerHTML = resumenColores(form); };
        form.addEventListener("change", repintar);
        caja.appendChild(previo);
        repintar();
      }

      const nav = el(`<div class="toolbar" style="justify-content:space-between;margin:14px 0 0"></div>`);
      caja.appendChild(nav);
      const izq = el(`<div></div>`);
      const der = el(`<div style="display:flex;align-items:center;gap:12px;min-width:0"></div>`);
      nav.append(izq, der);
      if (i) {
        const atras = el(`<button class="btn" type="button"><svg class="ic"><use href="#i-arrow-left"/></svg>Volver</button>`);
        // Volver no valida: lo escrito se guarda igual, para no perderlo.
        atras.addEventListener("click", async () => { Object.assign(acc, form.read()); i--; await pintar(-1); });
        izq.appendChild(atras);
      }
      const ultimo = i === PASOS.length - 1;
      const seguir = el(`<button class="btn primary" type="button">${ultimo
        ? `<svg class="ic"><use href="#i-check"/></svg>Crear producto`
        : `Siguiente<svg class="ic"><use href="#i-arrow-right"/></svg>`}</button>`);
      /* El botón arranca apagado y se prende solo cuando el paso está completo.
         Un botón apagado sin explicación es una pared, así que al lado va lo
         que falta: es el mismo texto que antes aparecía recién al apretarlo. */
      const falta = el(`<div class="fhelp" style="margin:0"></div>`);
      let enviando = false;
      const revisar = () => {
        if (enviando) return;
        const err = validate(campos, form.read());
        seguir.disabled = !!err;
        falta.textContent = err || "";
      };
      form.addEventListener("input", revisar);
      form.addEventListener("change", revisar);
      seguir.addEventListener("click", async () => {
        const datos = form.read();
        const err = validate(campos, datos);
        if (err) return toast(err, "err");
        Object.assign(acc, datos);
        if (!ultimo) { i++; return pintar(1); }
        enviando = true; seguir.disabled = true;
        try {
          const saved = await api("POST", "/api/products", acc);
          const hechas = saved.variant_count || 0;
          clearOptions();
          toast(hechas > 0 ? `Guardado · ${hechas} producto(s) por color` : "Guardado", "ok");
          cerrar();
          if (hechas > 0) enterFamily(saved); else await load();
        } catch (e) { toast(e.message || "No se pudo guardar.", "err"); enviando = false; revisar(); }
      });
      der.append(falta, seguir);
      revisar();
      await mostrar(caja, dir);
      const primero = form.querySelector("input,select,textarea");
      if (primero) primero.focus();
    }
  }

  function openForm(mode, row) {
    if (mode === "create") return openProductWizard();
    let fields = baseFields().concat([{ key:"is_active", label:"Activo", type:"checkbox" }]);
    formModal({ title: (mode==="edit"?"Editar producto":"Nuevo producto"), fields, values: row || {}, grid:true,
      onReady: (form) => wireDependentSelects(form, row),
      onSubmit: async (payload) => {
        const before = mode === "edit" ? (row.variant_count || 0) : 0;
        const saved = mode === "edit"
          ? await api("PUT", "/api/products/" + row.id, payload)
          : await api("POST", "/api/products", payload);
        const made = (saved.variant_count || 0) - before;
        clearOptions();
        toast(made > 0 ? `Guardado · ${made} producto(s) por color` : "Guardado", "ok");
        // Land on what was just created rather than leaving it to be found.
        if (made > 0) enterFamily(saved); else await load();
      } });
  }

  function costModal(row) {
    formModal({ title: `Cambiar costo — ${row.code}`, confirmLabel:"Guardar costo",
      fields: [ { key:"new_cost", label:"Costo nuevo", type:"decimal", step:"0.01", required:true }, { key:"note", label:"Nota", type:"textarea" } ],
      values: { new_cost: row.current_cost },
      onSubmit: async (payload) => { await api("POST", `/api/products/${row.id}/cost`, payload); toast("Costo actualizado", "ok"); await load(); } });
  }

  async function historyModal(row) {
    const hist = await api("GET", `/api/products/${row.id}/cost-history`);
    const body = el(`<div>${renderTable(
      [ { key:"changed_at", label:"Fecha", type:"datetime" },
        { key:"old_cost", label:"Anterior", type:"money", align:"right" },
        { key:"new_cost", label:"Nuevo", type:"money", align:"right" },
        { key:"note", label:"Nota" } ], hist)}</div>`);
    openModal({ title:`Historial de costos — ${row.code}`, body, wide:true });
  }

  async function stockModal(row) {
    const levels = await api("GET", `/api/stock/levels?product_id=${row.id}`).catch(() => []);
    const bmap = can("branches:read") ? await idMap("/api/branches") : {};
    const body = el(`<div>${renderTable(
      [ { key:"branch_id", label:"Sucursal", render:(v)=>esc(bmap[v] || ("#"+v)) },
        { key:"quantity", label:"Cant.", type:"num", align:"right" },
        { key:"min_stock", label:"Mín", type:"num", align:"right" } ], levels)}</div>`);
    openModal({ title:`Stock — ${row.code}${row.description ? " · " + row.description : ""}`, body });
  }

  /* Turn a product into a style: one article per colour, each with its own
     code and its own stock. The codes are previewed before anything is
     created, because a product code is a thing the shop reads out loud. */
  async function variantsModal(row) {
    const colors = await api("GET", "/api/colors").catch(() => []);
    const byId = Object.fromEntries(colors.map(c => [String(c.id), c]));
    await formModal({
      title: `Variante a medida — ${row.code}`, confirmLabel: "Crear",
      fields: [
        { key:"color_ids", label:"Colores", type:"multiselect", full:true,
          swatch:true, required:true,
          optionsFrom:{ endpoint:"/api/colors", metaFn: c => c.hex_code },
          quickCreate:"colors",
          help:"Marcá varios para un producto bicolor; se crea una sola variante con todos." },
      ],
      onReady: (form) => {
        const prev = el(`<div class="codeprev"></div>`);
        form.appendChild(prev);
        const paint = () => {
          const picked = form.read().color_ids || [];
          const tags = picked.map(id => (byId[String(id)] || {}).code || "?");
          prev.innerHTML = tags.length
            ? `<span class="fhelp">Se va a crear un producto:</span>`
              + `<code>${esc(row.code)}-${esc(tags.join("-"))}</code>`
            : `<span class="fhelp">Elegí los colores que lleva.</span>`;
        };
        form.addEventListener("change", paint);
        paint();
      },
      onSubmit: async (payload) => {
        const made = await api("POST", `/api/products/${row.id}/variants`,
                               { variants: [{ color_ids: payload.color_ids }] });
        toast(`${made.length} variante(s) creada(s)`, "ok");
        clearOptions();
        enterFamily(row);           // land on what was just made
      },
    });
  }

  /* Only the two everyday actions are labelled; the rest live in the "⋯" menu.
     Five buttons per row cost ~390px — a quarter of the grid — and pushed it
     into a horizontal scroll. */
  function actions(r) {
    let h = "";
    // A style holds no stock of its own, so that button would lie. It gets the
    // way into its colours instead.
    if (r.variant_count)
      h += `<button class="btn sm" data-act="family" data-id="${r.id}"><svg class="ic"><use href="#i-tags"/></svg>${r.variant_count} colores</button>`;
    else if (can("stock:read"))
      h += `<button class="btn sm" data-act="stock" data-id="${r.id}"><svg class="ic"><use href="#i-box"/></svg>Stock</button>`;
    if (writable)
      h += `<button class="btn sm" data-act="edit" data-id="${r.id}"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>`;
    h += `<button class="btn sm ico" title="Más acciones" data-act="more" data-id="${r.id}"><svg class="ic"><use href="#i-more"/></svg></button>`;
    return h;
  }

  function rowMenu(btn, row) {
    openRowMenu(btn, [
      // Only offered where it means something: a variant cannot have variants,
      // and a style that already has them is entered, not re-generated.
      // The colour checklist covers one-colour-per-article; this stays for
      // what it cannot say — a bicolour article, or a code of your own.
      writable && !row.parent_id
        && { icon:"i-tags", label:"Agregar variante a medida",
             onClick:() => variantsModal(row) },
      row.variant_count && { icon:"i-tags", label:`Ver sus ${row.variant_count} colores`,
                             onClick:() => enterFamily(row) },
      (writable || row.variant_count) && { sep:true },
      { icon:"i-clock", label:"Historial de costos", onClick:() => historyModal(row) },
      writable && { icon:"i-dollar", label:"Cambiar costo", onClick:() => costModal(row) },
      writable && { sep:true },
      writable && (row.is_active
        ? { icon:"i-ban", label:"Desactivar", danger:true, onClick:() => confirmDanger({
            title:"Desactivar producto", message:`¿Desactivar "${row.code}"?`,
            confirmLabel:"Desactivar",
            onConfirm: async () => { await api("DELETE", "/api/products/" + row.id); toast("Desactivado","ok"); load(); } }) }
        : { icon:"i-rotate", label:"Restaurar", onClick: async () => {
            await api("PUT", "/api/products/" + row.id, { is_active:true }); toast("Restaurado","ok"); load(); } }),
    ].filter(Boolean));
  }

  function selectFilter(key, map, label) {
    const opts = Object.entries(map).map(([id,name]) => `<option value="${id}" ${filters[key]===id?"selected":""}>${esc(name)}</option>`).join("");
    return `<select class="inp-sm" data-filter="${key}" style="width:auto"><option value="">${esc(label)}</option>${opts}</select>`;
  }

  /* Las mismas columnas para el estilo y para sus variantes: una variante se
     dibuja con la misma definición, así la fila hija cae exactamente abajo de
     la columna que le corresponde. */
  const cols = [
        { key:"code", label:"Código", mono:true },
        { key:"description", label:"Descripción", trunc:true,
          render:(v)=>v ? `<span title="${esc(v)}">${esc(v)}</span>` : "—" },
        { key:"product_type_id", label:"Tipo", render:(v)=>esc(typeMap[v]||"—") },
        { key:"brand_id", label:"Marca", render:(v)=>esc(brandMap[v]||"—") },
        { key:"model_id", label:"Modelo", priority:2, render:(v)=>esc(modelMap[v]||"—") },
        { key:"colors", label:"Colores", priority:2, render:(v, r)=> swatchList(v)
            + (r.multicolor && v && v.length > 1 ? " " + badge(v.length > 2 ? "multicolor" : "bicolor", "gray") : "") },
        { key:"variant_count", label:"Variantes", priority:2, render:(v, r) => v
            ? badge(`${v} colores`, "blue")
            : (r.parent_code ? `<span class="fhelp">de ${esc(r.parent_code)}</span>` : "—") },
        { key:"price_category_code", label:"Cat.", priority:3, render:(v)=>v?badge(v,"gray"):"—" },
        { key:"resolved_sale_price", label:"Precio", align:"right", render:(v, r) => v != null
            ? `<span title="${esc(r.price_source === "manual" ? "Precio manual" : ("Lista: " + (listMap[r.price_list_id] || "por defecto")))}">${fmtMoney(v, r.price_currency)}</span>`
            : r.variant_count
              ? `<span class="fhelp" title="Se vende por color">por color</span>`
              : `<span class="badge gray" title="${esc(r.price_reason || "")}">sin precio</span>` },
        { key:"current_cost", label:"Costo", type:"money", align:"right", priority:2 },
        { key:"min_stock", label:"Mín", type:"num", align:"right", priority:3 },
        { key:"is_active", label:"Estado", type:"bool", priority:3 },
  ];

  /* Abrir un estilo trae sus colores una sola vez: la segunda apertura sale de
     acá y no vuelve a pegarle a la API. Se limpia con cada `load()`, que es
     cuando los filtros o el alta pueden haberlos cambiado. */
  const variantCache = new Map();
  let listaActual = [];        // lo último que pintó paint(), para medir la reserva

  /* `table-layout:auto` mide las columnas con lo que hay adentro, así que al
     abrir un estilo entraban códigos más largos (pepe -> pepe-NEG) más la
     sangría, la primera columna crecía y TODA la grilla se corría de lugar.
     Antes de abrir nada le reservamos a la primera columna el ancho del código
     de variante más largo que puede aparecer (el del estilo más un código de
     color, que son tres letras) y clavamos el resto con lo que ya midieron. A
     partir de ahí abrir y cerrar no mueve una sola columna. */
  function anchoDeTexto(txt, molde) {
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:" + getComputedStyle(molde).font;
    probe.textContent = txt;
    document.body.appendChild(probe);
    const w = probe.getBoundingClientRect().width;
    probe.remove();
    return w;
  }

  function fijarColumnas(list) {
    const t = view.querySelector("table");
    if (!t || t.dataset.fijada) return;
    const ths = [...t.querySelectorAll("thead th")];
    const anchos = ths.map(th => th.getBoundingClientRect().width);
    const primera = t.querySelector("tbody td");
    const conVariantes = list.filter(r => r.variant_count);
    if (primera && conVariantes.length) {
      const reserva = Math.max(...conVariantes.map(r => anchoDeTexto((r.code || "") + "-XXX", primera)));
      anchos[0] = Math.max(anchos[0], reserva + 40 + 10);   // sangría de la hija + aire
    }
    /* Con `table-layout:fixed` los anchos mandan: si la suma pasa el marco, la
       grilla se va de costado. Lo que la reserva suma se lo saca a la columna
       que sabe achicarse, que es la que recorta con puntos suspensivos. */
    const disponible = t.parentElement.clientWidth;
    const total = anchos.reduce((a, b) => a + b, 0);
    if (total > disponible) {
      const cuerpo = [...t.querySelectorAll("tbody tr:not(.subrow)")[0].children];
      let elastica = cuerpo.findIndex((td, k) => td.classList.contains("trunc") && anchos[k] > 0);
      if (elastica < 0) elastica = anchos.indexOf(Math.max(...anchos.slice(0, -1)));
      anchos[elastica] = Math.max(80, anchos[elastica] - (total - disponible));
    }
    ths.forEach((th, i) => { th.style.width = anchos[i] + "px"; });
    t.style.tableLayout = "fixed";
    t.dataset.fijada = "1";
  }

  async function toggleFamilyRow(tr, row) {
    const abrir = !tr.classList.contains("open");
    for (let n = tr.nextElementSibling; n && n.classList.contains("subrow");) {
      const x = n; n = n.nextElementSibling; x.remove();
    }
    tr.classList.toggle("open", abrir);
    tr.setAttribute("aria-expanded", String(abrir));
    if (!abrir) return;
    let kids = variantCache.get(row.id);
    if (!kids) {
      const qs = new URLSearchParams({ parent_id: row.id });
      if (showInactive) qs.set("include_inactive", "true");
      try { kids = await api("GET", "/api/products?" + qs); }
      catch (e) { toast(e.message, "err"); tr.classList.remove("open");
                  tr.setAttribute("aria-expanded", "false"); return; }
      variantCache.set(row.id, kids);
    }
    /* Se dibujan con renderTable y las mismas columnas, y después se roban las
       filas: así una columna nueva aparece sola en las hijas y nunca se corren
       respecto del encabezado. */
    const tmp = el(renderTable(cols, kids, actions));
    const nuevas = [...tmp.querySelectorAll("tbody tr")];
    nuevas.forEach(r => r.classList.add("subrow"));
    tr.after(...nuevas);
    nuevas.forEach(r => r.querySelectorAll("[data-act]").forEach(btn => {
      const hijo = kids.find(k => String(k.id) === btn.dataset.id);
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const act = btn.dataset.act;
        if (act === "edit") openForm("edit", hijo);
        else if (act === "stock") stockModal(hijo);
        else if (act === "more") rowMenu(btn, hijo);
      });
    }));
  }

  function paint(list) {
    listaActual = list;
    const head = family
      ? `<button class="btn sm ghost" id="backAll"><svg class="ic"><use href="#i-arrow-left"/></svg>Productos</button>
         <h2>Colores de ${esc(family.code)}</h2>
         <div class="sub">${list.length} variante(s) · cada una con su código y su stock</div>`
      : `<h2>Productos</h2>
         <div class="sub">${list.length} producto(s) · las variantes de color se ven dentro de cada uno</div>`;
    view.innerHTML = `
      <div class="page-head"><div>${head}</div>
        <div class="toolbar" style="margin:0">
          <button class="btn" id="expBtn"><svg class="ic"><use href="#i-download"/></svg>Exportar<svg class="ic"><use href="#i-chevron-down"/></svg></button>
          ${writable ? `<button class="btn" id="impProd"><svg class="ic"><use href="#i-upload"/></svg>Importar productos</button>
                        <button class="btn" id="impCost"><svg class="ic"><use href="#i-upload"/></svg>Actualizar costos</button>
                        <button class="btn primary" id="newBtn"><svg class="ic"><use href="#i-plus"/></svg>Nuevo producto</button>` : ""}
        </div></div>
      <div class="toolbar">
        ${selectFilter("product_type_id", typeMap, "Todos los tipos")}
        ${selectFilter("brand_id", brandMap, "Todas las marcas")}
        ${selectFilter("model_id", modelMap, "Todos los modelos")}
        ${can("suppliers:read") ? selectFilter("supplier_id", supMap, "Todos los proveedores") : ""}
        ${selectFilter("color_id", colorMap, "Todos los colores")}
        <label class="switch"><input type="checkbox" id="inact" ${showInactive?"checked":""}> Ver inactivos</label>
      </div>
      ${renderTable(cols, list, actions)}`;
    // Exporting mirrors what is on screen: same filters, same inactive toggle.
    $("#expBtn", view).addEventListener("click", (e) => openExportMenu(
      e.currentTarget,
      [{ key:"products", label:"Productos" }, { key:"costs", label:"Costos" }],
      { ...filters, include_inactive: showInactive ? "true" : "" }));
    const nb = $("#newBtn", view); if (nb) nb.addEventListener("click", () => openForm("create"));
    const ip = $("#impProd", view);
    if (ip) ip.addEventListener("click", () => openImportWizard("products", async () => { clearOptions(); await load(); }));
    const icost = $("#impCost", view);
    if (icost) icost.addEventListener("click", () => openImportWizard("costs", load));
    $("#inact", view).addEventListener("change", e => { showInactive = e.target.checked; load(); });
    $$("[data-filter]", view).forEach(s => s.addEventListener("change", () => { filters[s.dataset.filter] = s.value; load(); }));
    const back = $("#backAll", view);
    if (back) back.addEventListener("click", leaveFamily);
    $$("[data-act]", view).forEach(b => b.addEventListener("click", async (ev) => {
      ev.stopPropagation();                       // no abrir la fila al apretar un botón
      const row = list.find(x => String(x.id) === b.dataset.id), act = b.dataset.act;
      if (act === "edit") openForm("edit", row);
      else if (act === "stock") stockModal(row);
      else if (act === "family") toggleFamilyRow(b.closest("tr"), row);
      else if (act === "more") rowMenu(b, row);
    }));
    /* La fila de un estilo se abre tocándola en cualquier lado. Con teclado es
       un elemento más del recorrido: Enter o barra la abren y la cierran. */
    fijarColumnas(list);          // antes de que nada se pueda abrir
    $$("tbody tr", view).forEach((tr, i) => {
      const row = list[i];
      if (!row || !row.variant_count) return;
      tr.classList.add("expandable");
      tr.tabIndex = 0;
      tr.setAttribute("aria-expanded", "false");
      tr.addEventListener("click", (ev) => {
        if (ev.target.closest("button,a,input,select,label")) return;
        toggleFamilyRow(tr, row);
      });
      tr.addEventListener("keydown", (ev) => {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        ev.preventDefault(); toggleFamilyRow(tr, row);
      });
    });
  }
  await load();
}

/* =======================================================================
   VENTAS
   The form never does its own arithmetic: every keystroke asks
   /api/sales/preview for the totals, so what is on screen and what gets
   saved are computed by the same code.
   ======================================================================= */
const todayISO = () => new Date().toISOString().slice(0, 10);
const customerLabel = (c) => `${c.last_name}, ${c.first_name}` +
  (c.document_number ? ` · ${c.document_number}` : "");

/* Turn the working draft into the body the API expects: blanks become absent
   rather than "" (which Pydantic would reject as a bad number). */
function saleBody(draft) {
  const opt = (v) => (v === "" || v == null ? null : v);
  return {
    customer_id: opt(draft.customer_id) ? Number(draft.customer_id) : null,
    branch_id: opt(draft.branch_id) ? Number(draft.branch_id) : null,
    status: draft.status || "confirmed",
    items: draft.items.map(i => ({
      product_id: i.product_id,
      quantity: i.quantity || "1",
      ...(opt(i.unit_price) != null ? { unit_price: i.unit_price } : {}),
      ...(opt(i.discount_value) != null && Number(i.discount_value) > 0
        ? { discount_type: i.discount_type || "percent", discount_value: i.discount_value }
        : {}),
    })),
    ...(opt(draft.discount_value) != null && Number(draft.discount_value) > 0
      ? { discount_type: draft.discount_type || "percent", discount_value: draft.discount_value }
      : {}),
    payments: draft.payments
      .filter(p => opt(p.amount) != null && Number(p.amount) > 0)
      .map(p => ({
        amount: p.amount, method: p.method || "cash",
        ...(opt(p.account_id) ? { account_id: Number(p.account_id) } : {}),
        ...(opt(p.reference) ? { reference: p.reference } : {}),
      })),
    promised_payment_date: opt(draft.promised_payment_date),
    reminder_note: opt(draft.reminder_note),
    notes: opt(draft.notes),
  };
}

/* Product picker: search, then pick the variant.
   Results are grouped by marca+modelo, so the variants of the same frame sit
   together and the choice is "which of these", not "which of these codes".
   Each row shows the colours it comes in — they ride along on the product. */
async function pickProduct(branchId, onPick) {
  const [brandMap, modelMap] = await Promise.all([
    idMap("/api/brands"), idMap("/api/product-models"),
  ]);
  const stock = {};
  if (branchId) {
    for (const lvl of await api("GET", `/api/stock/levels?branch_id=${branchId}`).catch(() => []))
      stock[lvl.product_id] = lvl.quantity;
  }

  const body = el(`<div>
    <div class="toolbar">${searchBox("pq", "", "Buscar por código o descripción…", "100%")}</div>
    <div id="presults" style="max-height:52vh;overflow:auto"></div>
  </div>`);
  const results = $("#presults", body);

  const paint = (rows) => {
    if (!rows.length) {
      results.innerHTML = `<div class="empty">Sin resultados.</div>`;
      return;
    }
    // Same marca + modelo → same frame, different colour.
    const groups = new Map();
    for (const p of rows) {
      const key = `${p.brand_id || 0}|${p.model_id || 0}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    }
    results.innerHTML = [...groups.entries()].map(([key, items]) => {
      const [b, m] = key.split("|");
      const title = [brandMap[b], modelMap[m]].filter(Boolean).join(" · ") || "Sin marca";
      const rowsHtml = items.map(p => {
        const qty = stock[p.id];
        const out = branchId && (qty == null || Number(qty) <= 0);
        const stockLabel = !branchId ? ""
          : out ? `<span class="badge red">sin stock</span>`
                : `<span class="badge gray">${fmtNum(qty)} en stock</span>`;
        return `<button type="button" class="pick-row" data-id="${p.id}">
          ${(p.colors || []).length ? swatchList(p.colors, 3) : `<span class="fhelp">sin color</span>`}
          <span class="grow"><span class="code">${esc(p.code)}</span> ${esc(p.description || "")}</span>
          ${stockLabel}
          <span class="price">${p.resolved_sale_price != null
            ? fmtMoney(p.resolved_sale_price, p.price_currency) : "—"}</span>
        </button>`;
      }).join("");
      return `<div class="pick-group"><h4>${esc(title)}</h4>${rowsHtml}</div>`;
    }).join("");
    $$(".pick-row", results).forEach(b => b.addEventListener("click", () => {
      const product = rows.find(p => String(p.id) === b.dataset.id);
      // Carry the colour names along; the sale line shows them under the code.
      onPick({ ...product,
               color_name: (product.colors || []).map(c => c.name).join(", ") });
      close();
    }));
  };

  const load = async (q) => {
    results.innerHTML = `<div class="loading">Buscando…</div>`;
    // sellable_only: a customer buys a colour, not a family, so styles are out.
    paint(await api("GET", "/api/products?sellable_only=true"
                          + (q ? "&q=" + encodeURIComponent(q) : ""))
      .catch(() => []));
  };
  const input = $("input[type=search]", body);
  const search_ = debounce(() => load(input.value.trim()), 220);
  input.addEventListener("input", search_);

  const close = openModal({ title:"Agregar producto", body, wide:true });
  input.focus();
  load("");
}

  function paintPays() {
    $("#noPays", body).style.display = draft.payments.length ? "none" : "";

      <div class="payrow" data-i="${i}">
        <input class="amt" data-f="amount" type="number" step="0.01" min="0" value="${esc(p.amount)}" placeholder="Importe">
        <select data-f="method" style="width:auto">
          ${PAYMENT_METHOD_OPTIONS.map(o => `<option value="${o.value}" ${p.method===o.value?"selected":""}>${esc(o.label)}</option>`).join("")}
        </select>
        <select data-f="account_id" style="width:auto"><option value="">— sin cuenta —</option>
          ${accounts.map(a => `<option value="${a.id}" ${String(p.account_id)===String(a.id)?"selected":""}>${esc(a.name)}</option>`).join("")}
        </select>
        <input data-f="reference" value="${esc(p.reference || "")}" placeholder="Referencia" style="width:130px">
        <button type="button" class="btn sm ghost" data-delpay="${i}"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>`).join("");
    $$("[data-f]", payList).forEach(inp => inp.addEventListener("input", () => {
      const i = Number(inp.closest(".payrow").dataset.i);
      draft.payments[i][inp.dataset.f] = inp.value;
      // Choosing an account suggests its usual method, without forcing it.
      if (inp.dataset.f === "account_id") {

        if (acc && acc.method) {

        }
      }
      refresh({ keepPays: true });
    }));
    $$("[data-delpay]", payList).forEach(b => b.addEventListener("click", () => {
      draft.payments.splice(Number(b.dataset.delpay), 1); refresh();
    }));
  }

  function paintTotals(err) {
    if (err) { totalsBox.innerHTML = `<div style="color:var(--danger);font-size:13px">${esc(err)}</div>`; return; }
    if (!totals) { totalsBox.innerHTML = `<div class="fhelp">Agregá un producto para ver el total.</div>`; return; }
    const owes = Number(totals.balance) > 0;
    totalsBox.innerHTML = `<dl>
      <dt>Subtotal</dt><dd>${fmtMoney(totals.subtotal, totals.currency)}</dd>
      ${Number(totals.discount_amount) > 0
        ? `<dt>Descuento sobre el total</dt><dd>− ${fmtMoney(totals.discount_amount, totals.currency)}</dd>` : ""}
      <div class="grand" style="display:contents"><dt>TOTAL</dt><dd>${fmtMoney(totals.total, totals.currency)}</dd></div>
      <dt>Abonado</dt><dd>${fmtMoney(totals.paid_amount, totals.currency)}</dd>
      <div class="due ${owes ? "" : "ok"}" style="display:contents">
        <dt>${owes ? "Saldo que debe" : "Saldo"}</dt><dd>${fmtMoney(totals.balance, totals.currency)}</dd></div>
    </dl>`;
    reminderBox.style.display = owes ? "" : "none";
  }

  /* Write the new line totals into the cells rather than re-rendering the
     rows: the preview lands ~200ms after a keystroke, and a repaint would
     take the caret out of the field being typed into. */
  function updateLineTotals() {
    $$("tr[data-i]", lineBody).forEach(tr => {
      const t = totals && totals.items[Number(tr.dataset.i)];
      tr.querySelector("[data-total]").innerHTML =
        t ? fmtMoney(t.line_total, totals.currency) : "—";
    });
  }

  const askTotals = debounce(async () => {
    if (!draft.items.length) { totals = null; paintTotals(); updateLineTotals(); return; }
    try {
      totals = await api("POST", "/api/sales/preview", saleBody(draft));
      paintTotals(); updateLineTotals();
    } catch (e) { totals = null; paintTotals(e.message); updateLineTotals(); }
  }, 200);

  function refresh({ keepLines = false, keepPays = false } = {}) {
    if (!keepLines) paintLines();
    if (!keepPays) paintPays();
    askTotals();
  }

  $("#addLine", body).addEventListener("click", () => pickProduct(draft.branch_id, (p) => {
    draft.items.push({
      product_id: p.id, label: p.description || p.code, code: p.code,
      color: p.color_name || "", quantity: "1", unit_price: "",
      suggested: p.resolved_sale_price, discount_type: "percent", discount_value: "",
    });
    refresh();
  }));
  $("#addPay", body).addEventListener("click", () => {
    // Pre-fill with what is still owed: the common case is "paga todo".
    const owed = totals ? totals.balance : "";
    draft.payments.push({ amount: owed && Number(owed) > 0 ? owed : "", method: "cash", account_id: "", reference: "" });
    refresh();
  });

  refresh();
  openModal({
    title: "Nueva venta", body, wide: true, confirmLabel: "Registrar venta",
    onConfirm: async (close) => {
      if (!draft.items.length) return toast("Agregá al menos un producto.", "err");
      try {
        const sale = await api("POST", "/api/sales", saleBody(draft));
        toast(`Venta ${sale.number} registrada`, "ok");
        close(); clearOptions(); onDone && onDone();
      } catch (e) { toast(e.message, "err"); }
    },
  });
}
