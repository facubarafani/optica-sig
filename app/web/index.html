   PRICING (categories + lists + items + bulk)
   ======================================================================= */
/* Currencies a list can be expressed in — mirrors models.enums.Currency. A
   label only: nothing is converted. */
const CURRENCIES = [
  { value:"ARS", label:"Pesos argentinos ($)" },
  { value:"USD", label:"Dólares (US$)" },
];

/* Rounding controls shared by "generar precios" and the percentage adjustment.
   The default — up to the nearest 100 — is what turns $8.583 into $8.600. */
const ROUNDING_STEPS = [
  { value:"0",    label:"Sin redondeo" },
  { value:"10",   label:"A decenas ($10)" },
  { value:"50",   label:"A $50" },
  { value:"100",  label:"A centenas ($100)" },
  { value:"500",  label:"A $500" },
  { value:"1000", label:"A miles ($1.000)" },
];
const ROUNDING_MODES = [
  { value:"up",      label:"Hacia arriba" },
  { value:"nearest", label:"Al más cercano" },
  { value:"down",    label:"Hacia abajo" },
];
const roundingFields = () => [
  { key:"rounding_step", label:"Redondeo", type:"select", options: ROUNDING_STEPS, default:"100" },
  { key:"rounding_mode", label:"Dirección", type:"select", options: ROUNDING_MODES, default:"up" },
];

/* Same maths as services.pricing.round_price, for the live preview only. */
function previewRound(value, step, mode) {
  const s = Number(step || 0);
  if (!(s > 0)) return Math.round(value * 100) / 100;
  const q = value / s;
  const n = mode === "down" ? Math.floor(q) : mode === "nearest" ? Math.round(q) : Math.ceil(q);
  return n * s;
}

async function pricingView(view) {
  const writable = can("pricing:write");
  const typeMap = await idMap("/api/product-types");
  let showInactive = false;

  async function load() {
    paint(await api("GET", "/api/price-lists/summary" + (showInactive ? "?include_inactive=true" : "")));
  }

  function openForm(mode, row) {
    let fields = [
      { key:"name", label:"Nombre", required:true, placeholder:"Mostrador, Mayorista, Importados…" },
      { key:"currency", label:"Moneda", type:"select", options: CURRENCIES, default:"ARS",
        help:"Los precios de la lista se expresan en esta moneda. No hay conversión." },
      { key:"product_type_id", label:"Restringir a tipo de producto", type:"select", valueType:"int", optionsFrom:{ endpoint:"/api/product-types" } },
      { key:"is_default", label:"Lista predeterminada", type:"checkbox" },
    ];
    if (mode === "edit") fields = fields.concat([{ key:"is_active", label:"Activa", type:"checkbox" }]);
    formModal({ title: mode==="edit"?"Editar lista de precios":"Nueva lista de precios", fields, values: row || {},
      onSubmit: async (payload) => { if (mode==="edit") await api("PUT","/api/price-lists/"+row.id,payload); else await api("POST","/api/price-lists",payload); clearOptions(); toast("Guardado","ok"); load(); } });
  }

  /* The ladder of one list: its categories (AA, AB, AC…) and their prices. */
  async function ladderModal(list) {
    const cur = list.currency;
    const wrap = el(`<div></div>`);
    const cats = () => api("GET", `/api/price-lists/${list.id}/categories`);

    async function refresh() {
      const rows = await cats();
      wrap.innerHTML = `
        <div class="toolbar">
          ${writable ? `<button class="btn sm primary" id="genCats"><svg class="ic"><use href="#i-tags"/></svg>Generar categorías</button>
          <button class="btn sm" id="genPrices"><svg class="ic"><use href="#i-banknote"/></svg>Generar precios</button>
          <button class="btn sm" id="bulk"><svg class="ic"><use href="#i-percent"/></svg>Ajustar %</button>
          <button class="btn sm" id="addCat"><svg class="ic"><use href="#i-plus"/></svg>Agregar</button>
          <button class="btn sm" id="impPrices"><svg class="ic"><use href="#i-upload"/></svg>Importar</button>` : ""}
          <button class="btn sm" id="expPrices"><svg class="ic"><use href="#i-download"/></svg>Exportar<svg class="ic"><use href="#i-chevron-down"/></svg></button>
        </div>
        ${rows.length ? renderTable([
          { key:"code", label:"Categoría", render:(v)=>badge(v,"blue") },
          { key:"description", label:"Descripción", priority:3 },
          { key:"price", label:"Precio", align:"right", render:(v)=>fmtMoney(v, cur) },
        ], rows, writable ? (r)=>`<button class="btn sm" data-edit="${r.id}"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>
             <button class="btn sm ico" data-more="${r.id}" title="Más acciones"><svg class="ic"><use href="#i-more"/></svg></button>` : null)
        : `<div class="empty" style="padding:18px">Esta lista todavía no tiene categorías.${writable ? ' Empezá por <b>Generar categorías</b>.' : ""}</div>`}`;

      // Export is a read action — available even without pricing:write.
      $("#expPrices", wrap).addEventListener("click", (e) => openExportMenu(
        e.currentTarget, [{ key:"price_list_items", label:"Precios" }],
        { price_list_id: list.id }));
      if (!writable) return;

      $("#genCats", wrap).addEventListener("click", () => openGenerateCategories(rows.length, refresh, list));
      $("#genPrices", wrap).addEventListener("click", () => openGeneratePrices(rows, refresh, list));
      $("#bulk", wrap).addEventListener("click", () => openBulkAdjust(rows, refresh, list));
      $("#addCat", wrap).addEventListener("click", () => openCategoryForm("create", null, refresh, list));
      $("#impPrices", wrap).addEventListener("click", () => openImportWizard("price_list_items", refresh));

      $$("[data-edit]", wrap).forEach(b => b.addEventListener("click", () =>
        openCategoryForm("edit", rows.find(r => String(r.id) === b.dataset.edit), refresh, list)));
      $$("[data-more]", wrap).forEach(b => b.addEventListener("click", () => {
        const row = rows.find(r => String(r.id) === b.dataset.more);
        openRowMenu(b, [{ label:"Quitar de la lista", icon:"i-ban", danger:true, onClick: () =>
          confirmDanger({
            title:"Quitar categoría",
            message:`¿Quitar "${row.code}" de la lista? Se desactiva: su precio se conserva y los productos con ese código quedan sin precio en esta lista.`,
            confirmLabel:"Quitar",
            onConfirm: async () => { await api("DELETE", `/api/price-lists/${list.id}/categories/${row.id}`); toast("Quitada","ok"); refresh(); },
          }) }]);
      }));
    }

    await refresh();
    openModal({ title:`Categorías y precios — ${list.name} · ${list.currency}`, body: wrap, wide:true });
  }

  /* --- "cantidad de categorías": set the ladder to exactly N steps -------- */
  function openGenerateCategories(currentCount, refresh, list) {
    formModal({
      title:"Generar categorías", confirmLabel:"Generar",
      fields:[
        { key:"count", label:"Cantidad de categorías", type:"int", min:1, max:676, required:true,
          default: currentCount || 10,
          help:"Se nombran AA, AB, AC… hasta ZZ. Después podés agregar o quitar de a una." },
      ],
      values:{ count: currentCount || 10 },
      onSubmit: async (p) => {
        const apply = async () => {
          const rows = await api("POST", `/api/price-lists/${list.id}/generate-categories`, p);
          toast(`La lista quedó con ${rows.length} categoría(s)`, "ok");
          await refresh(); await load();
        };
        if (p.count < currentCount) {
          return confirmDanger({
            title:"Reducir la escalera",
            message:`La lista tiene ${currentCount} categorías y vas a dejarla en ${p.count}. Las últimas ${currentCount - p.count} se desactivan (conservan su precio y se pueden restaurar volviendo a subir la cantidad).`,
            confirmLabel:"Reducir", onConfirm: apply,
          });
        }
        await apply();
      },
    });
  }

  /* --- spread a min..max range across the ladder, rounded ---------------- */
  function openGeneratePrices(rows, refresh, list) {
    const n = rows.length;
    if (!n) return toast("Primero generá las categorías de la lista.", "err");
    const fields = [
      { key:"min_price", label:"Más barato", type:"decimal", step:"0.01", required:true },
      { key:"max_price", label:"Más caro", type:"decimal", step:"0.01", required:true },
      ...roundingFields(),
    ];
    formModal({
      title:`Generar precios — ${n} categoría(s)`, confirmLabel:"Generar", fields,
      onReady: (form) => {
        /* Live preview of the whole ladder: you see the rounding before saving. */
        const hint = el(`<div class="pricehint"></div>`);
        form.appendChild(hint);
        const draw = () => {
          const v = form.read({ all:true });
          const lo = Number(v.min_price), hi = Number(v.max_price);
          if (!Number.isFinite(lo) || !Number.isFinite(hi) || !v.min_price || !v.max_price)
            return hint.textContent = "Cargá el precio más barato y el más caro para ver la escalera.";
          if (hi < lo) return hint.textContent = "El precio más caro no puede ser menor que el más barato.";
          const preview = rows.map((r, i) => {
            const raw = n === 1 ? lo : lo + (hi - lo) * i / (n - 1);
            return `${r.code} ${fmtMoney(previewRound(raw, v.rounding_step, v.rounding_mode), list.currency)}`;
          });
          const shown = preview.length > 8
            ? preview.slice(0, 4).concat(["…"], preview.slice(-2)) : preview;
          hint.innerHTML = `<b>${esc(shown.join("  ·  "))}</b>`;
        };
        form.addEventListener("input", draw);
        form.addEventListener("change", draw);
        draw();
      },
      onSubmit: async (p) => {
        const r = await api("POST", `/api/price-lists/${list.id}/generate-prices`, p);
        toast(`Se actualizaron ${r.updated_items} precio(s)`, "ok");
        await refresh(); await load();
      },
    });
  }

  /* --- move every price by a percentage --------------------------------- */
  function openBulkAdjust(rows, refresh, list) {
    if (!rows.length) return toast("La lista no tiene categorías para ajustar.", "err");
    const fields = [
      { key:"percentage", label:"Cambio porcentual", type:"decimal", step:"0.01", required:true,
        help:"ej. 10 = +10%, -5 = -5%. Se aplica a toda la lista (auditado)." },
      ...roundingFields(),
    ];
    formModal({
      title:"Subir o bajar la lista", confirmLabel:"Aplicar", fields,
      onReady: (form) => {
        const hint = el(`<div class="pricehint"></div>`);
        form.appendChild(hint);
        const draw = () => {
          const v = form.read({ all:true });
          const pct = Number(v.percentage);
          if (!v.percentage || !Number.isFinite(pct))
            return hint.textContent = "Cargá el porcentaje para ver cómo queda.";
          const sample = rows.slice(0, 3).map(r => {
            const next = previewRound(Number(r.price) * (1 + pct / 100), v.rounding_step, v.rounding_mode);
            return `${r.code} ${fmtMoney(r.price, list.currency)} → ${fmtMoney(next, list.currency)}`;
          });
          hint.innerHTML = `<b>${esc(sample.join("  ·  "))}</b>${rows.length > 3 ? " …" : ""}`;
        };
        form.addEventListener("input", draw);
        form.addEventListener("change", draw);
        draw();
      },
      onSubmit: async (p) => {
        const r = await api("POST", `/api/price-lists/${list.id}/bulk-update`, p);
        toast(`Se actualizaron ${r.updated_items} precio(s)`, "ok");
        await refresh(); await load();
      },
    });
  }

  /* --- add / edit one step by hand --------------------------------------- */
  function openCategoryForm(mode, row, refresh, list) {
    const fields = [
      { key:"code", label:"Código", required: mode === "edit",
        placeholder: mode === "create" ? "Vacío = el siguiente (AA, AB, AC…)" : "",
        help: mode === "create" ? "Dejalo vacío y se usa el siguiente código libre." : null },
      { key:"description", label:"Descripción" },
      { key:"price", label:`Precio (${list.currency})`, type:"decimal", step:"0.01" },
    ];
    formModal({
      title: mode === "edit" ? `Editar ${row.code}` : "Agregar categoría",
      fields, values: row || {},
      onSubmit: async (p) => {
        if (mode === "edit") await api("PUT", `/api/price-lists/${list.id}/categories/${row.id}`, p);
        else await api("POST", `/api/price-lists/${list.id}/categories`, p);
        toast("Guardado","ok");
        await refresh(); await load();
      },
    });
  }

  function actions(r) {
    let h = `<button class="btn sm" data-act="cats" data-id="${r.id}"><svg class="ic"><use href="#i-tags"/></svg>Categorías</button>`;
    if (writable) h += `<button class="btn sm" data-act="edit" data-id="${r.id}"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>
      <button class="btn sm ico" data-act="more" data-id="${r.id}" title="Más acciones"><svg class="ic"><use href="#i-more"/></svg></button>`;
    return h;
  }

  function paint(rows) {
    view.innerHTML = `
      <div class="page-head"><div><h2>Precios</h2>
        <div class="sub">Cada lista tiene su propia escalera de categorías (AA, AB, AC…) y su moneda.</div></div></div>
      <div class="toolbar">
        <label class="switch"><input type="checkbox" id="showInactive" ${showInactive?"checked":""}> Ver inactivas</label>
        <div class="grow"></div>
        ${writable ? `<button class="btn primary" id="newBtn">+ Nueva lista</button>` : ""}
      </div>
      ${renderTable([
        { key:"name", label:"Nombre" },
        { key:"currency", label:"Moneda", render:(v)=>badge(v,"gray") },
        { key:"category_count", label:"Categorías", align:"right", render:(v)=>v ? String(v) : badge("sin cargar","amber") },
        { key:"min_price", label:"Rango", priority:2, render:(v, r) => r.category_count
            ? `${fmtMoney(r.min_price, r.currency)} — ${fmtMoney(r.max_price, r.currency)}` : "—" },
        { key:"product_type_id", label:"Tipo de producto", priority:3, render:(v)=>v?esc(typeMap[v]||("#"+v)):badge("todos","gray") },
        { key:"is_default", label:"Predet.", priority:2, render:(v)=>v?badge("predeterminada","blue"):"—" },
        { key:"is_active", label:"Estado", type:"bool" },
      ], rows, actions)}`;

    $("#showInactive", view).addEventListener("change", (e) => { showInactive = e.target.checked; load(); });
    const nb = $("#newBtn", view); if (nb) nb.addEventListener("click", () => openForm("create"));
    $$("[data-act]", view).forEach(b => b.addEventListener("click", () => {
      const row = rows.find(x => String(x.id) === b.dataset.id);
      if (b.dataset.act === "cats") ladderModal(row);
      else if (b.dataset.act === "edit") openForm("edit", row);
      else openRowMenu(b, [
        row.is_active
          ? { label:"Desactivar lista", icon:"i-ban", danger:true, onClick: () => confirmDanger({
              title:"Desactivar lista", message:`¿Desactivar "${row.name}"?`, confirmLabel:"Desactivar",
              onConfirm: async () => { await api("DELETE", "/api/price-lists/"+row.id); toast("Desactivada","ok"); load(); } }) }
          : { label:"Reactivar lista", icon:"i-check", onClick: async () => {
              await api("PUT", "/api/price-lists/"+row.id, { is_active:true }); toast("Reactivada","ok"); load(); } },
      ]);
    }));
  }

  await load();
}

   ======================================================================= */
async function stockView(view) {
  const writable = can("stock:write");
  const [pmap, bmap, typeMap, brandMap, colorMap, prodOpts, branchOpts] = await Promise.all([
    idMap("/api/products", "code", p => p.description ? `${p.code} · ${p.description}` : p.code),
    idMap("/api/branches"),
    can("products:read") ? idMap("/api/product-types") : Promise.resolve({}),
    can("products:read") ? idMap("/api/brands") : Promise.resolve({}),
    can("products:read") ? idMap("/api/colors") : Promise.resolve({}),
    options({ endpoint:"/api/products", labelFn:p => p.description ? `${p.code} · ${p.description}` : p.code }),
    options({ endpoint:"/api/branches" }),
  ]);
  // Filters live out here so they survive tab switches and reloads. The API
  // does the filtering — these bags are turned straight into query strings.
  const lf = { q:"", branch_id:"", product_type_id:"", brand_id:"", color_id:"", low_only:false };
  const mf = { q:"", branch_id:"", movement_type:"" };
  let tab = 0;
  const branchSel = (key, required) => ({ key, label: key==="from_branch_id"?"Desde sucursal":key==="to_branch_id"?"Hacia sucursal":"Sucursal", type:"select", required, valueType:"int", options: branchOpts });
  const prodSel = { key:"product_id", label:"Producto", type:"select", required:true, valueType:"int", options: prodOpts };

  function newMovement() {
    formModal({ title:"Nuevo movimiento de stock", grid:true, confirmLabel:"Registrar",
      fields:[ prodSel, branchSel("branch_id", true),
        { key:"movement_type", label:"Tipo", type:"select", required:true, options:[
          { value:"inbound", label:"Ingreso (+)" }, { value:"outbound", label:"Egreso (−)" }, { value:"adjustment", label:"Ajuste (=)" } ] },
        { key:"quantity", label:"Cantidad", type:"decimal", step:"0.01", required:true, help:"Magnitud positiva. El ajuste fija el nivel a este valor." },
        { key:"reference", label:"Referencia" }, { key:"note", label:"Nota", type:"textarea", full:true } ],
      onSubmit: async (p) => { await api("POST", "/api/stock/movements", p); toast("Movimiento registrado","ok"); render(); } });
  }
  function newTransfer() {
    formModal({ title:"Transferencia entre sucursales", grid:true, confirmLabel:"Transferir",
      fields:[ prodSel, branchSel("from_branch_id", true), branchSel("to_branch_id", true),
        { key:"quantity", label:"Cantidad", type:"decimal", step:"0.01", required:true },
        { key:"reference", label:"Referencia" }, { key:"note", label:"Nota", type:"textarea", full:true } ],
      onSubmit: async (p) => {
        if (p.from_branch_id === p.to_branch_id) return toast("Las sucursales deben ser distintas", "err");
        await api("POST", "/api/stock/transfers", p); toast("Transferencia realizada","ok"); render(); } });
  }

  function levelsTab(n) {
    n.innerHTML = `
      <div class="toolbar">
        ${searchBox("lq", lf.q, "Buscar por código o descripción…", "280px")}
        ${filterSelect(lf, "branch_id", bmap, "Todas las sucursales")}
        ${filterSelect(lf, "product_type_id", typeMap, "Todos los tipos")}
        ${filterSelect(lf, "brand_id", brandMap, "Todas las marcas")}
        ${filterSelect(lf, "color_id", colorMap, "Todos los colores")}
        <label class="switch"><input type="checkbox" data-toggle="low_only" ${lf.low_only?"checked":""}> Sólo stock bajo</label>
      </div>
      <div id="lbody"></div>`;
    const body = $("#lbody", n);
    const reload = () => resultsInto(body, "/api/stock/levels", lf, [
      { key:"product_id", label:"Producto", render:(v)=>esc(pmap[v]||("#"+v)) },
      { key:"branch_id", label:"Sucursal", render:(v)=>esc(bmap[v]||("#"+v)) },
      { key:"quantity", label:"Cantidad", type:"num", align:"right",
        // effective_min_stock, not min_stock: the per-branch override is
        // almost always unset, so the product default is what applies.
        render:(v,r)=>{ const min = r.effective_min_stock; const low = min!=null && Number(v)<=Number(min);
                        return `${fmtNum(v)} ${low?badge("bajo","amber"):""}`; } },
      { key:"effective_min_stock", label:"Mín", type:"num", align:"right",
        render:(v,r)=>`${fmtNum(v)}${r.min_stock!=null?' <span class="fhelp">(sucursal)</span>':""}` },
    ], "Ningún producto coincide con la búsqueda.");
    wireFilters(n, lf, reload);
    reload();
  }

  function movementsTab(n) {
    n.innerHTML = `
      <div class="toolbar">
        ${searchBox("mq", mf.q, "Buscar por producto, referencia o nota…", "300px")}
        ${filterSelect(mf, "branch_id", bmap, "Todas las sucursales")}
        ${filterSelect(mf, "movement_type", ENUM_ES.movement_type, "Todos los tipos")}
      </div>
      <div id="mbody"></div>`;
    const body = $("#mbody", n);
    const reload = () => resultsInto(body, "/api/stock/movements", { ...mf, limit:100 }, [
      { key:"created_at", label:"Fecha", type:"datetime" },
      { key:"product_id", label:"Producto", render:(v)=>esc(pmap[v]||("#"+v)) },
      { key:"branch_id", label:"Sucursal", render:(v)=>esc(bmap[v]||("#"+v)) },
      { key:"movement_type", label:"Tipo", type:"badge", cls:"blue", map: ENUM_ES.movement_type },
      { key:"quantity", label:"Cant.", type:"num", align:"right" },
      { key:"resulting_quantity", label:"Resultante", type:"num", align:"right", priority:2 },
      { key:"counterpart_branch_id", label:"Contraparte", priority:3, render:(v)=>v?esc(bmap[v]||("#"+v)):"—" },
      { key:"reference", label:"Ref." },
    ], "Ningún movimiento coincide con la búsqueda.");
    wireFilters(n, mf, reload);
    reload();
  }

  function render() {
    view.innerHTML = `
      <div class="page-head"><div><h2>Stock</h2><div class="sub">Existencias y movimientos por sucursal</div></div>
        <div class="toolbar" style="margin:0">
          <button class="btn" id="expStock"><svg class="ic"><use href="#i-download"/></svg>Exportar<svg class="ic"><use href="#i-chevron-down"/></svg></button>
          ${writable ? `<button class="btn" id="impStock"><svg class="ic"><use href="#i-upload"/></svg>Importar stock inicial</button><button class="btn" id="transferBtn"><svg class="ic"><use href="#i-transfer"/></svg>Transferir</button><button class="btn primary" id="moveBtn"><svg class="ic"><use href="#i-plus"/></svg>Movimiento</button>` : ""}
        </div></div>
      <div class="tabs"><button data-i="0" class="${tab===0?"active":""}">Existencias</button><button data-i="1" class="${tab===1?"active":""}">Movimientos</button></div>
      <div id="stab"></div>`;
    const body = $("#stab", view);
    const show = (i) => { tab = i; $$(".tabs button", view).forEach(b => b.classList.toggle("active", Number(b.dataset.i)===i)); (i===0?levelsTab:movementsTab)(body); };
    $$(".tabs button", view).forEach(b => b.addEventListener("click", () => show(Number(b.dataset.i))));
    // The file mirrors what is on screen — same filters as the Existencias tab.
    $("#expStock", view).addEventListener("click", (e) =>
      openExportMenu(e.currentTarget, [{ key:"stock", label:"Stock" }], { ...lf }));
    if (writable) {
      $("#moveBtn", view).addEventListener("click", newMovement);
      $("#transferBtn", view).addEventListener("click", newTransfer);
      $("#impStock", view).addEventListener("click", () => openImportWizard("stock", render));
    }
    show(tab);
  }
  render();
}

const CUSTOMER_FIELDS = [
  { key:"first_name", label:"Nombre", required:true },
  { key:"last_name", label:"Apellido", required:true },
  { key:"document_type", label:"Tipo de documento", placeholder:"DNI / CUIT…" },

];

async function customersView(view) {
  const writable = can("customers:write");
  let showInactive = false;
  async function load() { paint(await api("GET", "/api/customers" + (showInactive ? "?include_inactive=true" : ""))); }
  function openForm(mode, row) {
    let fields = CUSTOMER_FIELDS.slice();
    if (mode === "edit") fields = fields.concat([{ key:"is_active", label:"Activo", type:"checkbox" }]);
    formModal({ title: mode==="edit"?"Editar cliente":"Nuevo cliente", grid:true, fields, values: row || {},
      onSubmit: async (p) => { if (mode==="edit") await api("PUT","/api/customers/"+row.id,p); else await api("POST","/api/customers",p); toast("Guardado","ok"); load(); } });
  }
  function actions(r) {
    let h = `<button class="btn sm" onclick="location.hash='#/customers/${r.id}'"><svg class="ic"><use href="#i-eye"/></svg>Abrir</button>`;
    if (writable) h += `<button class="btn sm" data-act="edit" data-id="${r.id}"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>
      ${r.is_active?`<button class="btn sm danger" data-act="del" data-id="${r.id}"><svg class="ic"><use href="#i-ban"/></svg>Desactivar</button>`:`<button class="btn sm" data-act="restore" data-id="${r.id}"><svg class="ic"><use href="#i-rotate"/></svg>Restaurar</button>`}`;
    return h;
  }
  function paint(list) {
    view.innerHTML = `
      <div class="page-head"><div><h2>Clientes</h2><div class="sub">${list.length} cliente(s)</div></div>
        ${writable ? `<button class="btn primary" id="newBtn">+ Nuevo cliente</button>` : ""}</div>
      <div class="toolbar"><label class="switch"><input type="checkbox" id="inact" ${showInactive?"checked":""}> Ver inactivos</label></div>
      ${renderTable([
        { key:"id", label:"ID" },
        { key:"last_name", label:"Nombre", render:(v,r)=>esc(`${r.last_name}, ${r.first_name}`) },
        { key:"document_number", label:"Documento", render:(v,r)=>esc(r.document_number?`${r.document_type||""} ${r.document_number}`.trim():"—") },
        { key:"phone", label:"Teléfono" }, { key:"email", label:"Email" },
        { key:"is_active", label:"Estado", type:"bool" },
      ], list, actions)}`;
    const nb = $("#newBtn", view); if (nb) nb.addEventListener("click", () => openForm("create"));
    $("#inact", view).addEventListener("change", e => { showInactive = e.target.checked; load(); });
    $$("[data-act]", view).forEach(b => b.addEventListener("click", async () => {
      const row = list.find(x => String(x.id) === b.dataset.id);
      if (b.dataset.act === "edit") openForm("edit", row);
      else if (b.dataset.act === "restore") { await api("PUT","/api/customers/"+row.id,{ is_active:true }); toast("Restaurado","ok"); load(); }
      else confirmDanger({ title:"Desactivar cliente", message:`¿Desactivar "${row.first_name} ${row.last_name}"?`, confirmLabel:"Desactivar",
        onConfirm: async () => { await api("DELETE","/api/customers/"+row.id); toast("Desactivado","ok"); load(); } });
    }));
  }
  await load();
}

/* =======================================================================
   USERS & ROLES
   ======================================================================= */
async function usersView(view) {
  renderTabs(view, "Usuarios y Roles", [
    { label:"Usuarios", render:(n) => usersTab(n) },
    { label:"Roles",    render:(n) => rolesTab(n) },
  ]);
}

async function usersTab(container) {
  const writable = can("users:write");
  let showInactive = false;
  const branchMap = can("branches:read") ? await idMap("/api/branches") : {};
  async function load() { paint(await api("GET", "/api/users" + (showInactive ? "?include_inactive=true" : ""))); }

  function openForm(mode, row) {
    const fields = [
      { key:"full_name", label:"Nombre completo", required: mode==="create" },
      ...(mode==="create" ? [{ key:"email", label:"Email", type:"email", required:true }] : []),
      { key:"password", label: mode==="create"?"Contraseña":"Contraseña nueva (vacío = sin cambios)", type:"password", required: mode==="create" },
      { key:"branch_id", label:"Sucursal", type:"select", valueType:"int", optionsFrom:{ endpoint:"/api/branches" } },
      { key:"role_ids", label:"Roles", type:"multiselect", optionsFrom:{ endpoint:"/api/roles" } },
      { key:"is_superuser", label:"Superusuario (todos los permisos)", type:"checkbox" },
      ...(mode==="edit" ? [{ key:"is_active", label:"Activo", type:"checkbox" }] : []),
    ];
    const values = row ? { ...row, role_ids: (row.roles||[]).map(r => r.id) } : {};
    formModal({ title: mode==="edit"?"Editar usuario":"Nuevo usuario", grid:true, fields, values,
      onSubmit: async (p) => {
        if (mode === "edit" && (p.password == null || p.password === "")) delete p.password;
        if (mode === "edit") await api("PUT", "/api/users/" + row.id, p);
        else await api("POST", "/api/users", p);
        clearOptions(); toast("Guardado","ok"); load();
      } });
  }
  function actions(r) {
    if (!writable) return "";
    return `<button class="btn sm" data-act="edit" data-id="${r.id}"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>`;
  }
  function paint(list) {
    container.innerHTML = `
      <div class="toolbar"><label class="switch"><input type="checkbox" id="inact" ${showInactive?"checked":""}> Ver inactivos</label>
        <div class="grow"></div>${writable ? `<button class="btn primary" id="newBtn">+ Nuevo usuario</button>` : ""}</div>
      ${renderTable([
        { key:"id", label:"ID" }, { key:"full_name", label:"Nombre" }, { key:"email", label:"Email" },
        { key:"is_superuser", label:"Super", render:(v)=>v?badge("sí","blue"):"—" },
        { key:"branch_id", label:"Sucursal", render:(v)=>v?esc(branchMap[v]||("#"+v)):"—" },
        { key:"roles", label:"Roles", render:(v)=>(v&&v.length)?v.map(r=>badge(r.name,"gray")).join(" "):"—" },
        { key:"is_active", label:"Estado", type:"bool" },
      ], list, writable ? actions : null)}`;
    const nb = $("#newBtn", container); if (nb) nb.addEventListener("click", () => openForm("create"));
    $("#inact", container).addEventListener("change", e => { showInactive = e.target.checked; load(); });
    $$("[data-act=edit]", container).forEach(b => b.addEventListener("click", () => openForm("edit", list.find(x => String(x.id) === b.dataset.id))));
  }
  await load();
}

async function rolesTab(container) {
  const writable = can("users:write");
  async function load() { paint(await api("GET", "/api/roles")); }
  function openForm(mode, row) {
    const fields = [
      { key:"name", label:"Nombre", required: mode==="create" },
      { key:"description", label:"Descripción", type:"textarea" },
      { key:"permission_ids", label:"Permisos", type:"multiselect", optionsFrom:{ endpoint:"/api/permissions", labelFn:p => `${p.name}  (${p.code})` } },
      ...(mode==="edit" ? [{ key:"is_active", label:"Activo", type:"checkbox" }] : []),
    ];
    const values = row ? { ...row, permission_ids: (row.permissions||[]).map(p => p.id) } : {};
    formModal({ title: mode==="edit"?"Editar rol":"Nuevo rol", grid:false, fields, values,
      onSubmit: async (p) => { if (mode==="edit") await api("PUT","/api/roles/"+row.id,p); else await api("POST","/api/roles",p); clearOptions(); toast("Guardado","ok"); load(); } });
  }
  function paint(list) {
    container.innerHTML = `
      <div class="toolbar"><div class="grow"></div>${writable ? `<button class="btn primary" id="newBtn">+ Nuevo rol</button>` : ""}</div>
      ${renderTable([
        { key:"id", label:"ID" }, { key:"name", label:"Nombre" }, { key:"description", label:"Descripción" },
        { key:"permissions", label:"Permisos", render:(v)=>v?`${v.length} permiso(s)`:"0" },
        { key:"is_active", label:"Estado", type:"bool" },
      ], list, writable ? (r)=>`<button class="btn sm" data-id="${r.id}">Editar</button>` : null)}`;
    const nb = $("#newBtn", container); if (nb) nb.addEventListener("click", () => openForm("create"));
    $$("[data-id]", container).forEach(b => b.addEventListener("click", () => openForm("edit", list.find(x => String(x.id) === b.dataset.id))));
  }
  await load();
}

/* =======================================================================
   COMPANY + SETTINGS
   ======================================================================= */
async function companyView(view) {
  const writable = can("company:write");
  const company = await api("GET", "/api/company");
  const settings = await api("GET", "/api/company/settings").catch(() => null);
  const branchOpts = can("branches:read") ? await options({ endpoint:"/api/branches" }) : [];
  const listOpts = can("pricing:read") ? await options({ endpoint:"/api/price-lists" }) : [];

  const companyFields = [
    { key:"name", label:"Nombre", required:true }, { key:"legal_name", label:"Razón social" },
    { key:"tax_id", label:"CUIT" }, { key:"currency", label:"Moneda" },
    { key:"email", label:"Email", type:"email" }, { key:"phone", label:"Teléfono" },
    { key:"address", label:"Dirección", full:true },
  ];
  const settingsFields = [
    { key:"currency", label:"Moneda" }, { key:"timezone", label:"Zona horaria" },
    { key:"default_branch_id", label:"Sucursal predeterminada", type:"select", valueType:"int", options: branchOpts },
    { key:"default_price_list_id", label:"Lista de precios predeterminada", type:"select", valueType:"int", options: listOpts },
    { key:"allow_negative_stock", label:"Permitir stock negativo", type:"checkbox" },
    { key:"low_stock_alerts_enabled", label:"Alertas de stock bajo", type:"checkbox" },
  ];

  const cForm = await buildForm(companyFields, company, true);
  const sForm = settings ? await buildForm(settingsFields, settings, true) : null;
  $$("input,select,textarea", cForm).forEach(i => { if (!writable) i.disabled = true; });
  if (sForm) $$("input,select,textarea", sForm).forEach(i => { if (!writable) i.disabled = true; });

  view.innerHTML = `<div class="page-head"><div><h2>Empresa</h2><div class="sub">Perfil de la organización y configuración del sistema</div></div></div><div class="grid2" id="cwrap"></div>`;
  const wrap = $("#cwrap", view);
  const card1 = el(`<div class="card pad"><h3 style="margin-bottom:14px">Perfil</h3></div>`);
  card1.appendChild(cForm);
  if (writable) { const b = el(`<button class="btn primary">Guardar perfil</button>`); b.addEventListener("click", async () => {
    try { const p = cForm.read(); const e = validate(companyFields, p); if (e) return toast(e,"err"); await api("PUT","/api/company",p); state.currency = p.currency || state.currency; toast("Guardado","ok"); } catch(err){ toast(err.message,"err"); } }); card1.appendChild(b); }
  wrap.appendChild(card1);

  if (sForm) {
    const card2 = el(`<div class="card pad"><h3 style="margin-bottom:14px">Configuración</h3></div>`);
    card2.appendChild(sForm);
    if (writable) { const b = el(`<button class="btn primary">Guardar configuración</button>`); b.addEventListener("click", async () => {
      try { await api("PUT","/api/company/settings", sForm.read()); toast("Guardado","ok"); } catch(err){ toast(err.message,"err"); } }); card2.appendChild(b); }
    wrap.appendChild(card2);
  }
}

/* ------------------------------- boot ---------------------------------- */
(async function boot() {
  // A password link is checked before anything else: someone arriving from
  // their email must reach the form even if a stale session is in this
  // browser, and even if that session belongs to somebody else.
  const link = location.hash.match(/^#\/password\/(.+)$/);
  if (link) return renderSetPassword(decodeURIComponent(link[1]));

  state.token = localStorage.getItem(TOKEN_KEY);
  if (state.token) {
    try { await loadSession(); renderApp(); }
    catch { if (state.token) logout(); else renderLogin(); }  // 401 ya cerró sesión → evita doble render
  } else {
    renderLogin();
  }
})();
</script>
