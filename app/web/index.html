<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Óptica Digital</title>
<style>
  /* Los tokens salen de design-system/src/tokens.ts. Este bloque es una copia
     literal de design-system/dist/console-root.css: para cambiar un valor se
     toca tokens.ts, se corre `node scripts/gen-tokens.mjs` y se pega acá. El
     porqué de cada token está en tokens.ts, no duplicado en este archivo. */
  :root{
    --bg: #f4f6f9;
    --panel: #ffffff;
    --border: #e3e8ef;
    --text: #1f2937;
    --muted: #6b7280;
    --ink: #0f172a;
    --label: #374151;
    --on-ink: #cbd5e1;
    --on-ink-muted: #94a3b8;
    --on-ink-faint: #7c8aa5;
    --on-ink-dim: #64748b;
    --on-ink-line: #1e293b;
    --hover: #f8fafc;
    --press: #f1f5f9;
    --action: #4f46e5;
    --action-600: #4338ca;
    --action-bloom: linear-gradient(100deg, #3b82f6, #7c3aed);
    --action-bloom-press: linear-gradient(100deg, #2e65c0, #612db9);
    --action-bloom-border: #6f34d4;
    --action-ring: #ede9fe;
    --primary: #2563eb;
    --primary-600: #1d4ed8;
    --primary-200: #bfdbfe;
    --primary-700: #1e40af;
    --primary-50: #eff6ff;
    --danger: #dc2626;
    --danger-200: #fecaca;
    --danger-50: #fef2f2;
    --ok: #16a34a;
    --ok-50: #f0fdf4;
    --warn: #d97706;
    --warn-50: #fffbeb;
    --brand-cyan: #22d3ee;
    --brand-sky: #38bdf8;
    --brand-blue: #3b82f6;
    --brand-indigo: #4f46e5;
    --brand-violet: #7c3aed;
    --radius: 10px;
    --radius-sm: 7px;
    --radius-control: 12px;
    --radius-pill: 999px;
    --radius-lg: 14px;
    --shadow: 0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.18);
    --sidebar: 228px;
    --topbar: 56px;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --brand-font: 'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  a{color:var(--primary);text-decoration:none}
  h1,h2,h3{margin:0;font-weight:650}

  /* ---------- pantallas de acceso ---------- */
  /* Panel oscuro con la marca a la izquierda y el formulario a la derecha. El
     #0f172a es el mismo de la barra lateral de adentro, así el sistema no
     cambia de identidad cuando entrás: lo que ves antes de loguearte es lo que
     te acompaña después. */
  /* 100vh y no 100%: #root no tiene alto propio, así que un porcentaje no
     resuelve y el panel oscuro queda cortado a media pantalla. */
  .auth{min-height:100vh;display:grid;grid-template-columns:520px 1fr}
  .auth .side{background:var(--ink);color:var(--on-ink);padding:52px 48px;
    display:flex;flex-direction:column;justify-content:space-between}
  .auth .side .what{color:var(--on-ink-muted);font-size:15px;line-height:1.55;max-width:330px;margin-top:28px}
  .auth .side .help{font-size:12.5px;color:var(--on-ink-dim);line-height:1.6}
  .auth .side .help b{display:block;color:var(--on-ink-muted);font-weight:600;margin-bottom:2px}
  /* Flex y no grid: una pista `auto` de grilla se agranda hasta el
     max-content de la tarjeta, así que el max-width:100% no tenía contra
     qué recortar y en pantalla angosta la tarjeta se iba de costado. */
  .auth .pane{display:flex;align-items:center;justify-content:center;
    padding:24px;min-width:0}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);width:380px;max-width:100%;padding:30px}
  .login-card h1{font-size:19px}
  .login-card p.sub{color:var(--muted);margin:3px 0 22px;font-size:13px}
  .hint{margin-top:16px;font-size:12.5px;color:var(--muted);text-align:center}
  /* Lockup: el anillo hace de símbolo y el espectro vive en las letras de
     DIGITAL. Poppins es sólo de marca, nunca entra en una tabla. */
  .lk{display:inline-flex;align-items:center;gap:3px;font-family:var(--brand-font)}
  .lk .wm{display:flex;flex-direction:column;min-width:0}
  .lk .nm{font-size:42px;font-weight:600;letter-spacing:-.012em;line-height:1;
    white-space:nowrap;color:#fff}
  .lk .dg{font-size:7.2px;font-weight:400;letter-spacing:.34em;line-height:1;
    text-indent:.34em;margin-top:.6em;color:var(--on-ink-faint)}
  /* Sin recorte de fondo el texto transparente desaparece, así que el color
     plano es el piso y el degradado sólo se aplica si el navegador lo soporta. */
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .lk .dg{background:linear-gradient(90deg,var(--brand-cyan),var(--brand-blue) 50%,var(--brand-violet));
      -webkit-background-clip:text;background-clip:text;color:transparent}
  }
  .lk svg{flex:0 0 auto}
  /* En pantalla angosta el panel se convierte en una franja con la marca sola. */
  @media(max-width:860px){
    /* auto 1fr: sin eso las dos filas se reparten el alto y la franja de marca
       se come media pantalla. Y min-width:0 en las celdas, porque una celda de
       grilla no achica abajo de su contenido y la tarjeta se iba de costado. */
    .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100vh}
    .auth .side{flex-direction:row;align-items:center;padding:18px 20px;min-width:0}
    .auth .pane{padding:20px;min-width:0;align-items:flex-start}
    .auth .side .what,.auth .side .help{display:none}
    .lk .nm{font-size:26px}
    .lk .dg{font-size:4.5px}
    .lk svg{width:46px;height:39px}
  }
  /* Same email at more than one shop: pick which one to open. */
  .pick-co{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .pick-co button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;
    font:inherit;font-weight:600;cursor:pointer}
  .pick-co button .grow{flex:1;min-width:0}
  /* La dirección abajo del nombre: dos sucursales de la misma cadena se
     confunden si sólo se ve el nombre. */
  .pick-co button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
  .pick-co button:hover{background:var(--primary-50);border-color:var(--primary-200);color:var(--primary-600)}
  /* Support session banner. Loud on purpose: nobody should mistake our
     session inside a customer's data for the customer's own. */
  .impbar{background:#7c2d12;color:#fff;display:flex;align-items:center;gap:10px;
    padding:8px 20px;font-size:12.5px;font-weight:600}
  .impbar .ic{width:15px;height:15px}
  .impbar .grow{flex:1}
  .impbar button{background:rgba(255,255,255,.16);border:0;color:#fff;font:inherit;
    padding:4px 10px;border-radius:6px;cursor:pointer}
  .impbar button:hover{background:rgba(255,255,255,.28)}
  /* ---------- app shell ---------- */
  /* height y no min-height: el marco se queda con el alto de la ventana y
     reparte hacia adentro. Así la página nunca scrollea: scrollea la región
     que corresponda, y la barra lateral y la de arriba no se van nunca. */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh}
  .sidebar{background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
  .sidebar .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
  .sidebar .brand b{color:#fff;font-size:15px}
  .sidebar .brand small{display:block;color:var(--on-ink-faint);font-size:11px}
  .nav{padding:6px;overflow:auto;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--on-ink);font-weight:500;margin:1px 0}
  .nav a .ic{width:18px;height:18px;opacity:.9}
  .nav a:hover{background:#1e293b;color:#fff}
  .nav a.active{background:var(--primary);color:#fff}
  .sidebar .foot{padding:12px;border-top:1px solid var(--on-ink-line);font-size:12px;color:var(--on-ink-muted)}
  /* min-height:0 o el hijo que scrollea se estira hasta su contenido y el
     scroll se escapa al documento. */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}
  .topbar .crumb{font-weight:650;font-size:15px}
  .topbar .who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .topbar .who .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700}
  /* No global width cap: the data grids need the whole window. Reading-width
     layouts (Empresa, ficha de cliente) are capped individually below. */
  .content{padding:18px 22px;width:100%;min-width:0;flex:1;min-height:0;overflow:auto}
  /* Una pantalla de grilla no scrollea entera: el encabezado, los filtros y
     los nombres de columna quedan fijos y se desplazan sólo las filas. La
     clase la pone el router cuando la tabla es el contenido de la pantalla. */
  .content.grid-page{overflow:hidden;display:flex;flex-direction:column}
  .content.grid-page > #view{flex:1;min-height:0;display:flex;flex-direction:column}
  .content.grid-page > #view > .tbl-wrap{flex:1;min-height:0}
  .menu-btn{display:none;background:none;border:0;font-size:20px;cursor:pointer}
  /* ---------- generic ---------- */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card.pad{padding:18px}
  .card.error{padding:16px;color:var(--danger);background:var(--danger-50);border-color:#fecaca}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .page-head h2{font-size:20px}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .toolbar .grow{flex:1}
  /* --- ventas --- */
  .lines{width:100%;border-collapse:collapse;margin-top:4px}
  .lines th{text-align:left;padding:6px 6px;font-size:11px;text-transform:uppercase;
    letter-spacing:.03em;color:#64748b;border-bottom:1px solid var(--border);white-space:nowrap}
  .lines td{padding:5px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  .lines td.num,.lines th.num{text-align:right}
  .lines input,.lines select{padding:5px 7px;font-size:13px}
  .lines .prod b{display:block;font-size:13px}
  .lines .prod small{color:var(--muted);font-size:11.5px}
  .lines .w-qty{width:74px}
  .lines .w-price{width:110px}
  .lines .w-disc{width:96px}
  .lines .w-dtype{width:62px}
  .totals{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#f8fafc}
  .totals dl{display:grid;grid-template-columns:1fr auto;gap:5px 18px;margin:0;font-size:13.5px}
  .totals dt{color:var(--muted)}
  .totals dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .totals .grand dt,.totals .grand dd{font-weight:800;font-size:16px;color:var(--text);
    border-top:1px solid var(--border);padding-top:7px;margin-top:3px}
  .totals .due dd{color:var(--danger);font-weight:700}
  .totals .due.ok dd{color:var(--ok)}
  .pick-group{border-top:1px solid var(--border);padding:8px 0 2px}
  .pick-group:first-child{border-top:0}
  .pick-group h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
    color:var(--muted);margin:0 0 5px}
  .pick-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;font:inherit}
  .pick-row:hover{background:var(--primary-50);border-color:var(--primary-200)}
  .pick-row .code{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
  .pick-row .grow{flex:1;min-width:0}
  .pick-row .price{font-weight:700;font-variant-numeric:tabular-nums}
  .pick-row[disabled]{opacity:.55;cursor:not-allowed}
  .paylist{display:flex;flex-direction:column;gap:7px}
  .payrow{display:flex;gap:7px;align-items:center}
  .payrow .amt{width:130px}
  .searchbox{position:relative;display:inline-flex;align-items:center}
  .searchbox .ic{position:absolute;left:9px;color:var(--muted);pointer-events:none}
  .searchbox input{padding-left:30px}
  .searchbox input::-webkit-search-cancel-button{cursor:pointer}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  /* buttons */
  /* Ningún color escrito a mano: los tintes son tokens. Y --sans explícito,
     porque un <button> no hereda la tipografía del body: se queda con la del
     sistema operativo si nadie se la dice. */
  .btn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 17px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);transition:background .12s,border-color .12s,box-shadow .12s,color .12s}
  /* `:not(:disabled)` en cada estado: un botón apagado se atenúa y no contesta. */
  .btn:hover:not(:disabled){background:var(--hover)}
  .btn:active:not(:disabled){background:var(--press)}
  /* El mismo anillo que un campo de texto: el sistema tiene un solo foco.
     `:focus-visible` y no `:focus`, si no aparece también al hacer clic. */
  .btn:focus{outline:none}
  .btn:focus-visible{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  /* El principal es el único que sale de la marca: índigo plano en reposo y el
     tramo azul a violeta recién cuando alguien lo toca. El destello va también
     en `:active` y no sólo en `:hover`, porque en el mostrador se trabaja con
     pantalla táctil y ahí no hay "encima": tocarlo es la única forma de verlo. */
  .btn.primary{background:var(--action);border-color:var(--action-600);color:#fff;position:relative;z-index:0}
  /* Un degradado no interpola: `transition:background` de un color plano a
     linear-gradient() no anima nada, salta. Por eso el destello es una capa
     propia que se desvanece encima del índigo. `z-index:-1` con el botón en
     `z-index:0` la deja arriba del fondo y abajo del texto y del ícono. */
  .btn.primary::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
    background:var(--action-bloom);opacity:0;transition:opacity .24s ease}
  /* Entra más rápido de lo que sale: al salir se apaga de a poco, que es lo
     que lo hace parecer luz y no un interruptor. */
  .btn.primary:hover:not(:disabled)::before{opacity:1;transition:opacity .16s ease-out}
  /* `background` acá parece redundante contra la regla de arriba, pero es lo
     que sostiene todo: sin él gana `.btn:hover` (una clase menos, pero un
     estado más) y el fondo pasa a --hover, que es casi blanco. Con la capa
     del destello a media opacidad se ve ese blanco por debajo y el botón
     destella en blanco antes de llegar al degradado. */
  .btn.primary:hover:not(:disabled){background:var(--action);border-color:var(--action-bloom-border)}
  /* Apretar es inmediato: un botón que tarda en hundirse se siente roto. */
  .btn.primary:active:not(:disabled)::before{background:var(--action-bloom-press);opacity:1;transition:none}
  .btn.primary:active:not(:disabled){background:var(--action);border-color:var(--action-bloom-border)}
  .btn.primary:focus-visible{border-color:var(--action-bloom-border);box-shadow:0 0 0 3px var(--action-ring)}
  /* Quien pidió menos movimiento ve el mismo destello, sin el desvanecido. */
  @media(prefers-reduced-motion:reduce){
    .btn.primary::before,.btn.primary:hover:not(:disabled)::before{transition:none}
  }
  /* Rojo de contorno, no lleno: un rojo lleno es un saldo, no un botón. El foco
     también va en rojo, porque acá el color dice qué hace el botón. */
  .btn.danger{background:var(--panel);border-color:var(--danger-200);color:var(--danger)}
  .btn.danger:hover:not(:disabled){background:var(--danger-50)}
  .btn.danger:active:not(:disabled){background:var(--danger-50);border-color:var(--danger)}
  .btn.danger:focus-visible{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-50)}
  .btn.sm{padding:5px 10px;font-size:12px}
  /* ---------- icons (embedded Lucide sprite) ---------- */
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  .ic.lg{width:18px;height:18px}
  .btn .ic{margin-right:-1px}
  /* Sin borde, así que le toca el tinte fuerte: es lo único que lo señala. */
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover:not(:disabled){background:var(--press)}
  /* inputs */
  label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--label);margin-bottom:5px}
  label.fld .req{color:var(--danger)}
  input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-control);padding:8px 10px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
  textarea{resize:vertical;min-height:64px}
  input[type=checkbox]{width:auto}
  .inp-sm{padding:6px 9px;font-size:13px}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--label);font-weight:500;cursor:pointer;user-select:none}
  /* table */
  .tbl-wrap{overflow:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}
  /* Clavados arriba del marco que scrollea: mirar la fila 200 sin saber qué
     columna es cada una es lo que hace inusable una grilla larga. */
  thead th{text-align:left;padding:9px 10px;background:#f8fafc;color:#64748b;font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:2}
  /* Una fila, una línea. Con el texto cortando en dos, un código como
     ARM-001 o un tipo como "Lentes de contacto" llevaban la fila de 37 a
     55 px y se perdía un tercio de las filas visibles. El texto largo se
     recorta con `trunc`, que deja el valor entero en el title. */
  tbody td{padding:6px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap;
    max-width:200px;overflow:hidden;text-overflow:ellipsis}
  /* Las acciones y los números no se recortan: un botón a medias no se
     puede apretar y un importe cortado miente. */
  td.actions,td.num{max-width:none;overflow:visible}
  /* Un estilo se abre en sus colores adentro de la misma grilla: la fila padre
     no se va de pantalla, así se compara el color contra el estilo sin perder
     el lugar. El triángulo dice si está abierta. */
  tr.expandable{cursor:pointer}
  tr.expandable>td:first-child{position:relative;padding-left:26px}
  tr.expandable>td:first-child::before{content:"";position:absolute;left:9px;top:50%;
    width:0;height:0;border:4px solid transparent;border-left-color:var(--muted);
    transform:translateY(-50%);transition:transform .15s}
  tr.expandable.open>td:first-child::before{transform:translateY(-50%) rotate(90deg)}
  tr.expandable:hover{background:var(--hover)}
  tr.expandable:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--primary-50)}
  /* La hija va corrida y con el filo del color de acción: se lee como parte de
     la de arriba y no como un producto suelto de la lista. */
  tr.subrow>td{background:#fbfdff}
  tr.subrow>td:first-child{padding-left:40px;box-shadow:inset 3px 0 0 var(--action)}
  tr.subrow td .fhelp{display:none}
  /* Long free text must not push the grid into a horizontal scroll. The full
     value stays available in the cell's title tooltip. */
  td.trunc{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Secondary columns drop out as the window narrows, so a wide grid degrades
     by showing less rather than by scrolling sideways. Mark them with
     `priority: 2 | 3` in the column definition — 3 disappears first.
     Los cortes salen de medir el ancho natural de la grilla de Productos, que
     es la más ancha: con las tres prioridades pide 1610px de ventana, sin la 3
     pide 1438 y sin ninguna 1058. Los valores anteriores (1460 y 1250) caían
     adentro de esos rangos, así que la columna seguía visible justo cuando ya
     no entraba y la tabla se iba de costado. Van con aire para nombres más
     largos que los del demo. */
  @media(max-width:1680px){ .col-p3{display:none} }
  @media(max-width:1500px){ .col-p2{display:none} }
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fbfdff}
  tr.inactive{opacity:.5}
  td.actions{text-align:right;white-space:nowrap}
  td.actions .btn{margin-left:3px}
  /* Icon-only buttons for secondary row actions — they carry a title tooltip.
     Five text buttons per row cost ~390px, a quarter of the product grid. */
  .btn.ico{padding:5px;line-height:1;min-width:28px;justify-content:center}
  /* row overflow menu */
  .rowmenu{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;min-width:190px;animation:pop .12s ease}
  .rowmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
    padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);
    cursor:pointer;text-align:left}
  .rowmenu button:hover{background:var(--primary-50);color:var(--primary-600)}
  .rowmenu button.danger{color:var(--danger)}
  .rowmenu button.danger:hover{background:var(--danger-50)}
  .rowmenu .sep{height:1px;background:var(--border);margin:5px 2px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono);font-size:12.5px}
  /* badges */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.5}
  .badge.green{background:var(--ok-50);color:var(--ok)}
  .badge.gray{background:#f1f5f9;color:#64748b}
  .badge.blue{background:var(--primary-50);color:var(--primary)}
  .badge.amber{background:var(--warn-50);color:var(--warn)}
  .badge.red{background:var(--danger-50);color:var(--danger)}
  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .stat .v{font-size:28px;font-weight:750;margin-top:8px}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:500}
  /* Two-column reading layouts stay narrow — stretching a form to 1900px is
     unreadable. Data tables are deliberately not capped. */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1180px}
  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;font-size:13.5px}
  .tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .12s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:480px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;animation:pop .14s ease}
  .modal.wide{width:680px}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal header h3{font-size:16px}
  .modal .body{padding:20px;overflow:auto}
  .modal footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
  /* form */
  /* El aire es de la fila, no de quien la envuelve: con `form.` adelante no
     lo recibían ni las pantallas de acceso (form.login-card) ni el editor de
     ventas (div.form.grid2), y cada una lo parchaba con un margin inline. */
  .form-row{margin-bottom:14px}
  form.form.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  /* En dos columnas separa el gap de la grilla, no el margen de la fila. */
  .form.grid2 .form-row{margin-bottom:0}
  .form.grid2 .form-row.full{grid-column:1/-1}
  /* label + an action button on one line. Selects host their own "create"
     entry (see quickCreateTail); a checklist has no list to host it, so the
     button lives up here beside the label. */
  .fld-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
  /* On a full-width row, space-between strands the button ~500px from the
     label and it reads as decoration. Checklists keep it next to the label. */
  .fld-head.inline{justify-content:flex-start}
  .fld-head label.fld{margin-bottom:0}
  .fld-head .add{flex:0 0 auto;font-weight:700;line-height:1;padding:3px 9px}
  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px}
  .checklist label{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
  .fhelp{font-size:11.5px;color:var(--muted);margin-top:4px}
  .fwarn{font-size:11.5px;color:var(--warn);background:var(--warn-50);border:1px solid #fde68a;border-radius:6px;padding:5px 8px;margin-top:5px}
  /* ---------- import wizard ---------- */
  /* ---------- mapa de pasos ----------
     Un camino, no una fila de pastillas: la línea dice cuánto falta y por dónde
     se viene. Lo recorrido se pinta con el tramo de la marca, el mismo azul a
     violeta del botón principal. La línea lleva el degradado entero y se
     descubre de izquierda a derecha con clip-path, así el color no se comprime
     en el tramo hecho: a mitad de camino se ve la mitad del espectro. */
  .stepmap{position:relative;display:flex;margin:2px 0 20px}
  .stepmap-line{position:absolute;top:13px;height:2px;border-radius:2px;background:var(--border);
    left:calc(50% / var(--n));right:calc(50% / var(--n))}
  .stepmap-line::after{content:"";position:absolute;inset:0;border-radius:2px;
    background:var(--action-bloom);clip-path:inset(0 calc(100% - var(--avance)) 0 0);
    transition:clip-path .35s ease}
  .stepmap-step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px}
  .stepmap-dot{width:26px;height:26px;border-radius:var(--radius-pill);display:grid;place-items:center;
    font-size:12px;font-weight:700;background:var(--panel);border:2px solid var(--border);
    color:var(--muted);position:relative;z-index:1;transition:background .25s,border-color .25s,color .25s}
  .stepmap-dot .ic{width:14px;height:14px;stroke-width:3}
  /* `background-origin` va DESPUÉS de la taquigrafía `background`, que lo
     resetea: el degradado se dimensiona con la caja de origen (padding-box,
     22px) pero se pinta hasta el borde (border-box, 26px), así que los 2px del
     borde transparente los rellenaba repitiendo el mosaico y aparecía una
     medialuna violeta, el final del degradado, pegada al azul del principio. */
  .stepmap-step.done .stepmap-dot{background:var(--action-bloom);background-origin:border-box;
    border-color:transparent;color:#fff}
  .stepmap-step.on .stepmap-dot{background:var(--action);border-color:var(--action);color:#fff;
    box-shadow:0 0 0 4px var(--action-ring)}
  .stepmap-txt{font-size:12px;font-weight:600;color:var(--muted);text-align:center;
    overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
  .stepmap-step.on .stepmap-txt{color:var(--text)}
  .stepmap-step.done .stepmap-txt{color:var(--action-600)}
  @media(prefers-reduced-motion:reduce){ .stepmap-line::after{transition:none} }
  /* El contenido de un paso entra y sale, y el marco acompaña el cambio de alto
     en vez de saltar. El sentido lo da la dirección: adelante entra desde la
     derecha, atrás desde la izquierda, igual que el mapa de arriba. */
  .wizstage{transition:height .26s ease}
  .wizpane{transition:opacity .16s ease,transform .16s ease}
  @media(prefers-reduced-motion:reduce){ .wizstage,.wizpane{transition:none} }
  .wizard table{margin-bottom:12px}
  .wizard input[type=file]{display:block;width:100%;padding:10px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:var(--bg);font-size:13px}
  .wizard .stats{margin-bottom:16px}
  /* Paso Colores: la regla arriba, las terminaciones agrupadas por lo que son. */
  .ccrule{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
  .ccrule select{width:auto}
  .ccsplit{display:flex;gap:6px 16px;flex-wrap:wrap;margin:10px 0 6px;font-size:12.5px}
  .ccsplit .tail,.ccphrase{background:var(--primary-50);color:var(--primary);border-radius:4px;padding:0 4px}
  .ccgroup{margin-bottom:8px;overflow:hidden}
  .ccgroup>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:13px}
  .ccgroup>summary::-webkit-details-marker{display:none}
  .ccgroup>summary .chev{transform:rotate(-90deg);transition:transform .15s;flex:0 0 auto}
  .ccgroup[open]>summary .chev{transform:none}
  .ccgroup>summary .swatch-cell{gap:0}
  .ccgroup .phr{color:var(--muted);font-family:var(--mono);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ccgroup .n{color:var(--muted);font-size:12px;white-space:nowrap}
  .ccgroup table{margin:0}
  .ccgroup td select{max-width:230px}
  .ccgroup .ccotro{display:block;margin-top:5px;max-width:230px}
  .ccgroup .ccotro[hidden]{display:none}
  .ccbulk{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;padding:0 14px 10px}
  .ccfam{padding:7px 0;border-top:1px solid var(--border);font-size:12.5px}
  .ccfam:first-child{border-top:0}
  .ccvars{display:flex;flex-wrap:wrap;gap:3px 16px;margin-top:3px}
  .ccmuted{color:var(--muted)}
  @media(prefers-reduced-motion:reduce){ .ccgroup>summary .chev{transition:none} }
  .errlist{max-height:220px;overflow:auto;font-size:12.5px;font-family:var(--mono);background:var(--danger-50);border:1px solid #fecaca;border-radius:var(--radius-sm);padding:10px;margin-top:8px}
  .errlist div{padding:2px 0}
  .req{color:var(--danger)}
  .radios{display:flex;gap:16px;flex-wrap:wrap;padding:2px 0}
  .radios label{display:flex;align-items:center;gap:7px;font-weight:500;font-size:13px;
    cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .pricehint{font-size:12px;color:var(--muted);margin-top:5px}
  .pricehint b{color:var(--ok);font-size:14px}
  /* two controls sharing one row (the sale form's discount type + amount) */
  .with-add{display:flex;gap:6px;align-items:stretch}
  .with-add select{flex:1;min-width:0}
  /* colour swatches. A native <select> cannot paint its own options the same
     way across browsers, so the chip beside it mirrors the current choice. */
  .swatch{width:15px;height:15px;border-radius:4px;border:1px solid rgba(15,23,42,.18);
    flex:0 0 auto;display:inline-block;vertical-align:-2px;background:#fff}
  .swatch.none{background:repeating-linear-gradient(45deg,#fff,#fff 3px,#e2e8f0 3px,#e2e8f0 6px)}
  .swatch-cell{display:inline-flex;align-items:center;gap:7px}
  /* several colours in one cell: the chips overlap slightly so a long list
     stays narrow, and the names go in the tooltip. */
  .swatch-row{display:inline-flex;align-items:center;gap:6px}
  .swatch-row .chips{display:inline-flex}
  .swatch-row .chips .swatch + .swatch{margin-left:-5px}
  .swatch-row .more{color:var(--muted);font-size:12px}
  .colorpick{display:flex;gap:8px;align-items:center;margin-top:8px}
  .colorpick .hexin{flex:0 0 122px;font-family:var(--mono,ui-monospace,monospace);text-transform:lowercase}
  .colorpick .hexin.bad{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-50)}
  .colorpick .clear{flex:0 0 auto;margin-left:auto}
  /* "otro": a native colour dialog behind a normal-looking button, since the
     raw <input type=color> renders differently in every browser. */
  .colorpick .native{position:relative;overflow:hidden;flex:0 0 auto}
  .colorpick .native input[type=color]{position:absolute;inset:0;opacity:0;
    width:100%;height:100%;padding:0;border:0;cursor:pointer}
  /* preset palette: one row per family, chips only — the name is the tooltip,
     so adding a shade never reflows the form. */
  .palette{display:flex;flex-direction:column;gap:5px}
  .palette .fam{display:flex;gap:5px;flex-wrap:wrap}
  .palette .pal{width:22px;height:22px;border-radius:6px;padding:0;cursor:pointer;
    border:1px solid rgba(15,23,42,.18);flex:0 0 auto;transition:transform .1s}
  .palette .pal:hover{transform:scale(1.14)}
  .palette .pal.on{outline:2px solid var(--primary);outline-offset:2px}
  /* the codes a variant generation is about to create */
  .codeprev{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
  .codeprev code{background:var(--primary-50);color:var(--primary-600);
    border-radius:6px;padding:3px 8px;font-size:12.5px}
  .codeprev .fhelp{width:100%;margin:0}
  .cprev{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;
    color:var(--muted)}
  .cprev b{color:var(--text);font-weight:600}
  /* toast */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:80}
  .toast{background:#0f172a;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;animation:slide .16s ease}
  .toast.err{background:var(--danger)}
  .toast.ok{background:var(--ok)}
  @keyframes slide{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13.5px}
  .kv dt{color:var(--muted);font-weight:600}
  .kv dd{margin:0}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .2s}
    .sidebar.open{transform:none}
    .menu-btn{display:block}
    .grid2{grid-template-columns:1fr}
    form.form.grid2{grid-template-columns:1fr}
  }
</style>

<script>
"use strict";
/* =========================================================================
   SGI Óptica — consola de gestión en un solo archivo (vanilla JS).
   FastAPI la sirve en el mismo origen en /app, así que llama a /api/... directo.
   Convención: el código, los paths y los VALORES de enum quedan en inglés;
   sólo se traduce lo que ve el usuario.
   ========================================================================= */

const TOKEN_KEY = "sgi_token";
const state = { token: null, user: null, perms: new Set(), company: null, currency: "ARS" };
const root = document.getElementById("root");

/* Etiquetas en español para los valores de enum (los valores enviados a la API
   siguen en inglés). */
const ENUM_ES = {
  supplier_type: { merchandise: "Mercadería", laboratory: "Laboratorio", workshop: "Taller" },
  movement_type: { inbound: "Ingreso", outbound: "Egreso", adjustment: "Ajuste", transfer: "Transferencia" },
  treatment_type: { myopia: "Miopía", astigmatism: "Astigmatismo", hyperopia: "Hipermetropía", presbyopia: "Presbicia", other: "Otro" },
  payment_method: { cash: "Efectivo", transfer: "Transferencia", card: "Tarjeta" },
  sale_status: { quote: "Presupuesto", confirmed: "Confirmada", pending: "Pendiente", delivered: "Entregada", cancelled: "Anulada" },
};
const PAYMENT_METHOD_OPTIONS = Object.entries(ENUM_ES.payment_method)
  .map(([value, label]) => ({ value, label }));
const SALE_STATUS_BADGE = { quote:"gray", confirmed:"blue", pending:"amber", delivered:"green", cancelled:"red" };

/* Shades an optics shop actually stocks, grouped the way someone looks for
   them. Clicking one fills the tone *and*, if the name is still blank, the
   name — so "Havana" is one click away instead of a hex hunt. Nothing here is
   a catalogue entry: it is a starting point for the colour you are creating.
   The name is the tooltip, so a group can grow without a layout change. */
const COLOR_PRESETS = [
  { group: "Neutros", shades: [
    ["Negro", "#1a1a1a"], ["Grafito", "#3b3f45"], ["Gris", "#8a8f98"],
    ["Gris claro", "#c3c8cf"], ["Blanco", "#f5f5f5"], ["Hueso", "#ece5d8"],
    ["Beige", "#d8c8ae"], ["Nude", "#e0bda4"],
  ]},
  { group: "Careys y marrones", shades: [
    ["Havana", "#8b5a2b"], ["Carey", "#7a4a1e"], ["Marrón", "#6b4423"],
    ["Tabaco", "#5a3a22"], ["Caramelo", "#a9702f"], ["Terracota", "#b2593a"],

/* ----------------------------- tiny helpers ----------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => (v == null ? "" : String(v).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])));
/* Una <label> sin `for` no etiqueta nada: el clic no enfoca el campo y un
   lector de pantalla anuncia el control sin nombre. El markup de los
   formularios se arma con strings en decenas de lugares, así que en vez de
   repartir ids a mano los emparejamos acá: cada `.fld` toma el primer control
   de su fila y le presta un id. Corre sobre lo que se va agregando al DOM, así
   no hay forma de que una pantalla nueva se olvide. */
let _fldSeq = 0;
function linkFields(scope) {
  const labels = scope.querySelectorAll ? scope.querySelectorAll("label.fld:not([for])") : [];
  for (const lab of labels) {
    if (lab.querySelector("input,select,textarea")) continue;   // ya lo envuelve
    const row = lab.closest(".form-row") || lab.parentElement;
    if (!row) continue;
    const ctl = row.querySelector("input,select,textarea");
    if (!ctl) continue;
    if (!ctl.id) ctl.id = "f" + (++_fldSeq);
    lab.setAttribute("for", ctl.id);
  }
}
new MutationObserver(muts => {
  for (const m of muts)
    for (const n of m.addedNodes)
      if (n.nodeType === 1) linkFields(n);
}).observe(document.documentElement, { childList: true, subtree: true });

const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* Wait for typing to pause before firing. Search boxes hit the API on every
   keystroke otherwise. */
function debounce(fn, ms = 250) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

/* A <select> bound to a filter bag, so `bag[key]` is what the API receives. */
function filterSelect(bag, key, map, label) {
  const opts = Object.entries(map).map(([id, name]) =>
    `<option value="${esc(id)}" ${String(bag[key]) === String(id) ? "selected" : ""}>${esc(name)}</option>`).join("");
  return `<select class="inp-sm" data-filter="${esc(key)}" style="width:auto"><option value="">${esc(label)}</option>${opts}</select>`;
}

/* Filter bag → query string, dropping anything unset so the API sees only the
   filters actually in play. */
function queryString(bag) {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(bag)) {
    if (v === "" || v == null || v === false) continue;
    p.set(k, v === true ? "true" : v);
  }
  const s = p.toString();
  return s ? "?" + s : "";
}

/* The filtered-list pattern shared by Stock, Ventas and Cuentas pendientes:
   paint the toolbar once, then refill only the results below it. Re-rendering
   the toolbar on each keystroke would take the caret out of the search box. */
function wireFilters(scope, bag, reload) {
  const debounced = debounce(reload, 250);
  const input = $("input[type=search]", scope);
  if (input) {
    input.addEventListener("input", () => { bag.q = input.value.trim(); debounced(); });
    // "search" fires on the little ✕ — clearing should feel immediate.
    input.addEventListener("search", () => { bag.q = input.value.trim(); reload(); });
  }
  $$("[data-filter]", scope).forEach(s => s.addEventListener("change", () => {
    bag[s.dataset.filter] = s.value; reload();
  }));
  $$("[data-toggle]", scope).forEach(c => c.addEventListener("change", () => {
    bag[c.dataset.toggle] = c.checked; reload();
  }));
}

/* Fetch with the bag as the query string and paint the rows. `onRowClick`
   makes the whole row open something (a sale, say). */
function resultsInto(body, endpoint, bag, columns, empty, onRowClick) {
  body.innerHTML = `<div class="loading">Cargando…</div>`;
  return api("GET", endpoint + queryString(bag))
    .then(rows => {
      body.innerHTML = rows.length
        ? renderTable(columns, rows)
        : `<div class="empty">${esc(empty)}</div>`;
      if (!onRowClick) return;
      $$("tbody tr", body).forEach((tr, i) => {
        tr.style.cursor = "pointer";
        tr.addEventListener("click", () => onRowClick(rows[i]));
      });
    })
    .catch(e => body.innerHTML = `<div class="card error">${esc(e.message)}</div>`);
}

/* A search box with the magnifier tucked inside it. */
function searchBox(id, value, placeholder, width = "260px") {
  return `<span class="searchbox" style="width:${width}">
    <svg class="ic"><use href="#i-search"/></svg>
    <input class="inp-sm" id="${esc(id)}" type="search" value="${esc(value || "")}" placeholder="${esc(placeholder)}">
  </span>`;
}

/* Normalise a swatch to "#rrggbb", or null when it is not a colour at all.
   The twin of _norm_hex() in app/schemas/product.py: the form must accept
   exactly what the API accepts, so a valid entry never round-trips to a 422. */
function normHex(v) {
  const raw = String(v ?? "").trim().replace(/^#/, "");
  if (!/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(raw)) return null;
  const d = raw.toLowerCase();
  return "#" + (d.length === 3 ? [...d].map(c => c + c).join("") : d);
}

/* A colour chip followed by its name. `hex` may be null — a colour without a
   tone still shows, with a hatched chip instead of a filled one. */
function swatchCell(hex, label) {
  const valid = /^#[0-9a-f]{6}$/i.test(hex || "");
  const chip = valid
    ? `<span class="swatch" style="background:${esc(hex)}"></span>`
    : `<span class="swatch none"></span>`;
  return `<span class="swatch-cell">${chip}${esc(label ?? "")}</span>`;
}

/* Several colours in one cell: up to `max` chips, the first name, and "+N".
   The full list is the tooltip, so nothing is lost to the truncation. */
function swatchList(colors, max = 4) {
  if (!colors || !colors.length) return "—";
  const chips = colors.slice(0, max).map(c =>
    /^#[0-9a-f]{6}$/i.test(c.hex_code || "")
      ? `<span class="swatch" style="background:${esc(c.hex_code)}"></span>`
      : `<span class="swatch none"></span>`).join("");
  const names = colors.map(c => c.name).join(", ");
  const label = colors.length === 1
    ? esc(colors[0].name)
    : `${esc(colors[0].name)} <span class="more">+${colors.length - 1}</span>`;
  return `<span class="swatch-row" title="${esc(names)}"><span class="chips">${chips}</span>${label}</span>`;
}

function toast(msg, type = "") {
  const t = el(`<div class="toast ${type}">${esc(msg)}</div>`);
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 300); }, type === "err" ? 5200 : 3000);
}

/* `currency` overrides the company's — a price list carries its own (ARS/USD)
   and its prices must not be shown with the wrong symbol. */
function fmtMoney(v, currency) {
  if (v == null || v === "") return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return esc(v);
  const cur = currency || state.currency || "ARS";
  try { return new Intl.NumberFormat("es-AR", { style:"currency", currency: cur, maximumFractionDigits:2 }).format(n); }
  catch { return n.toFixed(2); }
}
const fmtNum  = (v) => (v == null || v === "" ? "—" : String(Number(v)));
const fmtDate = (v) => (v ? new Date(v).toLocaleDateString("es-AR") : "—");
const fmtDateTime = (v) => (v ? new Date(v).toLocaleString("es-AR", { dateStyle:"short", timeStyle:"short" }) : "—");
function badge(text, cls) { return `<span class="badge ${cls}">${esc(text)}</span>`; }
const boolBadge = (v) => v ? badge("Activo","green") : badge("Inactivo","gray");

const TITLECASE = (s) => String(s||"").replace(/_/g," ").replace(/\b\w/g, c => c.toUpperCase());

/* ----------------------------- API client ------------------------------ */
function errMsg(data, status) {
  if (data == null) return `HTTP ${status}`;
  if (typeof data === "string") return data;
  const d = data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(e => `${(e.loc || []).slice(1).join(".") || "campo"}: ${e.msg}`).join("; ");
  return JSON.stringify(data);
}

async function api(method, path, body) {
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const opts = { method, headers };
  if (body !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (res.status === 401) { logout(); throw new Error("La sesión expiró. Iniciá sesión de nuevo."); }
  if (res.status === 204) return null;
  const txt = await res.text();
  let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch { data = txt; } }
  if (!res.ok) throw new Error(errMsg(data, res.status));
  return data;
}

/* multipart upload — Content-Type is left unset on purpose so the browser
   adds the multipart boundary itself */
async function apiUpload(path, file) {
  const fd = new FormData();
  fd.append("file", file);
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(path, { method: "POST", headers, body: fd });
  if (res.status === 401) { logout(); throw new Error("La sesión expiró. Iniciá sesión de nuevo."); }
  const txt = await res.text();
  let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch { data = txt; } }
  if (!res.ok) throw new Error(errMsg(data, res.status));
  return data;
}

/* download a binary response (the .xlsx template) */
async function apiDownload(path, filename) {
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(path, { headers });
  if (!res.ok) { toast("No se pudo descargar la plantilla", "err"); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* options cache (for dropdowns referencing other entities) */
const _optCache = new Map();
function clearOptions() { _optCache.clear(); }
async function options({ endpoint, value = "id", label = "name", labelFn, metaFn }) {
  if (!_optCache.has(endpoint)) _optCache.set(endpoint, api("GET", endpoint).catch(() => []));
  const rows = await _optCache.get(endpoint);
  // `meta` carries whatever the widget needs beyond the label — the colour
  // select uses it for the swatch.
  return (rows || []).map(r => ({
    value: r[value],
    label: labelFn ? labelFn(r) : r[label],
    meta: metaFn ? metaFn(r) : undefined,
  }));
}
async function idMap(endpoint, label = "name", labelFn) {
  const rows = await (_optCache.has(endpoint) ? _optCache.get(endpoint) : (_optCache.set(endpoint, api("GET", endpoint).catch(() => [])), _optCache.get(endpoint)));
  const m = {};
  for (const r of (rows || [])) m[r.id] = labelFn ? labelFn(r) : r[label];
  return m;
}

/* ----------------------------- auth flow ------------------------------- */
function buildPerms(user) {
  const set = new Set();
  if (user.is_superuser) set.add("*");
  for (const role of (user.roles || [])) for (const p of (role.permissions || [])) set.add(p.code);
  return set;
}
const can = (code) => state.perms.has("*") || state.perms.has(code);

async function loadSession() {
  state.user = await api("GET", "/api/auth/me");
  state.perms = buildPerms(state.user);
  if (can("company:read")) {
    try { state.company = await api("GET", "/api/company"); state.currency = state.company.currency || "ARS"; } catch {}
  }
}

function logout() {
  state.token = null; state.user = null; state.perms = new Set(); state.company = null;
  localStorage.removeItem(TOKEN_KEY);
  clearOptions();
  renderLogin();
}

    } catch (err) {
      toast(err.message || "No se pudo enviar", "err");
      btn.disabled = false; btn.textContent = "Enviar enlace";
    }
  });
}

function renderNotice(title, message) {

/* Setting a password from an emailed link — both the invitation ("definí tu
   contraseña") and the reset ("elegí una nueva"). The token arrives in the URL
   fragment, which browsers never send to the server, so it stays out of access
   logs and the Referer header. */
async function renderSetPassword(token) {
  root.innerHTML = authShell(`<div class="login-card">
      <p class="sub" style="margin:0">Verificando el enlace…</p></div>`);
  let info;
  try {
    info = await (await fetch(`/api/auth/password-token/${encodeURIComponent(token)}`))
      .json().then(d => { if (d.detail) throw new Error(d.detail); return d; });
  } catch (err) {
    location.hash = "";
    return renderNotice("Enlace no válido", err.message || "El enlace no sirve. Pedí uno nuevo.");
  }
  const isInvite = info.purpose === "invitation";
  root.innerHTML = authShell(`
      <form class="login-card" id="pwdForm">
        <h1>${isInvite ? "Bienvenido/a" : "Nueva contraseña"}</h1>
        <p class="sub">${isInvite
          ? `Definí tu contraseña para entrar a <b>${esc(info.company_name)}</b>.`
          : `Elegí una contraseña nueva para <b>${esc(info.company_name)}</b>.`}</p>
        <div class="form-row">
          <label class="fld">Email</label>
          <input value="${esc(info.email)}" disabled>
        </div>
        <div class="form-row">
          <label class="fld">Contraseña <span class="req">*</span></label>
          <input name="p1" type="password" autocomplete="new-password" required minlength="8">
          <div class="fhelp">Mínimo 8 caracteres.</div>
        </div>
        <div class="form-row">
          <label class="fld">Repetir contraseña <span class="req">*</span></label>
          <input name="p2" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <button class="btn primary" type="submit" style="width:100%;justify-content:center;margin-top:18px">Guardar y entrar</button>
      </form>`);
  $("#pwdForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = $("#pwdForm");
    const p1 = $("[name=p1]", form).value, p2 = $("[name=p2]", form).value;
    if (p1 !== p2) return toast("Las contraseñas no coinciden", "err");
    const btn = $("button", form); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      const res = await fetch("/api/auth/set-password", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: p1 }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(errMsg(data, res.status));
      // The endpoint hands back a session, so they land in the console instead
      // of at a login form they would fill in with what they just chose.
      state.token = data.access_token;
      localStorage.setItem(TOKEN_KEY, state.token);
      location.hash = "#/dashboard";
      await loadSession();
      renderApp();
      toast("Listo, tu contraseña quedó definida", "ok");
    } catch (err) {
      toast(err.message || "No se pudo guardar", "err");
      btn.disabled = false; btn.textContent = "Guardar y entrar";
    }
  });
}

/* Second step of login, shown only when the credentials open more than one

  root.innerHTML = authShell(`

/* Read the (unverified) payload of our own JWT. Only used to decide whether to
   paint the support banner — the server is what actually enforces anything. */
function tokenClaims() {
  try {
    const part = (state.token || "").split(".")[1];
    if (!part) return {};
    return JSON.parse(atob(part.replace(/-/g, "+").replace(/_/g, "/")));
  } catch { return {}; }
}

function highlightNav(section) {
  $$("#sidebar .nav a").forEach(a => a.classList.toggle("active", a.dataset.route === section));
  const n = NAV.find(x => x.route === section);
  const crumb = $("#crumb"); if (crumb) crumb.textContent = n ? n.label : "—";
}

async function route() {
  if (!state.user) return;
  const hash = location.hash.slice(1) || "/dashboard";
  const [section, arg] = hash.split("/").filter(Boolean);
  const sec = section || "dashboard";
  highlightNav(sec);
  const view = $("#view");
  view.innerHTML = `<div class="loading">Cargando…</div>`;
  const nav = NAV.find(n => n.route === sec);
  if (nav && nav.perm && !can(nav.perm)) { view.innerHTML = `<div class="card error">No tenés permiso para ver esta sección.</div>`; return; }
  try {
    switch (sec) {
      case "dashboard": await dashboardView(view); break;
      case "products":  await productsView(view); break;
      case "catalog":   await catalogView(view); break;
      case "pricing":   await pricingView(view); break;
      case "stock":     await stockView(view); break;
      case "sales":     await salesView(view); break;
      case "pending":   await pendingView(view); break;
      case "customers": arg ? await customerDetailView(view, arg) : await customersView(view); break;
      case "suppliers": await resourceView(view, CONFIG.suppliers); break;
      case "branches":  await resourceView(view, CONFIG.branches); break;
      case "users":     await usersView(view); break;
      case "company":   await companyView(view); break;
      default: view.innerHTML = `<div class="card pad">Sección no encontrada.</div>`;
    }
  } catch (e) {
    view.innerHTML = `<div class="card error">${esc(e.message)}</div>`;
    toast(e.message, "err");
  }
  /* Una pantalla es "de grilla" cuando la tabla es su contenido, no cuando está
     metida adentro de una ficha o de una solapa. Se decide mirando el DOM ya
     pintado en vez de listar secciones a mano: una sección nueva que devuelva
     una tabla entra sola, y una que la anide no se rompe. */
  const content = view.parentElement;
  if (content) content.classList.toggle("grid-page", !!view.querySelector(":scope > .tbl-wrap"));
}

/* ------------------------------- modal --------------------------------- */
function openModal({ title, body, onConfirm, confirmLabel = "Guardar", wide = false }) {
  const overlay = el(`<div class="overlay"><div class="modal ${wide ? "wide" : ""}">
      <header><h3>${esc(title)}</h3><button class="x" type="button"><svg class="ic"><use href="#i-x"/></svg></button></header>
      <div class="body"></div>
      <footer></footer></div></div>`);
  // Only the topmost modal reacts to Escape, so closing a nested quick-create
  // form does not also close the form that opened it.
  const onKeydown = (e) => { if (e.key === "Escape" && overlay === document.body.lastElementChild) close(); };
  const close = () => { document.removeEventListener("keydown", onKeydown); overlay.remove(); };
  overlay.querySelector(".body").appendChild(body);
  const foot = overlay.querySelector("footer");
  /* "Cancelar" existe para hacer pareja con "Guardar": es la salida sin
     guardar. Un modal que no guarda nada no la necesita, y el "Cerrar" que iba
     ahí repetía la cruz de la esquina. Sin botones, el pie no se dibuja: la
     cruz, Escape y el clic afuera ya cierran. */
  if (onConfirm) {
    const cancel = el(`<button class="btn" type="button">Cancelar</button>`);
    cancel.addEventListener("click", close); foot.appendChild(cancel);
    const ok = el(`<button class="btn primary" type="button">${esc(confirmLabel)}</button>`);
    ok.addEventListener("click", async () => { ok.disabled = true; try { await onConfirm(close); } finally { ok.disabled = false; } });
    foot.appendChild(ok);
  }
  if (!foot.children.length) foot.remove();
  overlay.querySelector(".x").addEventListener("click", close);
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", onKeydown);
  document.body.appendChild(overlay);
  return close;
}

/* ------------------------- generic form builder ------------------------ */
async function buildForm(fields, values = {}, grid = false) {
  // resolve dynamic option sources
  for (const f of fields) {
    if (f.optionsFrom) f._opts = await options(f.optionsFrom);
    else if (f.options) f._opts = f.options;
  }
  const form = el(`<form class="form ${grid ? "grid2" : ""}"></form>`);
  form.addEventListener("submit", e => e.preventDefault());
  for (const f of fields) {
    const v = values[f.key];
    const row = el(`<div class="form-row ${f.full ? "full" : ""}"></div>`);
    const reqMark = f.required ? ` <span class="req">*</span>` : "";
    if (f.type === "checkbox") {
      row.innerHTML = `<label class="switch"><input type="checkbox" name="${f.key}" ${v ? "checked" : ""}> ${esc(f.label)}</label>`;
    } else if (f.type === "multiselect") {
      const sel = new Set((v || []).map(String));
      // `swatch` paints o.meta (a hex) beside each name — the checklist twin of
      // the chip a swatch-backed select shows.
      const chip = (o) => !f.swatch ? ""
        : (/^#[0-9a-f]{6}$/i.test(o.meta || "")
            ? `<span class="swatch" style="background:${esc(o.meta)}"></span>`
            : `<span class="swatch none"></span>`);
      const box = (o, checked) => `<label><input type="checkbox" name="${f.key}" value="${esc(o.value)}" ${checked ? "checked" : ""}>${chip(o)} ${esc(o.label)}</label>`;
      const boxes = (f._opts || []).map(o => box(o, sel.has(String(o.value)))).join("");
      const quick = f.quickCreate && canQuickCreate(f.quickCreate);
      // Spelled out ("Nuevo color"), not a bare "+": beside a checklist there
      // is no field for a lone glyph to attach itself to, so it has to say
      // what it makes. The wording comes from the entity's own CONFIG.
      const addLabel = quick ? (CONFIG[f.quickCreate].newTitle || "Crear") : "";
      const head = quick
        ? `<div class="fld-head inline"><label class="fld">${esc(f.label)}${reqMark}</label>
           <button type="button" class="btn sm add"><svg class="ic"><use href="#i-plus"/></svg>${esc(addLabel)}</button></div>`
        : `<label class="fld">${esc(f.label)}${reqMark}</label>`;
      row.innerHTML = `${head}<div class="checklist">${boxes || '<span class="fhelp">ninguno</span>'}</div>`;
      if (quick) {
        const list = row.querySelector(".checklist");
        row.querySelector("button.add").addEventListener("click", () => quickCreate(f.quickCreate, (created) => {
          const placeholder = list.querySelector(".fhelp");
          if (placeholder) placeholder.remove();
          // Created from here means "I want this one", so it arrives ticked.
          const metaFn = f.optionsFrom && f.optionsFrom.metaFn;
          const added = el(box({
            value: created.id, label: created.name,
            meta: metaFn ? metaFn(created) : undefined,
          }, true));
          list.appendChild(added);
          added.scrollIntoView({ block: "nearest" });
        }));
      }
    } else if (f.type === "select") {
      // A required select normally has no empty option — you must pick. But an
      // empty list has nothing to pick, and leaving the option out makes the
      // browser default to quickCreate's sentinel (the first non-disabled
      // option), which posts as null. Say so instead.
      const hasOpts = (f._opts || []).length > 0;
      const allowEmpty = f.required
        ? (hasOpts ? "" : `<option value="">— sin opciones: creá una primero —</option>`)
        : `<option value="">— ninguno —</option>`;
      const opts = (f._opts || []).map(o => `<option value="${esc(o.value)}" ${String(v) === String(o.value) ? "selected" : ""}>${esc(o.label)}</option>`).join("");
      const quick = f.quickCreate && canQuickCreate(f.quickCreate);
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label>
        <select name="${f.key}">${allowEmpty}${opts}${quick ? quickCreateTail(f.quickCreate) : ""}</select>`;
      const selectEl = row.querySelector("select");
      if (quick) {
        selectEl._quick = f.quickCreate;      // survives setSelectOptions
        selectEl._prev = selectEl.value;
        selectEl.addEventListener("change", (e) => {
          if (selectEl.value !== QUICK_NEW) { selectEl._prev = selectEl.value; return; }
          // An action, not a value. Put the picker back before any other
          // listener (dependent selects, price preview) can read the sentinel.
          selectEl.value = selectEl._prev || "";
          e.stopImmediatePropagation();
          e.stopPropagation();
          quickCreate(f.quickCreate, (created) => {
            // Ahead of the separator, so the list keeps ending with the action.
            selectEl.insertBefore(
              el(`<option value="${esc(created.id)}">${esc(created.name)}</option>`),
              selectEl.querySelector("option[disabled]"));
            selectEl.value = String(created.id);
            selectEl._prev = selectEl.value;
            selectEl.dispatchEvent(new Event("change", { bubbles: true }));
          });
        });
      }
    } else if (f.type === "color") {
      // A tone is optional ("sin tono" is a real state), so the field cannot
      // just be an <input type="color"> — that always holds a colour. The hex
      // text input is the source of truth and carries the name; emptiness is
      // tracked on it, and the palette / native dialog only write into it.
      const cur = normHex(v) || "";
      const palette = COLOR_PRESETS.map(g =>
        `<div class="fam">${g.shades.map(([name, hex]) =>
          `<button type="button" class="pal" data-hex="${hex}" data-name="${esc(name)}" style="background:${hex}" title="${esc(name)} · ${hex}"></button>`
        ).join("")}</div>`).join("");
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label>
        <div class="palette">${palette}</div>
        <div class="colorpick">
          <input type="text" class="hexin" name="${f.key}" value="${esc(cur)}"
                 placeholder="#rrggbb" maxlength="7" spellcheck="false">
          <span class="btn sm native"><svg class="ic"><use href="#i-palette"/></svg>Otro
            <input type="color" value="${esc(cur || "#1a1a1a")}" tabindex="-1"></span>
          <button type="button" class="btn sm clear">Sin tono</button>
        </div>
        <div class="cprev"></div>`;
      const input = row.querySelector(".hexin");
      const native = row.querySelector('input[type="color"]');
      const prev = row.querySelector(".cprev");
      input._empty = !cur;

      // The preview names the colour being created, so you see the row exactly
      // as the lists will draw it. `nameField` says which field holds the name.
      const nameInput = () => f.nameField
        ? form.querySelector(`[name="${f.nameField}"]`) : null;

      const paint = () => {
        const hex = input._empty ? null : normHex(input.value);
        input.classList.toggle("bad", !input._empty && !hex);
        $$(".pal", row).forEach(b =>
          b.classList.toggle("on", !!hex && b.dataset.hex === hex));
        if (hex) native.value = hex;
        const label = (nameInput()?.value || "").trim();
        prev.innerHTML = !input._empty && !hex
          ? `<span style="color:var(--danger)">Tono inválido — usá #rrggbb.</span>`
          : `Vista previa: ${swatchCell(hex, label || "sin nombre")}`;
      };
      const setHex = (hex) => { input._empty = false; input.value = hex; paint(); };

      $$(".pal", row).forEach(b => b.addEventListener("click", () => {
        setHex(b.dataset.hex);
        // A blank name is almost certainly the preset's own name; a typed one
        // is the user's and must survive being shown a different shade.
        const ni = nameInput();
        if (ni && !ni.value.trim()) { ni.value = b.dataset.name; paint(); }
      }));
      input.addEventListener("input", () => { input._empty = !input.value.trim(); paint(); });
      native.addEventListener("input", () => setHex(native.value));
      row.querySelector("button.clear").addEventListener("click", () => {
        input._empty = true; input.value = ""; paint();
      });
      // The preview follows the name as it is typed.
      f._repaint = paint;
      paint();
    } else if (f.type === "radio") {
      const opts = (f._opts || []).map(o =>
        `<label><input type="radio" name="${f.key}" value="${esc(o.value)}" ${String(v ?? f.default) === String(o.value) ? "checked" : ""}> ${esc(o.label)}</label>`).join("");
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label><div class="radios">${opts}</div>`;
    } else if (f.type === "textarea") {
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label><textarea name="${f.key}" placeholder="${esc(f.placeholder||"")}">${esc(v ?? "")}</textarea>`;
    } else {
      const type = f.type === "decimal" || f.type === "int" ? "number" : (f.type || "text");
      const step = f.step != null ? `step="${f.step}"` : (f.type === "decimal" ? `step="0.01"` : (f.type === "int" ? `step="1"` : ""));
      const extra = [f.min!=null?`min="${f.min}"`:"", f.max!=null?`max="${f.max}"`:""].join(" ");
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label><input type="${type}" name="${f.key}" ${step} ${extra} placeholder="${esc(f.placeholder||"")}" value="${v != null ? esc(v) : ""}">`;
    }
    if (f.help) row.appendChild(el(`<div class="fhelp">${esc(f.help)}</div>`));
    f._row = row;
    form.appendChild(row);
  }

  // Fields with `showIf` appear only when the predicate holds for the current
  // values (e.g. "Precio" only in manual pricing mode). Hidden fields are
  // skipped by read() and by validate(), so they cannot block a save.
  const conditional = fields.filter(f => f.showIf);
  const applyVisibility = () => {
    if (!conditional.length) return;
    const current = form.read({ all: true });
    for (const f of conditional) {
      f._hidden = !f.showIf(current);
      f._row.style.display = f._hidden ? "none" : "";
    }
  };
  if (conditional.length) form.addEventListener("change", applyVisibility);

  // A colour preview names the colour, so it repaints while the name is typed.
  const repainters = fields.filter(f => f._repaint);
  if (repainters.length)
    form.addEventListener("input", () => repainters.forEach(f => f._repaint()));

  form.read = ({ all = false } = {}) => {
    const out = {};
    for (const f of fields) {
      if (!all && f._hidden) continue;
      if (f.type === "checkbox") { out[f.key] = form.querySelector(`[name="${f.key}"]`).checked; continue; }
      if (f.type === "multiselect") { out[f.key] = $$(`[name="${f.key}"]:checked`, form).map(i => Number(i.value)); continue; }
      if (f.type === "radio") { const c = form.querySelector(`[name="${f.key}"]:checked`); out[f.key] = c ? c.value : null; continue; }
      // Raw text when it cannot be normalised, so validate() can flag it
      // rather than the value silently vanishing.
      if (f.type === "color") { const c = form.querySelector(`[name="${f.key}"]`); out[f.key] = c._empty ? null : (normHex(c.value) || c.value); continue; }
      const elx = form.querySelector(`[name="${f.key}"]`);
      let raw = elx ? elx.value : "";
      if (raw === "" || raw == null) {
        // Campos numéricos: si quedan vacíos, se omiten para que aplique el
        // default / opcional del servidor (ej. ProductCreate.current_cost y
        // min_stock son Decimal no nulos con default).
        if (f.type === "decimal" || f.type === "int") continue;
        out[f.key] = null; continue;   // texto / FK opcionales → null explícito
      }
      if (f.type === "int" || f.valueType === "int") {
        // parseInt("__new__") is NaN, and JSON.stringify writes NaN as null —
        // which the server rejects with a 422 on a field the form believed was
        // filled in. Both the sentinel and NaN mean "nothing chosen".
        const n = raw === QUICK_NEW ? NaN : parseInt(raw, 10);
        out[f.key] = Number.isNaN(n) ? null : n;
      }
      else if (f.type === "decimal") out[f.key] = raw;            // string → Decimal de Pydantic
      else out[f.key] = raw;
    }
    return out;
  };
  applyVisibility();   // needs form.read, so it runs after the assignment above
  return form;
}

function validate(fields, payload) {
  for (const f of fields) {
    if (f._hidden) continue;
    const v = payload[f.key];
    if (f.type === "color" && v != null && !normHex(v))
      return `"${f.label}": el tono debe ser #rrggbb (por ejemplo #1a1a1a).`;
    if (!f.required) continue;
    if (v == null || v === "" || Number.isNaN(v) || (Array.isArray(v) && v.length === 0)) return `Falta completar "${f.label}".`;
  }
  return null;
}

/* The "create one" entry that lives at the foot of a picker's own list.
   A button beside the field is only found by someone already looking for it;
   this is found by everyone, because scrolling the list for the entry that
   isn't there is exactly the moment you need it. Last, not first: a select
   with nothing chosen shows its first option, and that must never be an
   action. */
const QUICK_NEW = "__new__";
function quickCreateTail(key) {
  return `<option disabled>──────────</option>`
       + `<option value="${QUICK_NEW}">＋ ${esc(CONFIG[key].newTitle)}…</option>`;
}

/* Replace a select's options in place, keeping the current value when it is
   still available. Used by the dependent selects of the product form. */
function setSelectOptions(selectEl, opts, { required = false } = {}) {
  const current = selectEl.value;
  const allowEmpty = required ? "" : `<option value="">— ninguno —</option>`;
  selectEl.innerHTML = allowEmpty + opts
    .map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("")
    // Rebuilding the list must not quietly drop the way to add to it.
    + (selectEl._quick ? quickCreateTail(selectEl._quick) : "");
  if (current && opts.some(o => String(o.value) === current)) selectEl.value = current;
}

/* Can the current user create the entity behind a quick-create button? The
   target has its own permission (a brand is products:write, not suppliers:write),
   so the "+" is hidden rather than offered and then refused with a 403. */
function canQuickCreate(key) {
  const cfg = CONFIG[key];
  return !!cfg && can(cfg.perm + ":write");
}

/* "+" beside a select or a checklist: create the referenced entity without
   losing the form you were filling in. `key` is a CONFIG entry (e.g. "brands");
   `adopt(created)` drops the new row into whichever widget asked for it. */
async function quickCreate(key, adopt) {
  const cfg = CONFIG[key];
  if (!cfg) return;
  await formModal({
    title: cfg.newTitle,
    fields: typeof cfg.fields === "function" ? cfg.fields("create") : cfg.fields,
    grid: cfg.grid,
    onSubmit: async (payload) => {
      const created = await api("POST", cfg.endpoint, payload);
      clearOptions();     // the cached option lists are now stale
      adopt(created);
      toast("Creado", "ok");
    },
  });
}

/* open a create/edit form modal backed by buildForm */
async function formModal({ title, fields, values = {}, confirmLabel = "Guardar", grid = false, onSubmit, onReady }) {
  const form = await buildForm(fields, values, grid);
  if (onReady) await onReady(form);
  openModal({ title, body: form, confirmLabel, wide: grid, onConfirm: async (close) => {
    const payload = form.read();
    const err = validate(fields, payload);
    if (err) return toast(err, "err");
    // Without this catch the rejection is unhandled: no toast, and the modal
    // just sits there as though the click did nothing. Stay open on failure so
    // the typed values survive and the message says what to change.
    try {
      await onSubmit(payload);
    } catch (e) {
      return toast(e.message || "No se pudo guardar.", "err");
    }
    close();
  }});
}

/* Overflow menu for secondary row actions. Keeps the grid narrow without
   hiding anything: every action stays reachable, just one click deeper. */
function openRowMenu(anchor, items) {
  const existing = document.querySelector(".rowmenu");
  if (existing) existing.remove();
  const menu = el(`<div class="rowmenu"></div>`);
  for (const it of items) {
    if (!it) continue;
    if (it.sep) { menu.appendChild(el(`<div class="sep"></div>`)); continue; }
    const b = el(`<button type="button" class="${it.danger ? "danger" : ""}">
      <svg class="ic"><use href="#${it.icon}"/></svg>${esc(it.label)}</button>`);
    b.addEventListener("click", () => { close(); it.onClick(); });
    menu.appendChild(b);
  }
  document.body.appendChild(menu);

  // Anchor below-right of the trigger, flipping up / clamping when it would
  // fall outside the viewport.
  const r = anchor.getBoundingClientRect();
  const below = r.bottom + 6;
  const flip = below + menu.offsetHeight > window.innerHeight - 8;
  menu.style.top = ((flip ? r.top - menu.offsetHeight - 6 : below) + window.scrollY) + "px";
  menu.style.left = (Math.max(8, Math.min(
    r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 8)) + window.scrollX) + "px";

  const onOut = (e) => { if (!menu.contains(e.target)) close(); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  const close = () => {
    menu.remove();
    document.removeEventListener("mousedown", onOut, true);
    document.removeEventListener("keydown", onKey, true);
    window.removeEventListener("scroll", close, true);
  };
  setTimeout(() => {
    document.addEventListener("mousedown", onOut, true);
    document.addEventListener("keydown", onKey, true);
    window.addEventListener("scroll", close, true);
  }, 0);
  return close;
}

function confirmDanger({ title, message, confirmLabel = "Eliminar", onConfirm }) {
  openModal({ title, confirmLabel, body: el(`<div>${esc(message)}</div>`), onConfirm: async (close) => { await onConfirm(); close(); } });
}

/* ------------------------------- table --------------------------------- */
/* El mapa de pasos de cualquier asistente. `i` es el paso actual, base 0. */
function stepMap(labels, i) {
  const n = labels.length;
  const avance = n > 1 ? (i / (n - 1)) * 100 : 100;
  return `<div class="stepmap" style="--n:${n};--avance:${avance}%">
    <div class="stepmap-line"></div>
    ${labels.map((l, k) => `<div class="stepmap-step ${k < i ? "done" : k === i ? "on" : ""}">
      <div class="stepmap-dot">${k < i ? `<svg class="ic"><use href="#i-check"/></svg>` : (k + 1)}</div>
      <div class="stepmap-txt" title="${esc(l)}">${esc(l)}</div>
    </div>`).join("")}
  </div>`;
}

function renderTable(columns, rows, rowActions, ctx) {
  if (!rows || !rows.length) return `<div class="card"><div class="empty">Sin registros.</div></div>`;
  const prio = (c) => c.priority ? ` col-p${c.priority}` : "";
  const head = columns.map(c => `<th class="${c.align === "right" ? "num" : ""}${prio(c)}">${esc(c.label)}</th>`).join("") + (rowActions ? "<th></th>" : "");
  const body = rows.map(r => {
    const cells = columns.map(c => {
      let val;
      if (c.render) val = c.render(r[c.key], r, ctx);
      else if (c.type === "bool") val = boolBadge(r[c.key]);
      else if (c.type === "money") val = fmtMoney(r[c.key]);
      else if (c.type === "num") val = fmtNum(r[c.key]);
      else if (c.type === "date") val = fmtDate(r[c.key]);
      else if (c.type === "datetime") val = fmtDateTime(r[c.key]);
      else if (c.type === "badge") val = badge(c.map ? (c.map[r[c.key]] || TITLECASE(r[c.key])) : TITLECASE(r[c.key]), c.cls || "blue");
      else val = esc(r[c.key] ?? "—");
      return `<td class="${c.align === "right" || c.type === "money" || c.type === "num" ? "num" : ""} ${c.mono ? "mono" : ""} ${c.trunc ? "trunc" : ""}${prio(c)}">${val}</td>`;
    }).join("");
    const acts = rowActions ? `<td class="actions">${rowActions(r)}</td>` : "";
    const cls = ("is_active" in r && !r.is_active) ? "inactive" : "";
    return `<tr class="${cls}">${cells}${acts}</tr>`;
  }).join("");
  return `<div class="card tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
