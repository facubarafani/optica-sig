<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SGI Óptica — Gestión</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --border:#e3e8ef; --text:#1f2937; --muted:#6b7280;
    --primary:#2563eb; --primary-600:#1d4ed8; --primary-50:#eff6ff;
    --danger:#dc2626; --danger-50:#fef2f2; --ok:#16a34a; --ok-50:#f0fdf4; --warn:#d97706; --warn-50:#fffbeb;
    --radius:10px; --radius-sm:7px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 12px 32px rgba(16,24,40,.18); --sidebar:228px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  a{color:var(--primary);text-decoration:none}
  h1,h2,h3{margin:0;font-weight:650}
  /* ---------- login ---------- */
  .login-wrap{min-height:100%;display:grid;place-items:center;padding:24px}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:360px;max-width:100%;padding:28px}
  .login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .login-card .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
  .login-card h1{font-size:19px}
  .login-card p.sub{color:var(--muted);margin:2px 0 20px;font-size:13px}
  .hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
  /* ---------- app shell ---------- */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100%}
  .sidebar{background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
  .sidebar .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
  .sidebar .brand b{color:#fff;font-size:15px}
  .sidebar .brand small{display:block;color:#7c8aa5;font-size:11px}
  .nav{padding:6px;overflow:auto;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#cbd5e1;font-weight:500;margin:1px 0}
  .nav a .ic{width:18px;height:18px;opacity:.9}
  .nav a:hover{background:#1e293b;color:#fff}
  .nav a.active{background:var(--primary);color:#fff}
  .sidebar .foot{padding:12px;border-top:1px solid #1e293b;font-size:12px;color:#94a3b8}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}
  .topbar .crumb{font-weight:650;font-size:15px}
  .topbar .who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .topbar .who .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700}
  /* No global width cap: the data grids need the whole window. Reading-width
     layouts (Empresa, ficha de cliente) are capped individually below. */
  .content{padding:22px;width:100%;min-width:0}
  .menu-btn{display:none;background:none;border:0;font-size:20px;cursor:pointer}
  /* ---------- generic ---------- */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card.pad{padding:18px}
  .card.error{padding:16px;color:var(--danger);background:var(--danger-50);border-color:#fecaca}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h2{font-size:20px}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar .grow{flex:1}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  /* buttons */
  .btn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
  .btn:hover{background:#f8fafc}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-600)}
  .btn.danger{background:#fff;border-color:#fecaca;color:var(--danger)}
  .btn.danger:hover{background:var(--danger-50)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
  /* ---------- icons (embedded Lucide sprite) ---------- */
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  .ic.lg{width:18px;height:18px}
  .btn .ic{margin-right:-1px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:#f1f5f9}
  /* inputs */
  label.fld{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px}
  label.fld .req{color:var(--danger)}
  input,select,textarea{width:100%;font:inherit;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
  textarea{resize:vertical;min-height:64px}
  input[type=checkbox]{width:auto}
  .inp-sm{padding:6px 9px;font-size:13px}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#374151;font-weight:500;cursor:pointer;user-select:none}
  /* table */
  .tbl-wrap{overflow:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}
  thead th{text-align:left;padding:10px 10px;background:#f8fafc;color:#64748b;font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  /* Long free text must not push the grid into a horizontal scroll. The full
     value stays available in the cell's title tooltip. */
  td.trunc{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Secondary columns drop out as the window narrows, so a wide grid degrades
     by showing less rather than by scrolling sideways. Mark them with
     `priority: 2 | 3` in the column definition — 3 disappears first. */
  @media(max-width:1460px){ .col-p3{display:none} }
  @media(max-width:1250px){ .col-p2{display:none} }
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fbfdff}
  tr.inactive{opacity:.5}
  td.actions{text-align:right;white-space:nowrap}
  td.actions .btn{margin-left:4px}
  /* Icon-only buttons for secondary row actions — they carry a title tooltip.
     Five text buttons per row cost ~390px, a quarter of the product grid. */
  .btn.ico{padding:5px 7px;line-height:1;min-width:28px;justify-content:center}
  /* row overflow menu */
  .rowmenu{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;min-width:190px;animation:pop .12s ease}
  .rowmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
    padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);
    cursor:pointer;text-align:left}
  .rowmenu button:hover{background:var(--primary-50);color:var(--primary-600)}
  .rowmenu button.danger{color:var(--danger)}
  .rowmenu button.danger:hover{background:var(--danger-50)}
  .rowmenu .sep{height:1px;background:var(--border);margin:5px 2px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono);font-size:12.5px}
  /* badges */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.5}
  .badge.green{background:var(--ok-50);color:var(--ok)}
  .badge.gray{background:#f1f5f9;color:#64748b}
  .badge.blue{background:var(--primary-50);color:var(--primary)}
  .badge.amber{background:var(--warn-50);color:var(--warn)}
  .badge.red{background:var(--danger-50);color:var(--danger)}
  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .stat .v{font-size:28px;font-weight:750;margin-top:8px}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:500}
  /* Two-column reading layouts stay narrow — stretching a form to 1900px is
     unreadable. Data tables are deliberately not capped. */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1180px}
  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;font-size:13.5px}
  .tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .12s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:480px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;animation:pop .14s ease}
  .modal.wide{width:680px}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal header h3{font-size:16px}
  .modal .body{padding:20px;overflow:auto}
  .modal footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
  /* form */
  form.form .form-row{margin-bottom:14px}
  form.form.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  form.form.grid2 .form-row{margin-bottom:0}
  form.form.grid2 .form-row.full{grid-column:1/-1}
  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px}
  .checklist label{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
  .fhelp{font-size:11.5px;color:var(--muted);margin-top:4px}
  .fwarn{font-size:11.5px;color:var(--warn);background:var(--warn-50);border:1px solid #fde68a;border-radius:6px;padding:5px 8px;margin-top:5px}
  /* ---------- import wizard ---------- */
  .wizard .steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .wizard .steps span{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:5px 12px}
  .wizard .steps span.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .wizard .steps span.done{background:var(--ok-50);border-color:#bbf7d0;color:var(--ok)}
  .wizard table{margin-bottom:12px}
  .wizard input[type=file]{display:block;width:100%;padding:10px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:var(--bg);font-size:13px}
  .wizard .stats{margin-bottom:16px}
  .errlist{max-height:220px;overflow:auto;font-size:12.5px;font-family:var(--mono);background:var(--danger-50);border:1px solid #fecaca;border-radius:var(--radius-sm);padding:10px;margin-top:8px}
  .errlist div{padding:2px 0}
  .req{color:var(--danger)}
  .radios{display:flex;gap:16px;flex-wrap:wrap;padding:2px 0}
  .radios label{display:flex;align-items:center;gap:7px;font-weight:500;font-size:13px;
    cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .pricehint{font-size:12px;color:var(--muted);margin-top:5px}
  .pricehint b{color:var(--ok);font-size:14px}
  .with-add{display:flex;gap:6px;align-items:stretch}
  .with-add select{flex:1;min-width:0}
  .with-add .add{flex:0 0 auto;font-weight:700;line-height:1}
  /* toast */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:80}
  .toast{background:#0f172a;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;animation:slide .16s ease}
  .toast.err{background:var(--danger)}
  .toast.ok{background:var(--ok)}
  @keyframes slide{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13.5px}
  .kv dt{color:var(--muted);font-weight:600}
  .kv dd{margin:0}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .2s}
    .sidebar.open{transform:none}
    .menu-btn{display:block}
    .grid2{grid-template-columns:1fr}
    form.form.grid2{grid-template-columns:1fr}
  }
</style>
</head>

<div id="root"></div>
<div id="toasts"></div>

<script>
"use strict";
/* =========================================================================
   SGI Óptica — consola de gestión en un solo archivo (vanilla JS).
   FastAPI la sirve en el mismo origen en /app, así que llama a /api/... directo.
   Convención: el código, los paths y los VALORES de enum quedan en inglés;
   sólo se traduce lo que ve el usuario.
   ========================================================================= */

const TOKEN_KEY = "sgi_token";
const state = { token: null, user: null, perms: new Set(), company: null, currency: "ARS" };
const root = document.getElementById("root");

/* Etiquetas en español para los valores de enum (los valores enviados a la API
   siguen en inglés). */
const ENUM_ES = {
  supplier_type: { merchandise: "Mercadería", laboratory: "Laboratorio", workshop: "Taller" },
  movement_type: { inbound: "Ingreso", outbound: "Egreso", adjustment: "Ajuste", transfer: "Transferencia" },
  treatment_type: { myopia: "Miopía", astigmatism: "Astigmatismo", hyperopia: "Hipermetropía", presbyopia: "Presbicia", other: "Otro" },
};

/* ----------------------------- tiny helpers ----------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => (v == null ? "" : String(v).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])));
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

function toast(msg, type = "") {
  const t = el(`<div class="toast ${type}">${esc(msg)}</div>`);
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 300); }, type === "err" ? 5200 : 3000);
}

function fmtMoney(v) {
  if (v == null || v === "") return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return esc(v);
  try { return new Intl.NumberFormat("es-AR", { style:"currency", currency: state.currency || "ARS", maximumFractionDigits:2 }).format(n); }
  catch { return n.toFixed(2); }
}
const fmtNum  = (v) => (v == null || v === "" ? "—" : String(Number(v)));
const fmtDate = (v) => (v ? new Date(v).toLocaleDateString("es-AR") : "—");
const fmtDateTime = (v) => (v ? new Date(v).toLocaleString("es-AR", { dateStyle:"short", timeStyle:"short" }) : "—");
function badge(text, cls) { return `<span class="badge ${cls}">${esc(text)}</span>`; }
const boolBadge = (v) => v ? badge("Activo","green") : badge("Inactivo","gray");

const TITLECASE = (s) => String(s||"").replace(/_/g," ").replace(/\b\w/g, c => c.toUpperCase());

/* ----------------------------- API client ------------------------------ */
function errMsg(data, status) {
  if (data == null) return `HTTP ${status}`;
  if (typeof data === "string") return data;
  const d = data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(e => `${(e.loc || []).slice(1).join(".") || "campo"}: ${e.msg}`).join("; ");
  return JSON.stringify(data);
}

async function api(method, path, body) {
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const opts = { method, headers };
  if (body !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (res.status === 401) { logout(); throw new Error("La sesión expiró. Iniciá sesión de nuevo."); }
  if (res.status === 204) return null;
  const txt = await res.text();
  let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch { data = txt; } }
  if (!res.ok) throw new Error(errMsg(data, res.status));
  return data;
}

/* multipart upload — Content-Type is left unset on purpose so the browser
   adds the multipart boundary itself */
async function apiUpload(path, file) {
  const fd = new FormData();
  fd.append("file", file);
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(path, { method: "POST", headers, body: fd });
  if (res.status === 401) { logout(); throw new Error("La sesión expiró. Iniciá sesión de nuevo."); }
  const txt = await res.text();
  let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch { data = txt; } }
  if (!res.ok) throw new Error(errMsg(data, res.status));
  return data;
}

/* download a binary response (the .xlsx template) */
async function apiDownload(path, filename) {
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(path, { headers });
  if (!res.ok) { toast("No se pudo descargar la plantilla", "err"); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* options cache (for dropdowns referencing other entities) */
const _optCache = new Map();
function clearOptions() { _optCache.clear(); }
async function options({ endpoint, value = "id", label = "name", labelFn }) {
  if (!_optCache.has(endpoint)) _optCache.set(endpoint, api("GET", endpoint).catch(() => []));
  const rows = await _optCache.get(endpoint);
  return (rows || []).map(r => ({ value: r[value], label: labelFn ? labelFn(r) : r[label] }));
}
async function idMap(endpoint, label = "name", labelFn) {
  const rows = await (_optCache.has(endpoint) ? _optCache.get(endpoint) : (_optCache.set(endpoint, api("GET", endpoint).catch(() => [])), _optCache.get(endpoint)));
  const m = {};
  for (const r of (rows || [])) m[r.id] = labelFn ? labelFn(r) : r[label];
  return m;
}

/* ----------------------------- auth flow ------------------------------- */
function buildPerms(user) {
  const set = new Set();
  if (user.is_superuser) set.add("*");
  for (const role of (user.roles || [])) for (const p of (role.permissions || [])) set.add(p.code);
  return set;
}
const can = (code) => state.perms.has("*") || state.perms.has(code);

async function loadSession() {
  state.user = await api("GET", "/api/auth/me");
  state.perms = buildPerms(state.user);
  if (can("company:read")) {
    try { state.company = await api("GET", "/api/company"); state.currency = state.company.currency || "ARS"; } catch {}
  }
}

function logout() {
  state.token = null; state.user = null; state.perms = new Set(); state.company = null;
  localStorage.removeItem(TOKEN_KEY);
  clearOptions();
  renderLogin();
}

/* ----------------------------- login view ------------------------------ */
function renderLogin(prefill = true) {
  root.innerHTML = `
    <div class="login-wrap">
      <form class="login-card" id="loginForm">
        <div class="brand"><div class="logo">S</div><div><h1>SGI Óptica</h1></div></div>
        <p class="sub">Ingresá al sistema de gestión</p>
        <div class="form-row">
          <label class="fld">Email</label>
          <input name="email" type="email" autocomplete="username" required value="${prefill ? "admin@sgi.com" : ""}">
        </div>
        <div class="form-row">
          <label class="fld">Contraseña</label>
          <input name="password" type="password" autocomplete="current-password" required value="${prefill ? "admin1234" : ""}">
        </div>
        <button class="btn primary" type="submit" style="width:100%;justify-content:center;margin-top:6px">Ingresar</button>
        <div class="hint">El usuario demo está precargado. Requiere la API y la base con datos.</div>
      </form>
    </div>`;
  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#loginForm button"); btn.disabled = true; btn.textContent = "Ingresando…";
    const email = $("[name=email]").value.trim();
    const password = $("[name=password]").value;
    try {
      const res = await fetch("/api/auth/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email, password }) });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(errMsg(data, res.status));
      state.token = data.access_token;
      localStorage.setItem(TOKEN_KEY, state.token);
      await loadSession();
      renderApp();
    } catch (err) {
      toast(err.message || "Error al iniciar sesión", "err");
      btn.disabled = false; btn.textContent = "Ingresar";
    }
  });
}

/* ----------------------------- app shell ------------------------------- */
const NAV = [
  { route:"dashboard", label:"Inicio",          icon:"i-dashboard", perm:null },
  { route:"products",  label:"Productos",        icon:"i-package", perm:"products:read" },
  { route:"catalog",   label:"Catálogo",         icon:"i-tags", perm:"products:read" },
  { route:"pricing",   label:"Precios",          icon:"i-banknote", perm:"pricing:read" },
  { route:"stock",     label:"Stock",            icon:"i-layers", perm:"stock:read" },
  { route:"customers", label:"Clientes",         icon:"i-users", perm:"customers:read" },
  { route:"suppliers", label:"Proveedores",      icon:"i-truck", perm:"suppliers:read" },
  { route:"branches",  label:"Sucursales",       icon:"i-store", perm:"branches:read" },
  { route:"users",     label:"Usuarios y Roles", icon:"i-shield", perm:"users:read" },
  { route:"company",   label:"Empresa",          icon:"i-settings", perm:"company:read" },
];

function renderApp() {
  const u = state.user;
  const initials = (u.full_name || u.email || "?").split(" ").map(s => s[0]).slice(0,2).join("").toUpperCase();
  const navHtml = NAV.filter(n => !n.perm || can(n.perm))
    .map(n => `<a href="#/${n.route}" data-route="${n.route}"><svg class="ic lg"><use href="#${n.icon}"/></svg>${n.label}</a>`).join("");
  root.innerHTML = `
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><div class="logo">S</div><div><b>SGI Óptica</b><small>${esc(state.company?.name || "Panel de gestión")}</small></div></div>
        <nav class="nav">${navHtml}</nav>
        <div class="foot">v0.1 · datos maestros</div>
      </aside>
      <div class="main">
        <div class="topbar">
          <div style="display:flex;align-items:center;gap:10px">
            <button class="menu-btn" id="menuBtn"><svg class="ic lg"><use href="#i-menu"/></svg></button>
            <span class="crumb" id="crumb">Inicio</span>
          </div>
          <div class="who">
            <span>${esc(u.full_name || u.email)} ${u.is_superuser ? badge("admin","blue") : ""}</span>
            <span class="avatar">${esc(initials)}</span>
            <button class="btn sm ghost" id="logoutBtn"><svg class="ic"><use href="#i-logout"/></svg>Salir</button>
          </div>
        </div>
        <div class="content"><div id="view"></div></div>
      </div>
    </div>`;
  $("#logoutBtn").addEventListener("click", logout);
  $("#menuBtn").addEventListener("click", () => $("#sidebar").classList.toggle("open"));
  $$("#sidebar .nav a").forEach(a => a.addEventListener("click", () => $("#sidebar").classList.remove("open")));
  window.addEventListener("hashchange", route);
  route();
}

function highlightNav(section) {
  $$("#sidebar .nav a").forEach(a => a.classList.toggle("active", a.dataset.route === section));
  const n = NAV.find(x => x.route === section);
  const crumb = $("#crumb"); if (crumb) crumb.textContent = n ? n.label : "—";
}

async function route() {
  if (!state.user) return;
  const hash = location.hash.slice(1) || "/dashboard";
  const [section, arg] = hash.split("/").filter(Boolean);
  const sec = section || "dashboard";
  highlightNav(sec);
  const view = $("#view");
  view.innerHTML = `<div class="loading">Cargando…</div>`;
  const nav = NAV.find(n => n.route === sec);
  if (nav && nav.perm && !can(nav.perm)) { view.innerHTML = `<div class="card error">No tenés permiso para ver esta sección.</div>`; return; }
  try {
    switch (sec) {
      case "dashboard": await dashboardView(view); break;
      case "products":  await productsView(view); break;
      case "catalog":   await catalogView(view); break;
      case "pricing":   await pricingView(view); break;
      case "stock":     await stockView(view); break;
      case "customers": arg ? await customerDetailView(view, arg) : await customersView(view); break;
      case "suppliers": await resourceView(view, CONFIG.suppliers); break;
      case "branches":  await resourceView(view, CONFIG.branches); break;
      case "users":     await usersView(view); break;
      case "company":   await companyView(view); break;
      default: view.innerHTML = `<div class="card pad">Sección no encontrada.</div>`;
    }
  } catch (e) {
    view.innerHTML = `<div class="card error">${esc(e.message)}</div>`;
    toast(e.message, "err");
  }
}

/* ------------------------------- modal --------------------------------- */
function openModal({ title, body, onConfirm, confirmLabel = "Guardar", wide = false }) {
  const overlay = el(`<div class="overlay"><div class="modal ${wide ? "wide" : ""}">
      <header><h3>${esc(title)}</h3><button class="x" type="button"><svg class="ic"><use href="#i-x"/></svg></button></header>
      <div class="body"></div>
      <footer></footer></div></div>`);
  // Only the topmost modal reacts to Escape, so closing a nested quick-create
  // form does not also close the form that opened it.
  const onKeydown = (e) => { if (e.key === "Escape" && overlay === document.body.lastElementChild) close(); };
  const close = () => { document.removeEventListener("keydown", onKeydown); overlay.remove(); };
  overlay.querySelector(".body").appendChild(body);
  const foot = overlay.querySelector("footer");
  const cancel = el(`<button class="btn" type="button">${onConfirm ? "Cancelar" : "Cerrar"}</button>`);
  cancel.addEventListener("click", close); foot.appendChild(cancel);
  if (onConfirm) {
    const ok = el(`<button class="btn primary" type="button">${esc(confirmLabel)}</button>`);
    ok.addEventListener("click", async () => { ok.disabled = true; try { await onConfirm(close); } finally { ok.disabled = false; } });
    foot.appendChild(ok);
  }
  overlay.querySelector(".x").addEventListener("click", close);
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", onKeydown);
  document.body.appendChild(overlay);
  return close;
}

/* ------------------------- generic form builder ------------------------ */
async function buildForm(fields, values = {}, grid = false) {
  // resolve dynamic option sources
  for (const f of fields) {
    if (f.optionsFrom) f._opts = await options(f.optionsFrom);
    else if (f.options) f._opts = f.options;
  }
  const form = el(`<form class="form ${grid ? "grid2" : ""}"></form>`);
  form.addEventListener("submit", e => e.preventDefault());
  for (const f of fields) {
    const v = values[f.key];
    const row = el(`<div class="form-row ${f.full ? "full" : ""}"></div>`);
    const reqMark = f.required ? ` <span class="req">*</span>` : "";
    if (f.type === "checkbox") {
      row.innerHTML = `<label class="switch"><input type="checkbox" name="${f.key}" ${v ? "checked" : ""}> ${esc(f.label)}</label>`;
    } else if (f.type === "multiselect") {
      const sel = new Set((v || []).map(String));
      const boxes = (f._opts || []).map(o => `<label><input type="checkbox" name="${f.key}" value="${esc(o.value)}" ${sel.has(String(o.value)) ? "checked" : ""}> ${esc(o.label)}</label>`).join("");
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label><div class="checklist">${boxes || '<span class="fhelp">ninguno</span>'}</div>`;
    } else if (f.type === "select") {
      const allowEmpty = f.required ? "" : `<option value="">— ninguno —</option>`;
      const opts = (f._opts || []).map(o => `<option value="${esc(o.value)}" ${String(v) === String(o.value) ? "selected" : ""}>${esc(o.label)}</option>`).join("");
      const sel = `<select name="${f.key}">${allowEmpty}${opts}</select>`;
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label>` + (f.quickCreate
        ? `<div class="with-add">${sel}<button type="button" class="btn sm add" title="Crear">+</button></div>`
        : sel);
      if (f.quickCreate) {
        row.querySelector("button.add").addEventListener(
          "click", () => quickCreate(f.quickCreate, row.querySelector("select")));
      }
    } else if (f.type === "radio") {
      const opts = (f._opts || []).map(o =>
        `<label><input type="radio" name="${f.key}" value="${esc(o.value)}" ${String(v ?? f.default) === String(o.value) ? "checked" : ""}> ${esc(o.label)}</label>`).join("");
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label><div class="radios">${opts}</div>`;
    } else if (f.type === "textarea") {
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label><textarea name="${f.key}" placeholder="${esc(f.placeholder||"")}">${esc(v ?? "")}</textarea>`;
    } else {
      const type = f.type === "decimal" || f.type === "int" ? "number" : (f.type || "text");
      const step = f.step != null ? `step="${f.step}"` : (f.type === "decimal" ? `step="0.01"` : (f.type === "int" ? `step="1"` : ""));
      const extra = [f.min!=null?`min="${f.min}"`:"", f.max!=null?`max="${f.max}"`:""].join(" ");
      row.innerHTML = `<label class="fld">${esc(f.label)}${reqMark}</label><input type="${type}" name="${f.key}" ${step} ${extra} placeholder="${esc(f.placeholder||"")}" value="${v != null ? esc(v) : ""}">`;
    }
    if (f.help) row.appendChild(el(`<div class="fhelp">${esc(f.help)}</div>`));
    f._row = row;
    form.appendChild(row);
  }

  // Fields with `showIf` appear only when the predicate holds for the current
  // values (e.g. "Precio" only in manual pricing mode). Hidden fields are
  // skipped by read() and by validate(), so they cannot block a save.
  const conditional = fields.filter(f => f.showIf);
  const applyVisibility = () => {
    if (!conditional.length) return;
    const current = form.read({ all: true });
    for (const f of conditional) {
      f._hidden = !f.showIf(current);
      f._row.style.display = f._hidden ? "none" : "";
    }
  };
  if (conditional.length) form.addEventListener("change", applyVisibility);

  form.read = ({ all = false } = {}) => {
    const out = {};
    for (const f of fields) {
      if (!all && f._hidden) continue;
      if (f.type === "checkbox") { out[f.key] = form.querySelector(`[name="${f.key}"]`).checked; continue; }
      if (f.type === "multiselect") { out[f.key] = $$(`[name="${f.key}"]:checked`, form).map(i => Number(i.value)); continue; }
      if (f.type === "radio") { const c = form.querySelector(`[name="${f.key}"]:checked`); out[f.key] = c ? c.value : null; continue; }
      const elx = form.querySelector(`[name="${f.key}"]`);
      let raw = elx ? elx.value : "";
      if (raw === "" || raw == null) {
        // Campos numéricos: si quedan vacíos, se omiten para que aplique el
        // default / opcional del servidor (ej. ProductCreate.current_cost y
        // min_stock son Decimal no nulos con default).
        if (f.type === "decimal" || f.type === "int") continue;
        out[f.key] = null; continue;   // texto / FK opcionales → null explícito
      }
      if (f.type === "int" || f.valueType === "int") out[f.key] = parseInt(raw, 10);
      else if (f.type === "decimal") out[f.key] = raw;            // string → Decimal de Pydantic
      else out[f.key] = raw;
    }
    return out;
  };
  applyVisibility();   // needs form.read, so it runs after the assignment above
  return form;
}

function validate(fields, payload) {
  for (const f of fields) {
    if (!f.required || f._hidden) continue;
    const v = payload[f.key];
    if (v == null || v === "" || (Array.isArray(v) && v.length === 0)) return `Falta completar "${f.label}".`;
  }
  return null;
}

/* Replace a select's options in place, keeping the current value when it is
   still available. Used by the dependent selects of the product form. */
function setSelectOptions(selectEl, opts, { required = false } = {}) {
  const current = selectEl.value;
  const allowEmpty = required ? "" : `<option value="">— ninguno —</option>`;
  selectEl.innerHTML = allowEmpty + opts
    .map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("");
  if (current && opts.some(o => String(o.value) === current)) selectEl.value = current;
}

/* "+" beside a select: create the referenced entity without losing the form
   you were filling in. `key` is a CONFIG entry (e.g. "brands"). */
async function quickCreate(key, selectEl) {
  const cfg = CONFIG[key];
  if (!cfg) return;
  await formModal({
    title: cfg.newTitle,
    fields: typeof cfg.fields === "function" ? cfg.fields("create") : cfg.fields,
    grid: cfg.grid,
    onSubmit: async (payload) => {
      const created = await api("POST", cfg.endpoint, payload);
      clearOptions();
      selectEl.appendChild(el(`<option value="${esc(created.id)}">${esc(created.name)}</option>`));
      selectEl.value = String(created.id);
      selectEl.dispatchEvent(new Event("change", { bubbles: true }));
      toast("Creado", "ok");
    },
  });
}

/* open a create/edit form modal backed by buildForm */
async function formModal({ title, fields, values = {}, confirmLabel = "Guardar", grid = false, onSubmit, onReady }) {
  const form = await buildForm(fields, values, grid);
  if (onReady) await onReady(form);
  openModal({ title, body: form, confirmLabel, wide: grid, onConfirm: async (close) => {
    const payload = form.read();
    const err = validate(fields, payload);
    if (err) return toast(err, "err");
    await onSubmit(payload);
    close();
  }});
}

/* Overflow menu for secondary row actions. Keeps the grid narrow without
   hiding anything: every action stays reachable, just one click deeper. */
function openRowMenu(anchor, items) {
  const existing = document.querySelector(".rowmenu");
  if (existing) existing.remove();
  const menu = el(`<div class="rowmenu"></div>`);
  for (const it of items) {
    if (!it) continue;
    if (it.sep) { menu.appendChild(el(`<div class="sep"></div>`)); continue; }
    const b = el(`<button type="button" class="${it.danger ? "danger" : ""}">
      <svg class="ic"><use href="#${it.icon}"/></svg>${esc(it.label)}</button>`);
    b.addEventListener("click", () => { close(); it.onClick(); });
    menu.appendChild(b);
  }
  document.body.appendChild(menu);

  // Anchor below-right of the trigger, flipping up / clamping when it would
  // fall outside the viewport.
  const r = anchor.getBoundingClientRect();
  const below = r.bottom + 6;
  const flip = below + menu.offsetHeight > window.innerHeight - 8;
  menu.style.top = ((flip ? r.top - menu.offsetHeight - 6 : below) + window.scrollY) + "px";
  menu.style.left = (Math.max(8, Math.min(
    r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 8)) + window.scrollX) + "px";

  const onOut = (e) => { if (!menu.contains(e.target)) close(); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  const close = () => {
    menu.remove();
    document.removeEventListener("mousedown", onOut, true);
    document.removeEventListener("keydown", onKey, true);
    window.removeEventListener("scroll", close, true);
  };
  setTimeout(() => {
    document.addEventListener("mousedown", onOut, true);
    document.addEventListener("keydown", onKey, true);
    window.addEventListener("scroll", close, true);
  }, 0);
  return close;
}

function confirmDanger({ title, message, confirmLabel = "Eliminar", onConfirm }) {
  openModal({ title, confirmLabel, body: el(`<div>${esc(message)}</div>`), onConfirm: async (close) => { await onConfirm(); close(); } });
}

/* ------------------------------- table --------------------------------- */
function renderTable(columns, rows, rowActions, ctx) {
  if (!rows || !rows.length) return `<div class="card"><div class="empty">Sin registros.</div></div>`;
  const prio = (c) => c.priority ? ` col-p${c.priority}` : "";
  const head = columns.map(c => `<th class="${c.align === "right" ? "num" : ""}${prio(c)}">${esc(c.label)}</th>`).join("") + (rowActions ? "<th></th>" : "");
  const body = rows.map(r => {
    const cells = columns.map(c => {
      let val;
      if (c.render) val = c.render(r[c.key], r, ctx);
      else if (c.type === "bool") val = boolBadge(r[c.key]);
      else if (c.type === "money") val = fmtMoney(r[c.key]);
      else if (c.type === "num") val = fmtNum(r[c.key]);
      else if (c.type === "date") val = fmtDate(r[c.key]);
      else if (c.type === "datetime") val = fmtDateTime(r[c.key]);
      else if (c.type === "badge") val = badge(c.map ? (c.map[r[c.key]] || TITLECASE(r[c.key])) : TITLECASE(r[c.key]), c.cls || "blue");
      else val = esc(r[c.key] ?? "—");
      return `<td class="${c.align === "right" || c.type === "money" || c.type === "num" ? "num" : ""} ${c.mono ? "mono" : ""} ${c.trunc ? "trunc" : ""}${prio(c)}">${val}</td>`;
    }).join("");
    const acts = rowActions ? `<td class="actions">${rowActions(r)}</td>` : "";
    const cls = ("is_active" in r && !r.is_active) ? "inactive" : "";
    return `<tr class="${cls}">${cells}${acts}</tr>`;
  }).join("");
  return `<div class="card tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

async function resourceView(container, cfg, opts = {}) {
  const writable = can(cfg.perm + ":write");
  let showInactive = !!opts.showInactive;
  // Optional id→name maps for columns that render a FK (see cfg.maps).
  const maps = {};
  for (const [name, endpoint] of Object.entries(cfg.maps || {})) {
    maps[name] = await idMap(endpoint);
  }
  async function load() {
    const list = await api("GET", cfg.endpoint + (showInactive ? "?include_inactive=true" : ""));
    paint(list);
  }
  const editFields = (mode, row) => {
    let f = cfg.fields.slice();
    if (typeof cfg.fields === "function") f = cfg.fields(mode, row);
    if (mode === "edit" && cfg.softDelete) f = f.concat([{ key:"is_active", label:"Activo", type:"checkbox" }]);
    return f;
  };
  async function openForm(mode, row) {
    const fields = editFields(mode, row);
    // Some entities carry data that lives in its own endpoint (e.g. a
    // supplier's brands, an N-N relation). cfg.loadExtra/saveExtra handle it.
    let values = row || {};
    if (mode === "edit" && cfg.loadExtra) values = { ...values, ...(await cfg.loadExtra(row)) };
    formModal({
      title: mode === "edit" ? cfg.editTitle : cfg.newTitle,
      fields, values, grid: cfg.grid,
      onSubmit: async (payload) => {
        const extra = {};
        for (const k of (cfg.extraKeys || [])) { extra[k] = payload[k]; delete payload[k]; }
        const saved = mode === "edit"
          ? await api("PUT", cfg.endpoint + "/" + row.id, payload)
          : await api("POST", cfg.endpoint, payload);
        if (cfg.saveExtra) await cfg.saveExtra(saved.id, extra);
        clearOptions(); toast("Guardado", "ok"); await load();
      },
    });
  }
  function actions(r) {
    if (!writable) return "";
    let h = `<button class="btn sm" data-act="edit" data-id="${r.id}"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>`;
    if (cfg.softDelete && !r.is_active) h += `<button class="btn sm" data-act="restore" data-id="${r.id}"><svg class="ic"><use href="#i-rotate"/></svg>Restaurar</button>`;
    else h += `<button class="btn sm danger" data-act="del" data-id="${r.id}"><svg class="ic"><use href="#i-ban"/></svg>Desactivar</button>`;
    return h;
  }
  function paint(list) {
    container.innerHTML = `
      <div class="page-head">
        <div><h2>${esc(cfg.title)}</h2><div class="sub">${list.length} registro(s)</div></div>
        <div class="toolbar" style="margin:0">
          ${cfg.softDelete ? `<label class="switch"><input type="checkbox" id="inact" ${showInactive ? "checked" : ""}> Ver inactivos</label>` : ""}
          ${writable ? `<button class="btn primary" id="newBtn"><svg class="ic"><use href="#i-plus"/></svg>Nuevo</button>` : ""}
        </div>
      </div>
      ${renderTable(cfg.columns, list, writable ? actions : null, maps)}`;
    const nb = $("#newBtn", container); if (nb) nb.addEventListener("click", () => openForm("create"));
    const ic = $("#inact", container); if (ic) ic.addEventListener("change", () => { showInactive = ic.checked; load(); });
    $$("[data-act]", container).forEach(b => b.addEventListener("click", async () => {
      const id = b.dataset.id, row = list.find(x => String(x.id) === id);
      if (b.dataset.act === "edit") openForm("edit", row);
      else if (b.dataset.act === "restore") { await api("PUT", cfg.endpoint + "/" + id, { is_active:true }); clearOptions(); toast("Restaurado", "ok"); load(); }
      else confirmDanger({ title:"Desactivar", message:`¿Desactivar "${row.name || row.code || id}"? Se ocultará pero no se elimina.`, confirmLabel:"Desactivar",
        onConfirm: async () => { await api("DELETE", cfg.endpoint + "/" + id); clearOptions(); toast("Desactivado", "ok"); load(); } });
    }));
  }
  await load();
}

/* ------------------------------ tabs ----------------------------------- */
function renderTabs(container, head, tabs) {
  container.innerHTML = `<div class="page-head"><div><h2>${esc(head)}</h2></div></div>
    <div class="tabs">${tabs.map((t,i) => `<button data-i="${i}" class="${i===0?"active":""}">${esc(t.label)}</button>`).join("")}</div>
    <div id="tabbody"></div>`;
  const body = $("#tabbody", container);
  const show = (i) => { $$(".tabs button", container).forEach(b => b.classList.toggle("active", Number(b.dataset.i) === i)); body.innerHTML = ""; tabs[i].render(body); };
  $$(".tabs button", container).forEach(b => b.addEventListener("click", () => show(Number(b.dataset.i))));
  show(0);
}

/* ------------------------------ export --------------------------------- */
/* Exports use the *import* column layout, so a file can be exported, edited in
   Excel and uploaded again. Formats mirror what the importer accepts. */
const EXPORT_FORMATS = [
  { fmt:"xlsx", label:"Excel (.xlsx)", icon:"i-sheet" },
  { fmt:"csv",  label:"CSV",           icon:"i-download" },
];

function downloadExport(spec, fmt, params = {}) {
  const qs = new URLSearchParams({ format: fmt });
  for (const [k, v] of Object.entries(params)) if (v) qs.set(k, v);
  apiDownload(`/api/imports/${spec}/export?${qs}`, `${spec}.${fmt}`);
}

/* `specs`: [{key, label}] — one group of formats per spec. */
function openExportMenu(anchor, specs, params = {}) {
  const items = [];
  specs.forEach((s, i) => {
    if (i) items.push({ sep:true });
    for (const f of EXPORT_FORMATS) {
      items.push({
        icon: f.icon,
        label: specs.length > 1 ? `${s.label} · ${f.label}` : f.label,
        onClick: () => downloadExport(s.key, f.fmt, params),
      });
    }
  });
  openRowMenu(anchor, items);
}

/* =======================================================================
   IMPORT WIZARD  (subir → mapear → previsualizar → confirmar)
   One component for every import target; the columns come from
   /api/imports/specs, so adding a target on the backend needs no UI change.
   ======================================================================= */
let _specsCache = null;
async function importSpecs() {
  if (!_specsCache) _specsCache = await api("GET", "/api/imports/specs").catch(() => []);
  return _specsCache;
}

async function canImport(specKey) {
  return (await importSpecs()).some(s => s.key === specKey);
}

async function openImportWizard(specKey, onDone) {
  const spec = (await importSpecs()).find(s => s.key === specKey);
  if (!spec) return toast("No tenés permisos para esta importación", "err");

  const body = el(`<div class="wizard"></div>`);
  const close = openModal({ title: `Importar — ${spec.label}`, body, wide: true });
  step1();

  function head(n) {
    return `<div class="steps">${[["1","Archivo"],["2","Columnas"],["3","Revisión"]]
      .map(([i,l]) => `<span class="${Number(i)===n?"on":(Number(i)<n?"done":"")}">${i}. ${l}</span>`)
      .join("")}</div>`;
  }

  /* ---- 1. plantilla + archivo ---- */
  function step1() {
    body.innerHTML = `${head(1)}
      <p class="sub">${esc(spec.description)}</p>
      <div class="card pad" style="margin-bottom:14px">
        <b>¿No tenés el archivo armado?</b>
        <div class="fhelp" style="margin:4px 0 10px">Descargá la plantilla con las columnas correctas y una hoja "Referencia" con los valores válidos ya cargados.</div>
        <button class="btn" id="tpl"><svg class="ic"><use href="#i-sheet"/></svg>Descargar plantilla .xlsx</button>
      </div>
      <div class="card pad">
        <b>Subí tu archivo</b>
        <div class="fhelp" style="margin:4px 0 10px">.xlsx o .csv. Si el proveedor te manda PDF, convertilo a Excel primero. Máx. 5.000 filas.</div>
        <input type="file" id="file" accept=".xlsx,.xlsm,.csv,.txt">
      </div>
      <div id="err"></div>`;
    $("#tpl", body).addEventListener("click", () =>
      apiDownload(`/api/imports/${spec.key}/template`, `plantilla-${spec.key}.xlsx`));
    $("#file", body).addEventListener("change", async (e) => {
      const f = e.target.files[0]; if (!f) return;
      $("#err", body).innerHTML = `<div class="fhelp">Leyendo ${esc(f.name)}…</div>`;
      try { step2(await apiUpload(`/api/imports/${spec.key}/upload`, f)); }
      catch (ex) { $("#err", body).innerHTML = `<div class="fwarn">${esc(ex.message)}</div>`; }
    });
  }

  /* ---- 2. mapeo de columnas ---- */
  function step2(up) {
    const opt = (sel) => `<option value="">— ignorar —</option>` + up.headers
      .map(h => `<option value="${esc(h)}" ${h === sel ? "selected" : ""}>${esc(h)}</option>`).join("");
    body.innerHTML = `${head(2)}
      <p class="sub"><b>${esc(up.filename)}</b> — ${up.row_count} fila(s). Confirmá a qué campo corresponde cada columna.</p>
      <div class="card pad" style="margin-bottom:12px">
        <label class="fld">Formato de números</label>
        <div class="radios">
          <label><input type="radio" name="decfmt" value="es" checked> 1.234,56 (Argentina)</label>
          <label><input type="radio" name="decfmt" value="en"> 1,234.56 (inglés)</label>
        </div>
        <div class="fhelp">No se adivina: con un solo separador "1.500" puede ser 1500 o 1,5.</div>
      </div>
      <table><thead><tr><th>Campo</th><th>Columna del archivo</th></tr></thead>
        <tbody>${spec.fields.map(f => `<tr>
          <td>${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ""}
              ${f.help ? `<div class="fhelp">${esc(f.help)}</div>` : ""}</td>
          <td><select data-key="${esc(f.key)}">${opt(up.suggested_mapping[f.key])}</select></td>
        </tr>`).join("")}</tbody></table>
      <div id="err"></div>
      <div class="toolbar" style="justify-content:flex-end">
        <button class="btn primary" id="next">Previsualizar<svg class="ic"><use href="#i-arrow-right"/></svg></button>
      </div>`;
    $("#next", body).addEventListener("click", async () => {
      const mapping = {};
      $$("[data-key]", body).forEach(s => { if (s.value) mapping[s.dataset.key] = s.value; });
      const opts = {
        mapping,
        decimal_format: body.querySelector('[name="decfmt"]:checked').value,
        create_missing: true,
      };
      try { step3(up, opts, await api("POST", `/api/imports/batches/${up.batch_id}/preview`, opts)); }
      catch (ex) { $("#err", body).innerHTML = `<div class="fwarn">${esc(ex.message)}</div>`; }
    });
  }

  /* ---- 3. vista previa + confirmación ---- */
  function step3(up, opts, pv) {
    const errRows = pv.errors.length ? `
      <div class="card pad" style="margin-bottom:12px">
        <b style="color:var(--danger)">Filas con problemas (${pv.errors.length})</b>
        <div class="errlist">${pv.errors.slice(0, 50).map(e =>
          `<div>Fila ${e.row}: ${esc(e.message)}</div>`).join("")}
          ${pv.errors.length > 50 ? `<div class="fhelp">…y ${pv.errors.length - 50} más.</div>` : ""}</div>
        <div class="fhelp" style="margin-top:8px">Corregí el archivo y volvé a subirlo. No se importa nada hasta que no haya errores.</div>
      </div>` : "";

    const missing = pv.missing_refs.length ? `
      <div class="card pad" style="margin-bottom:12px">
        <b>No existen todavía en el catálogo</b>
        <div class="fhelp" style="margin:4px 0 8px">Se crean automáticamente al confirmar.</div>
        <div class="checklist">${pv.missing_refs.map(m =>
          `<label><input type="checkbox" checked disabled> ${esc(m.label)}: <b>${esc(m.name)}</b></label>`).join("")}</div>
      </div>` : "";

    body.innerHTML = `${head(3)}
      <div class="stats">
        <div class="stat"><div class="k">Se crean</div><div class="v">${pv.to_create}</div></div>
        <div class="stat"><div class="k">Se actualizan</div><div class="v">${pv.to_update}</div></div>
        <div class="stat"><div class="k">Con error</div><div class="v" style="color:${pv.errors.length ? "var(--danger)" : "inherit"}">${pv.errors.length}</div></div>
      </div>
      ${errRows}${missing}
      <div id="err"></div>
      <div class="toolbar" style="justify-content:space-between">
        <button class="btn" id="back"><svg class="ic"><use href="#i-arrow-left"/></svg>Volver</button>
        <button class="btn primary" id="go" ${pv.ok ? "" : "disabled"}>
          ${pv.ok ? `Confirmar ${pv.to_create + pv.to_update} fila(s)` : "Corregí los errores para continuar"}</button>
      </div>`;
    $("#back", body).addEventListener("click", () => step2(up));
    const go = $("#go", body);
    if (go && pv.ok) go.addEventListener("click", async () => {
      go.disabled = true;
      try {
        const res = await api("POST", `/api/imports/batches/${up.batch_id}/commit`, opts);
        const created = Object.entries(res.created_refs || {})
          .map(([k, v]) => `${k}: ${v.join(", ")}`).join(" · ");
        toast(`Importado — ${res.created} nuevo(s), ${res.updated} actualizado(s)`, "ok");
        if (created) toast("Se crearon " + created, "ok");
        close();
        if (onDone) await onDone();
      } catch (ex) {
        go.disabled = false;
        $("#err", body).innerHTML = `<div class="fwarn">${esc(ex.message)}</div>`;
      }
    });
  }
}

    can("suppliers:read") ? idMap("/api/suppliers") : Promise.resolve({}),
    can("pricing:read") ? idMap("/api/price-categories") : Promise.resolve({}),
    can("pricing:read") ? idMap("/api/price-lists") : Promise.resolve({}),
    can("company:read") ? api("GET", "/api/company/settings").catch(() => ({})) : Promise.resolve({}),
  ]);
  const defaultPriceListId = settings.default_price_list_id || "";
  const filters = { product_type_id:"", brand_id:"", model_id:"", supplier_id:"" };
  let showInactive = false;

  const baseFields = () => [
    { key:"code", label:"Código", required:true },
    { key:"product_type_id", label:"Tipo de producto", type:"select", required:true, valueType:"int", optionsFrom:{ endpoint:"/api/product-types" }, quickCreate:"product_types" },
    { key:"supplier_id", label:"Proveedor", type:"select", valueType:"int", optionsFrom:{ endpoint:"/api/suppliers" } },
    { key:"brand_id", label:"Marca", type:"select", valueType:"int", optionsFrom:{ endpoint:"/api/brands" }, quickCreate:"brands" },
    { key:"model_id", label:"Modelo", type:"select", valueType:"int", optionsFrom:{ endpoint:"/api/product-models" }, quickCreate:"product_models" },
    { key:"color", label:"Color" },
    { key:"min_stock", label:"Stock mínimo", type:"decimal", step:"0.01" },
    // --- precio de venta ---
    { key:"pricing_mode", label:"Precio de venta", type:"radio", full:true, default:"price_list",
      options:[ { value:"price_list", label:"Por lista de precios" }, { value:"manual", label:"Manual" } ] },
    { key:"sale_price", label:"Precio", type:"decimal", step:"0.01",
      showIf:(v) => v.pricing_mode === "manual" },
    { key:"price_list_id", label:"Lista de precios", type:"select", valueType:"int",
      optionsFrom:{ endpoint:"/api/price-lists" },
      showIf:(v) => v.pricing_mode !== "manual",
      help:"Vacío = se usa la lista por defecto de la empresa." },
    { key:"price_category_id", label:"Categoría de precio", type:"select", valueType:"int",
      optionsFrom:{ endpoint:"/api/price-categories" },
      showIf:(v) => v.pricing_mode !== "manual" },
    { key:"description", label:"Descripción", type:"textarea", full:true },
  ];

  /* Modelo depends on the chosen type, Marca on the chosen supplier. Both are
     repopulated live as those selects change. */
  async function wireDependentSelects(form) {
    const typeSel  = form.querySelector('[name="product_type_id"]');
    const modelSel = form.querySelector('[name="model_id"]');
    const supSel   = form.querySelector('[name="supplier_id"]');
    const brandSel = form.querySelector('[name="brand_id"]');

    // Keeps the current value visible even when it falls outside the new list,
    // so saving an untouched form never silently drops it.
    const keepCurrent = (sel, opts, map, note) => {
      const cur = sel.value;
      if (cur && !opts.some(o => String(o.value) === cur)) {
        opts = opts.concat([{ value: cur, label: `${map[cur] || ("#" + cur)}${note}` }]);
        return { opts, outsider: map[cur] || ("#" + cur) };
      }
      return { opts, outsider: null };
    };

    const setWarn = (sel, msg) => {
      const row = sel.closest(".form-row");
      let w = row.querySelector(".fwarn");
      if (!msg) { if (w) w.remove(); return; }
      if (!w) { w = el(`<div class="fwarn"></div>`); row.appendChild(w); }
      w.textContent = msg;
    };

    async function refreshModels() {
      const t = typeSel.value;
      const rows = await api("GET", "/api/product-models" + (t ? `?product_type_id=${t}` : "")).catch(() => []);
      const { opts } = keepCurrent(modelSel, rows.map(r => ({ value:r.id, label:r.name })),
                                   modelMap, " (otro tipo)");
      setSelectOptions(modelSel, opts);
    }

    async function refreshBrands() {
      const s = supSel.value;
      const rows = await api("GET", s ? `/api/suppliers/${s}/brands` : "/api/brands").catch(() => []);
      const { opts, outsider } = keepCurrent(brandSel, rows.map(r => ({ value:r.id, label:r.name })),
                                             brandMap, " (fuera del proveedor)");
      setSelectOptions(brandSel, opts);
      setWarn(brandSel, outsider && s
        ? `"${outsider}" no está asociada a este proveedor. Se conserva, pero conviene asociarla en Proveedores.`
        : null);
    }

    /* Live preview of the price the chosen list + category resolves to, so you
       are not saving blind. */
    const listSel = form.querySelector('[name="price_list_id"]');
    const catSel  = form.querySelector('[name="price_category_id"]');
    async function previewPrice() {
      const row = catSel.closest(".form-row");
      let hint = row.querySelector(".pricehint");
      if (!hint) { hint = el(`<div class="pricehint"></div>`); row.appendChild(hint); }
      const cat = catSel.value;
      if (!cat) { hint.textContent = "Elegí una categoría para ver el precio."; return; }
      const listId = listSel.value || defaultPriceListId;
      if (!listId) { hint.textContent = "Sin lista propia ni lista por defecto en Empresa."; return; }
      const items = await api("GET", `/api/price-lists/${listId}/items`).catch(() => []);
      const hit = items.find(i => String(i.price_category_id) === cat);
      hint.innerHTML = hit
        ? `Precio resultante: <b>${fmtMoney(hit.price)}</b>`
        : "Esa lista todavía no tiene precio para esta categoría.";
    }

    typeSel.addEventListener("change", refreshModels);
    supSel.addEventListener("change", refreshBrands);
    listSel.addEventListener("change", previewPrice);
    catSel.addEventListener("change", previewPrice);
    form.addEventListener("change", (e) => {
      if (e.target.name === "pricing_mode") previewPrice();
    });
    await Promise.all([refreshModels(), refreshBrands(), previewPrice()]);
  }

  async function load() {
    const qs = new URLSearchParams();
    for (const [k,v] of Object.entries(filters)) if (v) qs.set(k, v);
    if (showInactive) qs.set("include_inactive", "true");
    const list = await api("GET", "/api/products" + (qs.toString() ? "?" + qs : ""));
    paint(list);
  }

  function openForm(mode, row) {
    let fields = baseFields();
    if (mode === "create") fields = fields.concat([{ key:"current_cost", label:"Costo inicial", type:"decimal", step:"0.01", help:"Después de crear, cambiá el costo desde el menú ⋯ de la fila (queda auditado)." }]);
    else fields = fields.concat([{ key:"is_active", label:"Activo", type:"checkbox" }]);
    formModal({ title: (mode==="edit"?"Editar producto":"Nuevo producto"), fields, values: row || {}, grid:true,
      onReady: wireDependentSelects,
      onSubmit: async (payload) => {
        if (mode === "edit") await api("PUT", "/api/products/" + row.id, payload);
        else await api("POST", "/api/products", payload);
        clearOptions(); toast("Guardado", "ok"); await load();
      } });
  }

  function costModal(row) {
    formModal({ title: `Cambiar costo — ${row.code}`, confirmLabel:"Guardar costo",
      fields: [ { key:"new_cost", label:"Costo nuevo", type:"decimal", step:"0.01", required:true }, { key:"note", label:"Nota", type:"textarea" } ],
      values: { new_cost: row.current_cost },
      onSubmit: async (payload) => { await api("POST", `/api/products/${row.id}/cost`, payload); toast("Costo actualizado", "ok"); await load(); } });
  }

  async function historyModal(row) {
    const hist = await api("GET", `/api/products/${row.id}/cost-history`);
    const body = el(`<div>${renderTable(
      [ { key:"changed_at", label:"Fecha", type:"datetime" },
        { key:"old_cost", label:"Anterior", type:"money", align:"right" },
        { key:"new_cost", label:"Nuevo", type:"money", align:"right" },
        { key:"note", label:"Nota" } ], hist)}</div>`);
    openModal({ title:`Historial de costos — ${row.code}`, body, wide:true });
  }

  async function stockModal(row) {
    const levels = await api("GET", `/api/stock/levels?product_id=${row.id}`).catch(() => []);
    const bmap = can("branches:read") ? await idMap("/api/branches") : {};
    const body = el(`<div>${renderTable(
      [ { key:"branch_id", label:"Sucursal", render:(v)=>esc(bmap[v] || ("#"+v)) },
        { key:"quantity", label:"Cant.", type:"num", align:"right" },
        { key:"min_stock", label:"Mín", type:"num", align:"right" } ], levels)}</div>`);
    openModal({ title:`Stock — ${row.code}${row.description ? " · " + row.description : ""}`, body });
  }

  /* Only the two everyday actions are labelled; the rest live in the "⋯" menu.
     Five buttons per row cost ~390px — a quarter of the grid — and pushed it
     into a horizontal scroll. */
  function actions(r) {
    let h = "";
    if (can("stock:read"))
      h += `<button class="btn sm" data-act="stock" data-id="${r.id}"><svg class="ic"><use href="#i-box"/></svg>Stock</button>`;
    if (writable)
      h += `<button class="btn sm" data-act="edit" data-id="${r.id}"><svg class="ic"><use href="#i-pencil"/></svg>Editar</button>`;
    h += `<button class="btn sm ico" title="Más acciones" data-act="more" data-id="${r.id}"><svg class="ic"><use href="#i-more"/></svg></button>`;
    return h;
  }

  function rowMenu(btn, row) {
    openRowMenu(btn, [
      { icon:"i-clock", label:"Historial de costos", onClick:() => historyModal(row) },
      writable && { icon:"i-dollar", label:"Cambiar costo", onClick:() => costModal(row) },
      writable && { sep:true },
      writable && (row.is_active
        ? { icon:"i-ban", label:"Desactivar", danger:true, onClick:() => confirmDanger({
            title:"Desactivar producto", message:`¿Desactivar "${row.code}"?`,
            confirmLabel:"Desactivar",
            onConfirm: async () => { await api("DELETE", "/api/products/" + row.id); toast("Desactivado","ok"); load(); } }) }
        : { icon:"i-rotate", label:"Restaurar", onClick: async () => {
            await api("PUT", "/api/products/" + row.id, { is_active:true }); toast("Restaurado","ok"); load(); } }),
    ].filter(Boolean));
  }

  function selectFilter(key, map, label) {
    const opts = Object.entries(map).map(([id,name]) => `<option value="${id}" ${filters[key]===id?"selected":""}>${esc(name)}</option>`).join("");
    return `<select class="inp-sm" data-filter="${key}" style="width:auto"><option value="">${esc(label)}</option>${opts}</select>`;
  }

  function paint(list) {
    view.innerHTML = `
      <div class="page-head"><div><h2>Productos</h2><div class="sub">${list.length} producto(s)</div></div>
        <div class="toolbar" style="margin:0">
          <button class="btn" id="expBtn"><svg class="ic"><use href="#i-download"/></svg>Exportar<svg class="ic"><use href="#i-chevron-down"/></svg></button>
          ${writable ? `<button class="btn" id="impProd"><svg class="ic"><use href="#i-upload"/></svg>Importar productos</button>
                        <button class="btn" id="impCost"><svg class="ic"><use href="#i-upload"/></svg>Actualizar costos</button>
                        <button class="btn primary" id="newBtn"><svg class="ic"><use href="#i-plus"/></svg>Nuevo producto</button>` : ""}
        </div></div>
      <div class="toolbar">
        ${selectFilter("product_type_id", typeMap, "Todos los tipos")}
        ${selectFilter("brand_id", brandMap, "Todas las marcas")}
        ${selectFilter("model_id", modelMap, "Todos los modelos")}
        ${can("suppliers:read") ? selectFilter("supplier_id", supMap, "Todos los proveedores") : ""}
        <label class="switch"><input type="checkbox" id="inact" ${showInactive?"checked":""}> Ver inactivos</label>
      </div>
      ${renderTable([
        { key:"code", label:"Código", mono:true },
        { key:"description", label:"Descripción", trunc:true,
          render:(v)=>v ? `<span title="${esc(v)}">${esc(v)}</span>` : "—" },
        { key:"product_type_id", label:"Tipo", render:(v)=>esc(typeMap[v]||"—") },
        { key:"brand_id", label:"Marca", render:(v)=>esc(brandMap[v]||"—") },
        { key:"model_id", label:"Modelo", priority:2, render:(v)=>esc(modelMap[v]||"—") },
        { key:"price_category_id", label:"Cat.", priority:3, render:(v)=>v?badge(catMap[v]||("#"+v),"gray"):"—" },
        { key:"resolved_sale_price", label:"Precio", align:"right", render:(v, r) => v != null
            ? `<span title="${esc(r.price_source === "manual" ? "Precio manual" : ("Lista: " + (listMap[r.price_list_id] || "por defecto")))}">${fmtMoney(v)}</span>`
            : `<span class="badge gray" title="${esc(r.price_reason || "")}">sin precio</span>` },
        { key:"current_cost", label:"Costo", type:"money", align:"right", priority:2 },
        { key:"min_stock", label:"Mín", type:"num", align:"right", priority:3 },
        { key:"is_active", label:"Estado", type:"bool", priority:3 },
      ], list, actions)}`;
    // Exporting mirrors what is on screen: same filters, same inactive toggle.
    $("#expBtn", view).addEventListener("click", (e) => openExportMenu(
      e.currentTarget,
      [{ key:"products", label:"Productos" }, { key:"costs", label:"Costos" }],
      { ...filters, include_inactive: showInactive ? "true" : "" }));
    const nb = $("#newBtn", view); if (nb) nb.addEventListener("click", () => openForm("create"));
    const ip = $("#impProd", view);
    if (ip) ip.addEventListener("click", () => openImportWizard("products", async () => { clearOptions(); await load(); }));
    const icost = $("#impCost", view);
    if (icost) icost.addEventListener("click", () => openImportWizard("costs", load));
    $("#inact", view).addEventListener("change", e => { showInactive = e.target.checked; load(); });
    $$("[data-filter]", view).forEach(s => s.addEventListener("change", () => { filters[s.dataset.filter] = s.value; load(); }));
    $$("[data-act]", view).forEach(b => b.addEventListener("click", async () => {
      const row = list.find(x => String(x.id) === b.dataset.id), act = b.dataset.act;
      if (act === "edit") openForm("edit", row);
      else if (act === "stock") stockModal(row);
      else if (act === "more") rowMenu(b, row);
    }));
  }
  await load();
}

    { label:"Tipos de producto", render: (n) => resourceView(n, CONFIG.product_types) },
